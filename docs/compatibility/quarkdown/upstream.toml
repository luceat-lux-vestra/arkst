# Quarkdown Upstream Manifest
# This file declares the verified compatibility baseline for Arkst's Quarkdown evidence.
# It is used by automated tooling to detect upstream drift.
# 
# IMPORTANT: `supported_baseline` is the historical serialized field name for
# the VERIFIED COMPATIBILITY BASELINE, not the tracked upstream target.
# The latest stable release is fetched by the observer as `observed_tag` and
# automatically becomes the adaptation target. Changing this field requires
# human-reviewed conformance evidence (see ADR-0016).

schema_version = 1

[upstream]
id = "quarkdown"
repository = "iamgio/quarkdown"
release_channel = "stable"
supported_baseline = "v2.5.1"
