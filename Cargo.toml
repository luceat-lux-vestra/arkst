[workspace]
resolver = "2"
members = [
    "crates/arkst-core",
    "crates/arkst-engine",
    "crates/arkst-compat",
    "crates/arkst-diagnostics",
    "crates/arkst-ir",
    "crates/arkst-project",
    "crates/arkst-source",
    "crates/arkst-quarkdown",
    "crates/arkst-markdown",
    "crates/arkst-typst",
    "crates/arkst-typst-subprocess",
    "crates/arkst-typst-inprocess",
    "crates/arkst-cli",
    "crates/arkst-test-support",
    "tools/markdown-compat",
    "tools/upstream-watch",
]

exclude = [
    "tools/spikes/typst-in-process",
    "tools/spikes/typst-subprocess",
]

[workspace.package]
edition = "2021"
rust-version = "1.92.0"
license = "Apache-2.0"
license-file = "LICENSE"
homepage = "https://github.com/luceat-lux-vestra/arkst"
repository = "https://github.com/luceat-lux-vestra/arkst"
authors = ["Arkst Authors"]

[workspace.dependencies]
arkst-core = { path = "crates/arkst-core" }
arkst-engine = { path = "crates/arkst-engine" }
arkst-compat = { path = "crates/arkst-compat" }
arkst-diagnostics = { path = "crates/arkst-diagnostics" }
arkst-ir = { path = "crates/arkst-ir" }
arkst-project = { path = "crates/arkst-project" }
arkst-source = { path = "crates/arkst-source" }
arkst-quarkdown = { path = "crates/arkst-quarkdown" }
arkst-markdown = { path = "crates/arkst-markdown" }
arkst-typst = { path = "crates/arkst-typst" }
arkst-typst-subprocess = { path = "crates/arkst-typst-subprocess" }
arkst-typst-inprocess = { path = "crates/arkst-typst-inprocess" }
arkst-cli = { path = "crates/arkst-cli" }
arkst-test-support = { path = "crates/arkst-test-support" }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1.1"
anyhow = "1"
thiserror = "2"
same-file = "1.0.6"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
quick-xml = "0.42"
insta = "1"
tempfile = "3"
rushdown = { git = "https://github.com/yuin/rushdown.git", rev = "e5eb4e4446541ea0ed53111c1b37e779283ff57c", default-features = false, features = ["std", "html-entities"] }
libm = { version = "0.2.16", default-features = false }
typst = "0.15.1"
typst-syntax = "0.15.1"
typst-assets = { version = "0.15.1", features = ["fonts"] }
typst-layout = "0.15.1"
typst-pdf = "0.15.1"

[profile.release]
opt-level = 2
debug = 1
strip = "symbols"

[patch.crates-io.citationberg]
# citationberg has merged the quick-xml 0.41 security fix, but has not yet
# published a release containing it. Pin the merged upstream commit until a
# crates.io release can replace this patch.
git = "https://github.com/typst/citationberg.git"
rev = "06a591e2f237d25e1dfdedac3f3d1494c496c52d"
