[workspace]
resolver = "2"
members = [
    "crates/scribium-core",
    "crates/scribium-project",
    "crates/scribium-source",
    "crates/scribium-quarkdown",
    "crates/scribium-markdown",
    "crates/scribium-typst",
    "crates/scribium-cli",
    "crates/scribium-test-support",
    "tools/markdown-compat",
    "tools/upstream-watch",
]

exclude = [
    "tools/spikes/typst-in-process",
    "tools/spikes/typst-subprocess",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
license-file = "LICENSE"
homepage = "https://github.com/luceat-lux-vestra/scribium"
repository = "https://github.com/luceat-lux-vestra/scribium"
authors = ["Scribium Authors"]

[workspace.dependencies]
scribium-core = { path = "crates/scribium-core" }
scribium-project = { path = "crates/scribium-project" }
scribium-source = { path = "crates/scribium-source" }
scribium-quarkdown = { path = "crates/scribium-quarkdown" }
scribium-markdown = { path = "crates/scribium-markdown" }
scribium-typst = { path = "crates/scribium-typst" }
scribium-cli = { path = "crates/scribium-cli" }
scribium-test-support = { path = "crates/scribium-test-support" }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1.1"
anyhow = "1"
thiserror = "2"
same-file = "1.0.6"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
quick-xml = "0.41"
insta = "1"
tempfile = "3"
rushdown = { git = "https://github.com/yuin/rushdown.git", rev = "e5eb4e4446541ea0ed53111c1b37e779283ff57c", default-features = false, features = ["std", "html-entities"] }
libm = { version = "0.2.16", default-features = false }

[profile.release]
opt-level = 2
debug = 1
strip = "symbols"
