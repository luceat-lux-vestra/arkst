rules:
  dangerous-triggers:
    ignore:
      # This workflow intentionally uses pull_request_target so fork PRs can
      # update trusted repository metadata. It executes only the trusted base
      # workflow, performs no checkout or PR-head execution, and holds narrowly
      # scoped API write permissions. Repository policy independently rejects
      # any future checkout in a pull_request_target workflow.
      - pr-labeler.yml
