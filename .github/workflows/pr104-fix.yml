name: PR 104 semantic fix

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.number == 104
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/quarkdown-evaluator-semantics-expansion
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt
      - name: Apply bounded v2.5.1 takeif fix
        shell: python
        run: |
          from pathlib import Path
          import re

          evaluator = Path('crates/scribium-core/src/evaluator.rs')
          text = evaluator.read_text()
          start = text.index('    fn evaluate_optionality_callback(')
          end = text.index('    fn evaluate_range(', start)
          section = text[start:end]
          pattern = r'(?m)^(\s*)if matches!\(value, IrValue::None\) \{\n\1    return CallOutcome::Value\(IrValue::None\);\n\1\}'
          replacement = r'\1if name == "ifpresent" && matches!(value, IrValue::None) {\n\1    return CallOutcome::Value(IrValue::None);\n\1}'
          section, count = re.subn(pattern, replacement, section, count=1)
          if count != 1:
              raise SystemExit(f'expected one optionality None short-circuit, found {count}')
          text = text[:start] + section + text[end:]
          text = text.replace(
              '/// v2.5.1 Optionality module. The value is resolved before a callback is\n    /// invoked, and a semantic `None` short-circuits the callback entirely.\n    /// This keeps the operation lazy while reusing the shared callable scope,\n    /// capture, destructuring, and failure-atomicity path.',
              '/// v2.5.1 Optionality module. `.ifpresent` short-circuits a semantic `None`\n    /// before invoking its mapping callback, while `.takeif` always invokes its\n    /// condition, including for `None`. Both reuse the shared callable scope,\n    /// capture, destructuring, and failure-atomicity path.',
              1,
          )
          evaluator.write_text(text)

          lib = Path('crates/scribium-core/src/lib.rs')
          text = lib.read_text()
          marker = '    #[test]\n    fn compile_optionality_callback_failure_is_atomic_and_source_backed() {'
          if marker not in text:
              raise SystemExit('optionality failure test marker not found')
          regression = '\n'.join([
              '    #[test]',
              '    fn compile_takeif_none_still_invokes_condition() {',
              '        let source = ".takeif {.none} {@lambda value: .sum {true} {2}}\\n";',
              '        let (result, source_id) = compile_source(source);',
              '        assert_eq!(result.diagnostics.len(), 1, "{result:?}");',
              '        assert_eq!(result.diagnostics[0].code, "E3001");',
              '        let failure_start = source.find(".sum").expect("callback failure span");',
              '        assert_eq!(',
              '            result.diagnostics[0].primary,',
              '            Some(crate::source::SourceSpan::new(',
              '                source_id,',
              '                failure_start,',
              '                failure_start + ".sum {true} {2}".len()',
              '            ))',
              '        );',
              '        assert!(result.ir.nodes.is_empty(), "{result:?}");',
              '    }',
              '',
              '',
          ])
          lib.write_text(text.replace(marker, regression + marker, 1))

          replacements = {
              Path('docs/compatibility/quarkdown/SPEC_SOURCES.md'): [
                  ('`.takeif` evaluates\nits condition only for a present value, requires a Boolean result, and returns\nthe original value or `None` accordingly. These are lazy callback contracts,\nnot negative/zero/positive comparators or text transformations.',
                   '`.takeif` always\nevaluates its condition, including for `None`, requires a Boolean result, and\nreturns the original value or `None` accordingly. Only `.ifpresent` has an\nabsence short-circuit; `.takeif` remains callback-observable for `None`.'),
              ],
              Path('docs/compatibility/quarkdown/GAP_INVENTORY.md'): [
                  ('`.ifpresent(value, mapping)`, and `.takeif(value, condition)`. The latter two\nare lazy with respect to the callback: a `None` value returns `None` without\ninvoking the callback, `.ifpresent` returns the callback\'s typed result, and\n`.takeif` requires a Boolean callback result and otherwise returns the original\nvalue or `None`.',
                   '`.ifpresent(value, mapping)`, and `.takeif(value, condition)`. `.ifpresent`\nreturns `None` without invoking its mapping callback for a `None` value and\notherwise returns the callback\'s typed result. `.takeif` invokes its condition\nfor every value, including `None`, requires a Boolean callback result, and\nreturns the original value or `None`.'),
                  ('lazy callback execution, Boolean-only `.takeif`, source-backed evaluator errors',
                   'the `.ifpresent` absence short-circuit, Boolean-only `.takeif` callback execution, source-backed evaluator errors'),
              ],
              Path('docs/compatibility/quarkdown/README.md'): [
                  ('`.takeif` invokes its\none-argument condition only for a present value, requires a Boolean result, and\nreturns the original value or semantic `None`.',
                   '`.takeif` invokes its\none-argument condition for every value, including `None`, requires a Boolean\nresult, and returns the original value or semantic `None`.'),
                  ('Typed `IrValue::None`; lazy callbacks through first-class `@lambda` or headerless indented bodies; Boolean-only `.takeif`; source-backed atomic failures',
                   'Typed `IrValue::None`; `.ifpresent` absence short-circuit; first-class `@lambda` or headerless indented callbacks; Boolean-only `.takeif`; source-backed atomic failures'),
                  ('covered by `compile_optionality_*` tests for lazy absence, named/mixed callback',
                   'covered by `compile_optionality_*` tests for `.ifpresent` lazy absence, named/mixed callback'),
              ],
          }
          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'expected text not found in {path}: {old[:100]!r}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
      - name: Format and regression test
        run: |
          cargo fmt --all -- --check
          cargo test -p scribium-core --all-features optionality
          cargo test -p scribium-core --all-features takeif_none
          cargo check -p scribium-core -p scribium-typst --target wasm32-unknown-unknown --all-features
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr104-fix.yml
          git add crates/scribium-core/src/evaluator.rs crates/scribium-core/src/lib.rs docs/compatibility/quarkdown/SPEC_SOURCES.md docs/compatibility/quarkdown/GAP_INVENTORY.md docs/compatibility/quarkdown/README.md
          git commit -m "fix(quarkdown): preserve takeif callback semantics"
          git push origin HEAD:agent/quarkdown-evaluator-semantics-expansion
