name: PR 104 semantic fix

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.number == 104
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/quarkdown-evaluator-semantics-expansion
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt
      - name: Apply bounded v2.5.1 takeif fix
        shell: python
        run: |
          from pathlib import Path

          evaluator = Path('crates/scribium-core/src/evaluator.rs')
          text = evaluator.read_text()
          start = text.index('    fn evaluate_optionality_callback(')
          end = text.index('    fn evaluate_range(', start)
          section = text[start:end]
          old = '''        if matches!(value, IrValue::None) {
              return CallOutcome::Value(IrValue::None);
          }
          '''
          if old not in section:
              raise SystemExit('expected optionality None short-circuit not found')
          section = section.replace(
              old,
              '''        if name == "ifpresent" && matches!(value, IrValue::None) {
              return CallOutcome::Value(IrValue::None);
          }
          ''',
              1,
          )
          text = text[:start] + section + text[end:]
          text = text.replace(
              '''    /// Evaluates the bounded callback-based optionality functions from the
          /// v2.5.1 Optionality module. The value is resolved before a callback is
          /// invoked, and a semantic `None` short-circuits the callback entirely.
          /// This keeps the operation lazy while reusing the shared callable scope,
          /// capture, destructuring, and failure-atomicity path.
          ''',
              '''    /// Evaluates the bounded callback-based optionality functions from the
          /// v2.5.1 Optionality module. `.ifpresent` short-circuits a semantic `None`
          /// before invoking its mapping callback, while `.takeif` always invokes its
          /// condition, including for `None`. Both reuse the shared callable scope,
          /// capture, destructuring, and failure-atomicity path.
          ''',
              1,
          )
          evaluator.write_text(text)

          lib = Path('crates/scribium-core/src/lib.rs')
          text = lib.read_text()
          marker = '''    #[test]
          fn compile_optionality_callback_failure_is_atomic_and_source_backed() {
          '''
          if marker not in text:
              raise SystemExit('optionality failure test marker not found')
          regression = '''    #[test]
          fn compile_takeif_none_still_invokes_condition() {
              let source = ".takeif {.none} {@lambda value: .sum {true} {2}}\\n";
              let (result, source_id) = compile_source(source);
              assert_eq!(result.diagnostics.len(), 1, "{result:?}");
              assert_eq!(result.diagnostics[0].code, "E3001");
              let failure_start = source.find(".sum").expect("callback failure span");
              assert_eq!(
                  result.diagnostics[0].primary,
                  Some(crate::source::SourceSpan::new(
                      source_id,
                      failure_start,
                      failure_start + ".sum {true} {2}".len()
                  ))
              );
              assert!(result.ir.nodes.is_empty(), "{result:?}");
          }

          '''
          text = text.replace(marker, regression + marker, 1)
          lib.write_text(text)

          replacements = {
              Path('docs/compatibility/quarkdown/SPEC_SOURCES.md'): [(
                  '''`.ifpresent` returns `None` without invoking its mapping lambda when the value
          is absent; otherwise it returns the lambda's typed result. `.takeif` evaluates
          its condition only for a present value, requires a Boolean result, and returns
          the original value or `None` accordingly. These are lazy callback contracts,
          not negative/zero/positive comparators or text transformations.
          ''',
                  '''`.ifpresent` returns `None` without invoking its mapping lambda when the value
          is absent; otherwise it returns the lambda's typed result. `.takeif` always
          evaluates its condition, including for `None`, requires a Boolean result, and
          returns the original value or `None` accordingly. Only `.ifpresent` has an
          absence short-circuit; `.takeif` remains callback-observable for `None`.
          ''')],
              Path('docs/compatibility/quarkdown/GAP_INVENTORY.md'): [(
                  '''The v2.5.1 `Optionality.kt` contract defines `.none`, `.isnone`, `.otherwise`,
          `.ifpresent(value, mapping)`, and `.takeif(value, condition)`. The latter two
          are lazy with respect to the callback: a `None` value returns `None` without
          invoking the callback, `.ifpresent` returns the callback's typed result, and
          `.takeif` requires a Boolean callback result and otherwise returns the original
          value or `None`.
          ''',
                  '''The v2.5.1 `Optionality.kt` contract defines `.none`, `.isnone`, `.otherwise`,
          `.ifpresent(value, mapping)`, and `.takeif(value, condition)`. `.ifpresent`
          returns `None` without invoking its mapping callback for a `None` value and
          otherwise returns the callback's typed result. `.takeif` invokes its condition
          for every value, including `None`, requires a Boolean callback result, and
          returns the original value or `None`.
          '''),(
                  'lazy callback execution, Boolean-only `.takeif`, source-backed evaluator errors',
                  'the `.ifpresent` absence short-circuit, Boolean-only `.takeif` callback execution, source-backed evaluator errors')],
              Path('docs/compatibility/quarkdown/README.md'): [(
                  '''`.ifpresent` maps a non-`None` value through a one-argument lambda and returns
          `None` without invoking that lambda for an absent value. `.takeif` invokes its
          one-argument condition only for a present value, requires a Boolean result, and
          returns the original value or semantic `None`.
          ''',
                  '''`.ifpresent` maps a non-`None` value through a one-argument lambda and returns
          `None` without invoking that lambda for an absent value. `.takeif` invokes its
          one-argument condition for every value, including `None`, requires a Boolean
          result, and returns the original value or semantic `None`.
          '''),(
                  '| Optionality and callback values | `.none`, `.isnone`, `.otherwise`, `.ifpresent`, `.takeif` | Typed `IrValue::None`; lazy callbacks through first-class `@lambda` or headerless indented bodies; Boolean-only `.takeif`; source-backed atomic failures | Implemented (bounded v2.5.1 slice) |',
                  '| Optionality and callback values | `.none`, `.isnone`, `.otherwise`, `.ifpresent`, `.takeif` | Typed `IrValue::None`; `.ifpresent` absence short-circuit; first-class `@lambda` or headerless indented callbacks; Boolean-only `.takeif`; source-backed atomic failures | Implemented (bounded v2.5.1 slice) |'),(
                  'covered by `compile_optionality_*` tests for lazy absence, named/mixed callback',
                  'covered by `compile_optionality_*` tests for `.ifpresent` lazy absence, named/mixed callback')],
          }
          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'expected text not found in {path}: {old[:80]!r}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
      - name: Format and regression test
        run: |
          cargo fmt --all -- --check
          cargo test -p scribium-core --all-features optionality
          cargo test -p scribium-core --all-features takeif_none
          cargo check -p scribium-core -p scribium-typst --target wasm32-unknown-unknown --all-features
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr104-fix.yml
          git add crates/scribium-core/src/evaluator.rs crates/scribium-core/src/lib.rs docs/compatibility/quarkdown/SPEC_SOURCES.md docs/compatibility/quarkdown/GAP_INVENTORY.md docs/compatibility/quarkdown/README.md
          git commit -m "fix(quarkdown): preserve takeif callback semantics"
          git push origin HEAD:agent/quarkdown-evaluator-semantics-expansion
