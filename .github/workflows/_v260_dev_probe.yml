name: v260 dev probe
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect-pageformat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Inspect bounded pageformat and size conversion
        shell: bash
        run: |
          set -euo pipefail
          echo '=== PAGEFORMAT REFERENCES ==='
          grep -nF 'pageformat' crates/arkst-engine/src/evaluator.rs
          line=$(grep -nF 'if name == "pageformat"' crates/arkst-engine/src/evaluator.rs | head -1 | cut -d: -f1 || true)
          if [ -n "$line" ]; then
            start=$((line > 80 ? line - 80 : 1)); end=$((line + 260)); sed -n "${start},${end}p" crates/arkst-engine/src/evaluator.rs
          fi
          echo '=== PAGE ALIGNMENT SETTER ==='
          line=$(grep -nF 'fn set_page_alignment' crates/arkst-engine/src/evaluator.rs | head -1 | cut -d: -f1 || true)
          if [ -n "$line" ]; then start=$((line-20)); end=$((line+60)); sed -n "${start},${end}p" crates/arkst-engine/src/evaluator.rs; fi
          echo '=== SIZE CONVERSION ==='
          grep -nF 'convert_domain_with_origin' crates/arkst-engine/src/evaluator.rs | head -30 || true
          grep -nF 'DomainTarget::Size' crates/arkst-engine/src/evaluator.rs | head -30 || true
