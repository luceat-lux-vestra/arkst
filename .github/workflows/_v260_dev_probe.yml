name: v260 dev probe
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  implement-page-geometry:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Implement bounded complete page geometry and verify workspace
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def once(s, old, new, label):
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one anchor, found {count}")
              return s.replace(old, new, 1)

          # IR: typed complete geometry only. Renderer defaults stay out of IR.
          p = Path('crates/arkst-ir/src/lib.rs')
          s = p.read_text()
          old = '#[derive(Debug, Clone, PartialEq, Eq, Default, serde::Serialize, serde::Deserialize)]\npub struct IrDocumentState {'
          new = '#[derive(Debug, Clone, PartialEq, Default, serde::Serialize, serde::Deserialize)]\npub struct IrDocumentState {'
          s = once(s, old, new, 'IrDocumentState derive')
          old = '''    #[serde(default, skip_serializing_if = "Option::is_none")]
    pub page_alignment: Option<IrDocumentAlignment>,
    /// Slides-specific document configuration. `None` means no `.slides` setter committed state.
'''
          new = '''    #[serde(default, skip_serializing_if = "Option::is_none")]
    pub page_alignment: Option<IrDocumentAlignment>,
    /// Explicit complete page geometry selected by the bounded `.pageformat`
    /// width/height slice. `None` preserves document-type/backend defaults.
    #[serde(default, skip_serializing_if = "Option::is_none")]
    pub page_geometry: Option<IrPageGeometry>,
    /// Slides-specific document configuration. `None` means no `.slides` setter committed state.
'''
          s = once(s, old, new, 'IrDocumentState page geometry field')
          old = '/// Backend-neutral slides document configuration.\n'
          new = '''/// Backend-neutral complete page geometry.
///
/// This stores only explicit semantic sizes. Document-type defaults and
/// renderer-specific page dimensions remain backend-owned.
#[derive(Debug, Clone, PartialEq, serde::Serialize, serde::Deserialize)]
pub struct IrPageGeometry {
    pub width: IrSize,
    pub height: IrSize,
}

/// Backend-neutral slides document configuration.
'''
          s = once(s, old, new, 'IrPageGeometry type')
          p.write_text(s)

          # Evaluator: keep the existing invocation transaction and extend its
          # document-state journal with one owned geometry slot.
          p = Path('crates/arkst-engine/src/evaluator.rs')
          s = p.read_text()
          old = '''    IrRange, IrRawBody, IrSize, IrSizeUnit, IrSlidesConfiguration, IrStackedComponent,
'''
          new = '''    IrPageGeometry, IrRange, IrRawBody, IrSize, IrSizeUnit, IrSlidesConfiguration,
    IrStackedComponent,
'''
          s = once(s, old, new, 'evaluator IrPageGeometry import')
          old = '''    page_alignment: Option<IrDocumentAlignment>,
    slides: Option<IrSlidesConfiguration>,
    localization_tables: LocalizationTables,
'''
          new = '''    page_alignment: Option<IrDocumentAlignment>,
    page_geometry: Option<IrPageGeometry>,
    slides: Option<IrSlidesConfiguration>,
    localization_tables: LocalizationTables,
'''
          s = once(s, old, new, 'DocumentState geometry field')
          old = '''            page_alignment: None,
            slides: None,
            localization_tables: seeded_localization_tables(),
'''
          new = '''            page_alignment: None,
            page_geometry: None,
            slides: None,
            localization_tables: seeded_localization_tables(),
'''
          s = once(s, old, new, 'DocumentState default geometry')
          old = '''            page_alignment: snapshot.page_alignment,
            slides: snapshot.slides,
            localization_tables: seeded_localization_tables(),
'''
          new = '''            page_alignment: snapshot.page_alignment,
            page_geometry: snapshot.page_geometry.clone(),
            slides: snapshot.slides,
            localization_tables: seeded_localization_tables(),
'''
          s = once(s, old, new, 'DocumentState restore geometry')
          old = '''            page_alignment: self.page_alignment,
            slides: self.slides,
'''
          new = '''            page_alignment: self.page_alignment,
            page_geometry: self.page_geometry.clone(),
            slides: self.slides,
'''
          s = once(s, old, new, 'DocumentState snapshot geometry')
          old = '''    PageAlignment,
    Slides,
    LocalizationTables,
'''
          new = '''    PageAlignment,
    PageGeometry,
    Slides,
    LocalizationTables,
'''
          s = once(s, old, new, 'DocumentStateField geometry')
          old = '''    PageAlignment(Option<IrDocumentAlignment>),
    Slides(Option<IrSlidesConfiguration>),
    LocalizationTables(LocalizationTableUndo),
'''
          new = '''    PageAlignment(Option<IrDocumentAlignment>),
    PageGeometry(Option<IrPageGeometry>),
    Slides(Option<IrSlidesConfiguration>),
    LocalizationTables(LocalizationTableUndo),
'''
          s = once(s, old, new, 'DocumentStateUndo geometry')
          old = '''            DocumentStateUndo::PageAlignment(previous) => state.page_alignment = previous,
            DocumentStateUndo::Slides(previous) => state.slides = previous,
'''
          new = '''            DocumentStateUndo::PageAlignment(previous) => state.page_alignment = previous,
            DocumentStateUndo::PageGeometry(previous) => state.page_geometry = previous,
            DocumentStateUndo::Slides(previous) => state.slides = previous,
'''
          s = once(s, old, new, 'DocumentStateUndo restore geometry')
          old = '''    fn set_page_alignment(&self, value: Option<IrDocumentAlignment>) {
        self.record_document_state_undo(DocumentStateField::PageAlignment, || {
            (
                DocumentStateUndo::PageAlignment(self.document_state.borrow().page_alignment),
                0,
            )
        });
        self.document_state.borrow_mut().page_alignment = value;
    }

    fn set_slides_configuration(&self, value: Option<IrSlidesConfiguration>) {
'''
          new = '''    fn set_page_alignment(&self, value: Option<IrDocumentAlignment>) {
        self.record_document_state_undo(DocumentStateField::PageAlignment, || {
            (
                DocumentStateUndo::PageAlignment(self.document_state.borrow().page_alignment),
                0,
            )
        });
        self.document_state.borrow_mut().page_alignment = value;
    }

    fn set_page_geometry(&self, value: Option<IrPageGeometry>) {
        self.record_document_state_undo(DocumentStateField::PageGeometry, || {
            (
                DocumentStateUndo::PageGeometry(self.document_state.borrow().page_geometry.clone()),
                0,
            )
        });
        self.document_state.borrow_mut().page_geometry = value;
    }

    fn set_slides_configuration(&self, value: Option<IrSlidesConfiguration>) {
'''
          s = once(s, old, new, 'page geometry setter')

          old = '''        if name == "pageformat"
            && context.get_function(name).is_none()
            && positional_args.is_empty()
            && named_args.len() == 1
            && named_args[0].name == "alignment"
            && !matches!(&named_args[0].value, IrValue::None)
            && body.is_none()
            && raw_body.is_none()
            && lambda_parameters.is_none()
        {
            return self.evaluate_page_alignment_builtin(named_args, span, diagnostics, context);
        }
'''
          new = '''        if name == "pageformat"
            && context.get_function(name).is_none()
            && positional_args.is_empty()
            && bounded_pageformat_shape(named_args)
            && body.is_none()
            && raw_body.is_none()
            && lambda_parameters.is_none()
        {
            return self.evaluate_page_format_builtin(named_args, span, diagnostics, context);
        }
'''
          s = once(s, old, new, 'pageformat bounded dispatch')

          old = '''    fn evaluate_page_alignment_builtin(
        &self,
        named_args: &[IrNamedArg],
        span: &SourceSpan,
        diagnostics: &mut Vec<Diagnostic>,
        context: &mut EvaluationContext<'_>,
    ) -> CallOutcome {
        let evaluated_named =
            match self.evaluate_invocation_named(named_args, span, diagnostics, context) {
                Ok(values) => values,
                Err(outcome) => return outcome,
            };
        let Some(argument) = evaluated_named.into_iter().next() else {
            return CallOutcome::Unresolved;
        };
        let candidate_span = argument.arg.span;
        let value = InvocationValue {
            value: argument.arg.value,
            origin: argument.origin,
        };
        let alignment = match value_conversion::convert_document_alignment_with_origin(&value) {
            Ok(value) => value,
            Err(error) => {
                diagnostics.push(conversion_failure_diagnostic(
                    value_conversion::ConversionFailure::new(
                        error,
                        Some(candidate_span),
                        Some("alignment"),
                        None,
                        *span,
                    ),
                    Some("`.pageformat`"),
                ));
                return CallOutcome::Failed;
            }
        };
        context.set_page_alignment(Some(alignment));
        CallOutcome::NoValue
    }
'''
          new = '''    fn evaluate_page_format_builtin(
        &self,
        named_args: &[IrNamedArg],
        span: &SourceSpan,
        diagnostics: &mut Vec<Diagnostic>,
        context: &mut EvaluationContext<'_>,
    ) -> CallOutcome {
        let evaluated_named =
            match self.evaluate_invocation_named(named_args, span, diagnostics, context) {
                Ok(values) => values,
                Err(outcome) => return outcome,
            };

        let mut alignment = None;
        let mut width = None;
        let mut height = None;
        for argument in evaluated_named {
            let candidate_span = argument.arg.span;
            let parameter = argument.arg.name.clone();
            let value = InvocationValue {
                value: argument.arg.value,
                origin: argument.origin,
            };
            match parameter.as_str() {
                "alignment" => {
                    alignment = Some(
                        match value_conversion::convert_document_alignment_with_origin(&value) {
                            Ok(value) => value,
                            Err(error) => {
                                diagnostics.push(conversion_failure_diagnostic(
                                    value_conversion::ConversionFailure::new(
                                        error,
                                        Some(candidate_span),
                                        Some("alignment"),
                                        None,
                                        *span,
                                    ),
                                    Some("`.pageformat`"),
                                ));
                                return CallOutcome::Failed;
                            }
                        },
                    );
                }
                "width" | "height" => {
                    let size = match value_conversion::convert_domain_with_origin(
                        &value,
                        value_conversion::DomainTarget::Size,
                    ) {
                        Ok(value_conversion::DomainValue::Size(value)) => value,
                        Ok(_) => {
                            diagnostics.push(conversion_failure_diagnostic(
                                value_conversion::ConversionFailure::new(
                                    value_conversion::ConversionError::UnsupportedValue {
                                        target: value_conversion::ConversionTarget::Size,
                                    },
                                    Some(candidate_span),
                                    Some(parameter.clone()),
                                    None,
                                    *span,
                                ),
                                Some("`.pageformat`"),
                            ));
                            return CallOutcome::Failed;
                        }
                        Err(error) => {
                            diagnostics.push(conversion_failure_diagnostic(
                                value_conversion::ConversionFailure::new(
                                    error,
                                    Some(candidate_span),
                                    Some(parameter.clone()),
                                    None,
                                    *span,
                                ),
                                Some("`.pageformat`"),
                            ));
                            return CallOutcome::Failed;
                        }
                    };
                    if parameter == "width" {
                        width = Some(size);
                    } else {
                        height = Some(size);
                    }
                }
                _ => unreachable!("bounded pageformat shape rejected unknown parameter"),
            }
        }

        // All conversions finish before either semantic state slot is
        // published. The outer invocation transaction also restores nested
        // document-state writes if any candidate conversion fails.
        if let Some(alignment) = alignment {
            context.set_page_alignment(Some(alignment));
        }
        if let (Some(width), Some(height)) = (width, height) {
            context.set_page_geometry(Some(IrPageGeometry { width, height }));
        }
        CallOutcome::NoValue
    }
'''
          s = once(s, old, new, 'pageformat evaluator')

          old = 'fn convert_whitespace_size(\n'
          helper = '''fn bounded_pageformat_shape(named_args: &[IrNamedArg]) -> bool {
    let mut width = false;
    let mut height = false;
    let mut alignment = false;
    for argument in named_args {
        let seen = match argument.name.as_str() {
            "width" => &mut width,
            "height" => &mut height,
            "alignment" => &mut alignment,
            _ => return false,
        };
        if *seen || matches!(&argument.value, IrValue::None) {
            return false;
        }
        *seen = true;
    }
    (width && height) || (alignment && !width && !height)
}

fn convert_whitespace_size(
'''
          s = once(s, old, helper, 'bounded pageformat shape helper')
          p.write_text(s)

          # Reuse the existing typed size -> Typst unit conversion rather than
          # introducing a second page-only converter.
          p = Path('crates/arkst-typst/src/lowering.rs')
          s = p.read_text()
          s = once(s, 'fn lower_size(size: &IrSize) -> String {', 'pub(crate) fn lower_size(size: &IrSize) -> String {', 'lower_size visibility')
          p.write_text(s)

          p = Path('crates/arkst-typst/src/focus_lowering.rs')
          s = p.read_text()
          old = '''    if state.document_type == IrDocumentType::Slides {
        prelude.push_str(&format!(
            "#set page(width: {SLIDES_PAGE_WIDTH_PT}pt, height: {SLIDES_PAGE_HEIGHT_PT}pt)\\n"
        ));
        match state.slides.and_then(|slides| slides.center) {
            Some(true) => prelude.push_str("#set align(horizon)\\n"),
            Some(false) => prelude.push_str("#set align(top)\\n"),
            None => {}
        }
    }
'''
          new = '''    if let Some(geometry) = state.page_geometry.as_ref() {
        let width = lowering_base::lower_size(&geometry.width);
        let height = lowering_base::lower_size(&geometry.height);
        prelude.push_str(&format!(
            "#set page(width: {width}, height: {height})\\n"
        ));
    } else if state.document_type == IrDocumentType::Slides {
        prelude.push_str(&format!(
            "#set page(width: {SLIDES_PAGE_WIDTH_PT}pt, height: {SLIDES_PAGE_HEIGHT_PT}pt)\\n"
        ));
    }
    if state.document_type == IrDocumentType::Slides {
        match state.slides.and_then(|slides| slides.center) {
            Some(true) => prelude.push_str("#set align(horizon)\\n"),
            Some(false) => prelude.push_str("#set align(top)\\n"),
            None => {}
        }
    }
'''
          s = once(s, old, new, 'Typst geometry precedence')
          p.write_text(s)
          PY

          cargo fmt --all
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/arkst-ir/src/lib.rs crates/arkst-engine/src/evaluator.rs crates/arkst-typst/src/lowering.rs crates/arkst-typst/src/focus_lowering.rs
          git commit -m 'feat(compat): add typed complete page geometry'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
          cargo check --workspace --all-targets --locked
