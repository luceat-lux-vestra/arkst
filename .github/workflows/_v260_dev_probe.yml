name: v260 dev probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show evaluator call boundary
        shell: bash
        run: |
          set -euo pipefail
          file=crates/arkst-engine/src/evaluator.rs
          for needle in 'pageformat' 'struct DocumentState' 'enum DocumentStateUndo' 'fn evaluate_page_alignment_builtin'; do
            echo "=== $needle ==="
            line=$(grep -n "$needle" "$file" | head -1 | cut -d: -f1 || true)
            if [ -n "$line" ]; then
              start=$((line > 80 ? line - 80 : 1))
              end=$((line + 220))
              sed -n "${start},${end}p" "$file"
            fi
          done
