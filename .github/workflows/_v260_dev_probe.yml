name: v260 dev probe
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect-pageformat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify workspace and inspect pageformat
        shell: bash
        run: |
          set -euo pipefail
          cargo check --workspace --all-targets --locked
          line=$(grep -nF 'if name == "pageformat"' crates/arkst-engine/src/evaluator.rs | head -1 | cut -d: -f1)
          start=$((line > 50 ? line - 50 : 1)); end=$((line + 180))
          sed -n "${start},${end}p" crates/arkst-engine/src/evaluator.rs
          grep -nF 'fn convert_container_size' crates/arkst-engine/src/evaluator.rs || true
          grep -nF 'DomainValue::Size' crates/arkst-engine/src/evaluator.rs || true
