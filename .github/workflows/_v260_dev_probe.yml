name: v260 dev probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show remaining integration hooks
        shell: bash
        run: |
          set -euo pipefail
          for pattern in 'struct ContentRangeBlockParser' 'struct QuarkdownBlockParser' 'impl BlockParser for QuarkdownBlockParser' 'impl BlockParser for ContentRangeBlockParser' 'DocumentStateUndo::PageAlignment' 'IrNode::ThematicBreak'; do
            echo "=== $pattern ==="
            grep -n -B40 -A120 "$pattern" crates/arkst-markdown/src/parser.rs crates/arkst-engine/src/evaluator.rs crates/arkst-ir/src/lib.rs crates/arkst-engine/src/ast_to_ir.rs crates/arkst-typst/src/lowering.rs | head -300 || true
          done
