name: v260 dev probe
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  patch-semantic:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply and persist semantic slice, then full-check
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          def once(s,o,n,label):
              c=s.count(o)
              if c!=1: raise SystemExit(f'{label}: expected 1 occurrence, found {c}')
              return s.replace(o,n,1)

          p=Path('crates/arkst-markdown/src/ast.rs'); s=p.read_text()
          if 'PageBreak {\n        span: ByteSpan,' not in s:
              s=once(s,'    ThematicBreak {\n        span: ByteSpan,\n    },\n','    ThematicBreak {\n        span: ByteSpan,\n    },\n    /// Quarkdown explicit page boundary (`<<<`).\n    PageBreak {\n        span: ByteSpan,\n    },\n','AST PageBreak')
          p.write_text(s)

          p=Path('crates/arkst-markdown/src/parser.rs'); s=p.read_text()
          if 'text.trim() == "<<<"' not in s:
              s=once(s,''') -> Vec<Block> {\n    match block {\n        Block::DirectiveCall {''',''') -> Vec<Block> {\n    if let Block::Paragraph { span, .. } = block {\n        if source.get(span.start..span.end).is_some_and(|text| text.trim() == "<<<") {\n            return vec![Block::PageBreak { span: *span }];\n        }\n    }\n    match block {\n        Block::DirectiveCall {''','normalize <<<')
          p.write_text(s)

          p=Path('crates/arkst-engine/src/ast_to_ir.rs'); s=p.read_text()
          if 'Block::PageBreak { span } => Some(IrNode::PageBreak' not in s:
              s=once(s,'        Block::ThematicBreak { span } => Some(IrNode::ThematicBreak {\n            span: byte_to_source_span(span, source_id),\n        }),\n','        Block::ThematicBreak { span } => Some(IrNode::ThematicBreak {\n            span: byte_to_source_span(span, source_id),\n        }),\n        Block::PageBreak { span } => Some(IrNode::PageBreak {\n            span: byte_to_source_span(span, source_id),\n        }),\n','ast_to_ir PageBreak')
          p.write_text(s)

          p=Path('crates/arkst-engine/src/evaluator.rs'); s=p.read_text()
          if 'IrSlidesConfiguration' not in s.split('use arkst_markdown::Mode;',1)[0]:
              s=once(s,'    IrTableCell, IrTableRow, IrValue, NativeTarget, TargetSpecificContent,\n};','    IrSlidesConfiguration, IrTableCell, IrTableRow, IrValue, NativeTarget, TargetSpecificContent,\n};','slides import')
          if 'slides: Option<IrSlidesConfiguration>' not in s:
              s=once(s,'    page_alignment: Option<IrDocumentAlignment>,\n    localization_tables: LocalizationTables,\n','    page_alignment: Option<IrDocumentAlignment>,\n    slides: Option<IrSlidesConfiguration>,\n    localization_tables: LocalizationTables,\n','state field')
              s=once(s,'            page_alignment: None,\n            localization_tables: seeded_localization_tables(),\n','            page_alignment: None,\n            slides: None,\n            localization_tables: seeded_localization_tables(),\n','state default')
              s=once(s,'            page_alignment: snapshot.page_alignment,\n            localization_tables: seeded_localization_tables(),\n','            page_alignment: snapshot.page_alignment,\n            slides: snapshot.slides,\n            localization_tables: seeded_localization_tables(),\n','state restore')
              s=once(s,'            page_alignment: self.page_alignment,\n        }\n','            page_alignment: self.page_alignment,\n            slides: self.slides,\n        }\n','state snapshot')
          if '    Slides,\n    LocalizationTables,' not in s:
              s=once(s,'    PageAlignment,\n    LocalizationTables,\n','    PageAlignment,\n    Slides,\n    LocalizationTables,\n','field enum')
          if 'Slides(Option<IrSlidesConfiguration>)' not in s:
              s=once(s,'    PageAlignment(Option<IrDocumentAlignment>),\n    LocalizationTables(LocalizationTableUndo),\n','    PageAlignment(Option<IrDocumentAlignment>),\n    Slides(Option<IrSlidesConfiguration>),\n    LocalizationTables(LocalizationTableUndo),\n','undo enum')
          if 'DocumentStateUndo::Slides(previous) => state.slides = previous' not in s:
              s=once(s,'            DocumentStateUndo::PageAlignment(previous) => state.page_alignment = previous,\n','            DocumentStateUndo::PageAlignment(previous) => state.page_alignment = previous,\n            DocumentStateUndo::Slides(previous) => state.slides = previous,\n','undo restore')
          if 'fn set_slides_configuration' not in s:
              n='    fn append_document_author(&self, name: String) {'
              q='''    fn set_slides_configuration(&self, value: Option<IrSlidesConfiguration>) {\n        self.record_document_state_undo(DocumentStateField::Slides, || {\n            (DocumentStateUndo::Slides(self.document_state.borrow().slides), 0)\n        });\n        self.document_state.borrow_mut().slides = value;\n    }\n\n'''
              s=once(s,n,q+n,'slides setter')
          if '    PageBreak,\n    Whitespace,' not in s:
              s=once(s,'    Br,\n    Whitespace,\n','    Br,\n    PageBreak,\n    Whitespace,\n','owner enum')
          if '"slides",\n    "captionposition"' not in s:
              s=once(s,'    "theme",\n    "captionposition",\n];','    "theme",\n    "slides",\n    "captionposition",\n];','slides native list')
          if 'const PAGE_BREAK_NATIVE_NAMES' not in s:
              s=once(s,'const BR_NATIVE_NAMES: &[&str] = &["br"];\n','const BR_NATIVE_NAMES: &[&str] = &["br"];\nconst PAGE_BREAK_NATIVE_NAMES: &[&str] = &["pagebreak"];\n','pagebreak names')
              inv='''    NativeOwnerInventory {\n        owner: NativeDispatchOwner::Br,\n        names: BR_NATIVE_NAMES,\n    },\n'''
              s=once(s,inv,inv+'''    NativeOwnerInventory {\n        owner: NativeDispatchOwner::PageBreak,\n        names: PAGE_BREAK_NATIVE_NAMES,\n    },\n''','pagebreak inventory')
          if 'fn is_page_break(name: &str)' not in s:
              s=once(s,'fn is_whitespace(name: &str) -> bool {\n    has_native_owner(name, NativeDispatchOwner::Whitespace)\n}\n','fn is_page_break(name: &str) -> bool {\n    has_native_owner(name, NativeDispatchOwner::PageBreak)\n}\n\nfn is_whitespace(name: &str) -> bool {\n    has_native_owner(name, NativeDispatchOwner::Whitespace)\n}\n','pagebreak helper')
          if '"slides" => (' not in s:
              s=once(s,'        "noautopagebreak" => (Vec::new(), BodyPolicy::Reject),\n','        "noautopagebreak" => (Vec::new(), BodyPolicy::Reject),\n        "slides" => (vec![ParameterMetadata::optional("center")], BodyPolicy::Reject),\n        "pagebreak" => (Vec::new(), BodyPolicy::Reject),\n','native signatures')
          s=s.replace('                | "noautopagebreak"\n        ) && context.get_function(name).is_some();','                | "noautopagebreak"\n                | "slides"\n        ) && context.get_function(name).is_some();')
          if 'if name == "slides" {' not in s:
              a='''        if name == "noautopagebreak" {\n            context.set_auto_page_break_max_depth(Some(0));\n            return CallOutcome::NoValue;\n        }\n'''
              q='''        if name == "slides" {\n            if context.document_state.borrow().document_type != arkst_ir::IrDocumentType::Slides {\n                diagnostics.push(document_state_conversion_error("`.slides` is only valid for slides documents".to_string(), *span));\n                return CallOutcome::Failed;\n            }\n            let Some(binding_plan) = binding_plan else { return CallOutcome::Failed; };\n            let evaluated_positional = match self.evaluate_invocation_values(positional_args, span, diagnostics, context, first_origin) { Ok(v) => v, Err(o) => return o };\n            let evaluated_named = match self.evaluate_invocation_named(named_args, span, diagnostics, context) { Ok(v) => v, Err(o) => return o };\n            let bound = match bind_evaluated_arguments(binding_plan, evaluated_positional.into_iter().zip(positional_args.iter()).map(|(value, source)| (value, value_source_span(source, span))).collect(), evaluated_named, None, *span) {\n                Ok(v) => v, Err(error) => { diagnostics.push(binding_diagnostic_with_code(error, "E3003")); return CallOutcome::Failed; }\n            };\n            let parameter_span = bound.parameters.first().and_then(|parameter| parameter.name_span);\n            let center = match bound.slots.into_iter().next() {\n                Some(BoundSlot::Explicit { value, span: argument_span }) => {\n                    if matches!(value.value, IrValue::None) { None } else {\n                        match value_conversion::convert_scalar_with_origin(&value, ScalarTarget::Boolean) {\n                            Ok(ScalarValue::Boolean(value)) => Some(value),\n                            Ok(_) => { diagnostics.push(document_state_conversion_error("`.slides center` must be boolean or none".to_string(), argument_span)); return CallOutcome::Failed; },\n                            Err(error) => { diagnostics.push(conversion_failure_diagnostic(value_conversion::ConversionFailure::new(error, Some(argument_span), Some("center"), parameter_span, *span), Some("`.slides`"))); return CallOutcome::Failed; }\n                        }\n                    }\n                }\n                _ => None,\n            };\n            context.set_slides_configuration(Some(IrSlidesConfiguration { center }));\n            return CallOutcome::NoValue;\n        }\n\n'''
              s=once(s,a,q+a,'slides evaluation')
          if 'if is_page_break(name) && context.get_function(name).is_none()' not in s:
              a='        if is_localization(name) && context.get_function(name).is_none() {'
              q='''        if is_page_break(name) && context.get_function(name).is_none() {\n            let Some(_binding_plan) = native_binding_plan.as_ref() else { return CallOutcome::Failed; };\n            return CallOutcome::Value(IrValue::Content(vec![IrNode::PageBreak { span: *span }]));\n        }\n\n'''
              s=once(s,a,q+a,'pagebreak dispatch')
          s=s.replace('        | IrNode::ThematicBreak { span }\n        | IrNode::Math { span, .. } => *span,','        | IrNode::ThematicBreak { span }\n        | IrNode::PageBreak { span }\n        | IrNode::Math { span, .. } => *span,')
          s=s.replace('        | IrNode::ThematicBreak { span }\n        | IrNode::Math { span, .. } => *span = source_span,','        | IrNode::ThematicBreak { span }\n        | IrNode::PageBreak { span }\n        | IrNode::Math { span, .. } => *span = source_span,')
          p.write_text(s)

          p=Path('crates/arkst-engine/src/builtins.rs'); s=p.read_text()
          if '| IrNode::PageBreak { .. }' not in s:
              s=once(s,'        | IrNode::ThematicBreak { .. }\n        | IrNode::Math { .. } => return None,','        | IrNode::ThematicBreak { .. }\n        | IrNode::PageBreak { .. }\n        | IrNode::Math { .. } => return None,','builtins pagebreak')
          p.write_text(s)

          p=Path('tools/markdown-compat/src/main.rs'); s=p.read_text()
          if 'Block::PageBreak { .. } => CanonicalNode::new("page_break")' not in s:
              s=once(s,'        Block::ThematicBreak { .. } => CanonicalNode::new("thematic_break"),\n','        Block::ThematicBreak { .. } => CanonicalNode::new("thematic_break"),\n        Block::PageBreak { .. } => CanonicalNode::new("page_break"),\n','compat PageBreak')
          p.write_text(s)

          p=Path('crates/arkst-typst/src/lowering.rs'); s=p.read_text()
          if 'IrNode::PageBreak { span }' not in s:
              o='''            IrNode::ThematicBreak { span } => {\n                let before = self.output.len();\n                self.push_str("---\\n");\n                if span.source_id != SourceId(0) {\n                    self.record_span(*span, self.output.len() - before);\n                }\n            }\n'''
              n=o+'''            IrNode::PageBreak { span } => {\n                let before = self.output.len();\n                self.push_str("#pagebreak(weak: true)\\n");\n                if span.source_id != SourceId(0) {\n                    self.record_span(*span, self.output.len() - before);\n                }\n            }\n'''
              s=once(s,o,n,'typst pagebreak')
          p.write_text(s)

          p=Path('crates/arkst-typst/src/focus_lowering.rs'); s=p.read_text()
          if 'SLIDES_PAGE_WIDTH_PT' not in s:
              o='''pub fn lower_to_typst(doc: &IrDocument) -> (String, Vec<SourceMapEntry>) {\n    let (body, mut source_map) = lowering_base::lower_to_typst(doc);\n    let Some(prelude) = focus_prelude(doc) else {\n        return (body, source_map);\n    };\n\n    let offset = prelude.len();\n    for entry in &mut source_map {\n        entry.generated_start += offset;\n        entry.generated_end += offset;\n    }\n\n    let mut output = String::with_capacity(offset + body.len());\n    output.push_str(&prelude);\n    output.push_str(&body);\n    (output, source_map)\n}\n\n/// Lower an Arkst IR document to Typst source without returning its source map.\npub fn lower_to_typst_code(doc: &IrDocument) -> String {\n    let body = lowering_base::lower_to_typst_code(doc);\n    let Some(prelude) = focus_prelude(doc) else {\n        return body;\n    };\n\n    let mut output = String::with_capacity(prelude.len() + body.len());\n    output.push_str(&prelude);\n    output.push_str(&body);\n    output\n}\n'''
              n='''pub fn lower_to_typst(doc: &IrDocument) -> (String, Vec<SourceMapEntry>) {\n    let (body, mut source_map) = lowering_base::lower_to_typst(doc);\n    let prelude = document_prelude(doc);\n    if prelude.is_empty() { return (body, source_map); }\n    let offset = prelude.len();\n    for entry in &mut source_map { entry.generated_start += offset; entry.generated_end += offset; }\n    let mut output = String::with_capacity(offset + body.len());\n    output.push_str(&prelude); output.push_str(&body); (output, source_map)\n}\n\n/// Lower an Arkst IR document to Typst source without returning its source map.\npub fn lower_to_typst_code(doc: &IrDocument) -> String {\n    let body = lowering_base::lower_to_typst_code(doc);\n    let prelude = document_prelude(doc);\n    if prelude.is_empty() { return body; }\n    let mut output = String::with_capacity(prelude.len() + body.len());\n    output.push_str(&prelude); output.push_str(&body); output\n}\n\n// v2.6 distributed-runtime PDF observation; renderer adapter defaults only.\nconst SLIDES_PAGE_WIDTH_PT: f64 = 749.04;\nconst SLIDES_PAGE_HEIGHT_PT: f64 = 546.0;\n\nfn document_prelude(doc: &IrDocument) -> String {\n    let state = &doc.metadata.document_state;\n    let mut prelude = String::new();\n    if state.document_type == IrDocumentType::Slides {\n        prelude.push_str(&format!("#set page(width: {SLIDES_PAGE_WIDTH_PT}pt, height: {SLIDES_PAGE_HEIGHT_PT}pt)\\n"));\n        match state.slides.and_then(|slides| slides.center) {\n            Some(true) => prelude.push_str("#set align(horizon)\\n"),\n            Some(false) => prelude.push_str("#set align(top)\\n"),\n            None => {}\n        }\n    }\n    if let Some(focus) = focus_prelude(doc) { prelude.push_str(&focus); }\n    prelude\n}\n'''
              s=once(s,o,n,'document prelude')
          p.write_text(s)
          PY
          cargo fmt --all
          cargo fmt --all -- --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet; then
            git add crates/arkst-markdown/src/ast.rs crates/arkst-markdown/src/parser.rs crates/arkst-engine/src/ast_to_ir.rs crates/arkst-engine/src/evaluator.rs crates/arkst-engine/src/builtins.rs crates/arkst-typst/src/lowering.rs crates/arkst-typst/src/focus_lowering.rs tools/markdown-compat/src/main.rs
            git commit -m 'compat(v2.6): implement slides layout and explicit page breaks'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
          cargo check --workspace --all-targets --locked
