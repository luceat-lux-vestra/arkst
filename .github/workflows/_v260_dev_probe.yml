name: v260 dev probe

on:
  push:
    branches: [feat/v260-slides-pdf]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show bounded integration helpers
        shell: bash
        run: |
          set -euo pipefail
          for pattern in 'fn evaluate_page_alignment_builtin' 'fn set_page_alignment' 'enum DocumentStateField' 'enum DocumentStateUndo' 'fn rollback_document_state' 'let signature = match name' 'fn evaluate_call'; do
            echo "=== $pattern ==="
            line=$(grep -n "$pattern" crates/arkst-engine/src/evaluator.rs | head -1 | cut -d: -f1 || true)
            if [ -n "$line" ]; then sed -n "$((line-30)),$((line+180))p" crates/arkst-engine/src/evaluator.rs; fi
          done
          echo '=== boolean conversions ==='
          grep -n -B8 -A20 'convert_boolean\|scalar_boolean\|Boolean' crates/arkst-engine/src/evaluator.rs | head -260 || true
          echo '=== parser setup ==='
          grep -n -B20 -A50 'Box::new(QuarkdownBlockParser)' crates/arkst-markdown/src/parser.rs
