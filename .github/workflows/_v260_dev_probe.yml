name: v260 dev probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show evaluator and parser ownership hooks
        shell: bash
        run: |
          set -euo pipefail
          show() {
            file="$1"; needle="$2"; before="${3:-40}"; after="${4:-100}"
            echo "=== $file :: $needle ==="
            line=$(grep -nF "$needle" "$file" | head -1 | cut -d: -f1 || true)
            if [ -n "$line" ]; then
              start=$((line > before ? line - before : 1)); end=$((line + after))
              sed -n "${start},${end}p" "$file"
            fi
          }
          show crates/arkst-engine/src/evaluator.rs 'enum NativeDispatchOwner' 20 170
          show crates/arkst-engine/src/evaluator.rs 'fn preflight_native_binding' 20 150
          show crates/arkst-engine/src/evaluator.rs 'let signature = match name {' 15 180
          show crates/arkst-engine/src/evaluator.rs 'fn evaluate_document_state_builtin' 10 320
          show crates/arkst-engine/src/evaluator.rs 'if name == "pageformat"' 20 110
          show crates/arkst-engine/src/evaluator.rs 'struct DocumentState {' 10 160
          show crates/arkst-engine/src/evaluator.rs 'fn ir_node_source_span' 5 80
          show crates/arkst-engine/src/evaluator.rs 'fn rebase_dynamic_node' 5 120
          show crates/arkst-markdown/src/parser.rs 'struct FrontendParserExtension' 10 90
