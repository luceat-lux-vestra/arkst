name: Reference JVM

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reference-jvm-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify pinned Temurin 25 oracle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download and verify exact canonical JDK archive
        id: jdk
        shell: bash
        run: |
          readarray -t reference_values < <(python3 - <<'PY'
          import tomllib
          from pathlib import Path

          with Path("docs/compatibility/quarkdown/reference-jvm.toml").open("rb") as stream:
              reference = tomllib.load(stream)["reference"]
          print(reference["archive_filename"])
          print(reference["archive_url"])
          print(reference["archive_sha256"])
          PY
          )
          archive_filename="${reference_values[0]}"
          archive_url="${reference_values[1]}"
          archive_sha256="${reference_values[2]}"
          archive_path="$RUNNER_TEMP/$archive_filename"
          curl --fail --location --retry 3 --output "$archive_path" "$archive_url"
          printf '%s  %s\n' "$archive_sha256" "$archive_path" | sha256sum --check --strict
          printf 'archive_path=%s\n' "$archive_path" >> "$GITHUB_OUTPUT"

      - name: Extract and verify exact Java runtime
        id: runtime
        shell: bash
        env:
          ARCHIVE_PATH: ${{ steps.jdk.outputs.archive_path }}
        run: |
          extract_root="$RUNNER_TEMP/temurin25-extracted"
          mkdir -p "$extract_root"
          tar --extract --gzip --file "$ARCHIVE_PATH" --directory "$extract_root"
          reference_java="$(find "$extract_root" -path '*/bin/java' -print -quit)"
          test -x "$reference_java"
          "$reference_java" -version 2>&1
          printf 'java=%s\n' "$reference_java" >> "$GITHUB_OUTPUT"

      - name: Regeneration and external differential verification
        env:
          REFERENCE_JAVA: ${{ steps.runtime.outputs.java }}
          ARCHIVE_PATH: ${{ steps.jdk.outputs.archive_path }}
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: |
          python3 tools/generate_jdk25_locale_data.py \
            --java "$REFERENCE_JAVA" \
            --archive "$ARCHIVE_PATH" \
            --check
          "$REFERENCE_JAVA" -Dfile.encoding=UTF-8 -Djava.locale.providers=CLDR --source 25 \
            tools/dump_jdk25_locale_oracle.java > "$RUNNER_TEMP/locale-oracle.tsv"
          python3 - "$RUNNER_TEMP/locale-oracle.tsv" <<'PY'
          import hashlib
          import sys
          import tomllib
          from pathlib import Path

          oracle_path = Path(sys.argv[1])
          manifest = tomllib.loads(
              Path("docs/compatibility/quarkdown/reference-jvm.toml").read_text()
          )
          expected_count = manifest["reference"]["locale_public_oracle_record_count"]
          expected_sha256 = manifest["reference"]["locale_public_oracle_output_sha256"]
          output = oracle_path.read_bytes()
          actual_count = len(output.splitlines())
          actual_sha256 = hashlib.sha256(output).hexdigest()
          if actual_count != expected_count or actual_sha256 != expected_sha256:
              raise SystemExit(
                  f"public oracle mismatch: expected {expected_count}/{expected_sha256}, "
                  f"got {actual_count}/{actual_sha256}"
              )
          PY
          SCRIBIUM_JDK25_LOCALE_ORACLE="$RUNNER_TEMP/locale-oracle.tsv" \
            cargo test -p scribium-engine --locked \
            'locale::tests::jdk25_locale_oracle_matches_candidate_graph_and_public_resolution' \
            -- --exact
          python3 tools/generate_jdk25_unicode_case.py \
            --java "$REFERENCE_JAVA" \
            --archive "$ARCHIVE_PATH" \
            --check
          python3 tools/verify_jdk25_unicode.py \
            --java "$REFERENCE_JAVA" \
            --archive "$ARCHIVE_PATH"
