      - name: Format and structural proof
        shell: bash
        run: |
          cargo fmt --all
          cargo fmt --all --check
          git diff --check
          test -z "$(git diff -- Cargo.lock)"
          ! grep -Eq 'std::fs|std::path|PathBuf|std::env|std::process|TcpStream|UdpSocket' crates/arkst-engine/src/csv_resource.rs

      - name: Prove CSV resource contract
        run: cargo test --locked -p arkst-engine --test csv_resource_contract

      - name: Prove engine regression boundary
        run: cargo test --locked -p arkst-engine

      - name: Prove core adapter regression boundary
        run: cargo test --locked -p arkst-core --lib

      - name: Prove canonical resource audit
        run: cargo test --locked -p arkst-core --test filesystem_project_data_resources_audit

      - name: Prove cross-audit reconciliation
        run: cargo test --locked -p arkst-core --test quarkdown_v251_reconciliation

      - name: Prove workspace lint boundary
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Commit product proof without temporary artifacts
        shell: bash
        run: |
          test -z "$(git diff -- Cargo.lock)"
          rm .github/workflows/tmp-189-csv-resource-loader.yml
          git add \
            crates/arkst-engine/src/lib.rs \
            crates/arkst-engine/src/csv_resource.rs \
            crates/arkst-engine/tests/csv_resource_contract.rs \
            crates/arkst-core/src/engine_adapter.rs \
            crates/arkst-core/tests/filesystem_project_data_resources_audit.rs \
            crates/arkst-core/tests/quarkdown_v251_reconciliation.rs \
            docs/research/quarkdown-project-data-189.md \
            docs/compatibility/quarkdown/FILESYSTEM_PROJECT_DATA_RESOURCES_AUDIT_MANIFEST.tsv \
            docs/compatibility/quarkdown/FILESYSTEM_PROJECT_DATA_RESOURCES_AUDIT.md \
            .github/workflows/tmp-189-csv-resource-loader.yml
          git diff --cached --check
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            crates/arkst-core/src/engine_adapter.rs \
            crates/arkst-core/tests/filesystem_project_data_resources_audit.rs \
            crates/arkst-core/tests/quarkdown_v251_reconciliation.rs \
            crates/arkst-engine/src/csv_resource.rs \
            crates/arkst-engine/src/lib.rs \
            crates/arkst-engine/tests/csv_resource_contract.rs \
            docs/compatibility/quarkdown/FILESYSTEM_PROJECT_DATA_RESOURCES_AUDIT.md \
            docs/compatibility/quarkdown/FILESYSTEM_PROJECT_DATA_RESOURCES_AUDIT_MANIFEST.tsv \
            docs/research/quarkdown-project-data-189.md | sort)"
          test "$actual" = "$expected"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'compat(resource): add bounded CSV resource loader' -m 'Refs #189'
          git push origin HEAD:compat/189-csv-resource-loader
