name: tmp-189-csv-resource-loader

on:
  push:
    branches:
      - compat/189-csv-resource-loader

permissions:
  contents: write

jobs:
  patch-and-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: compat/189-csv-resource-loader
          fetch-depth: 0
      - name: Patch, prove, and collapse proof tree
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/tmp/189-csv-resource-loader.sh')
          text = path.read_text()
          old = "research.write_text(text.rstrip() + appendix + '\\n')"
          new = "research.write_text(text.rstrip() + appendix.rstrip() + '\\n')"
          if text.count(old) != 1:
              raise SystemExit('proof hygiene anchor changed')
          path.write_text(text.replace(old, new))
          PY
          bash .github/tmp/189-csv-resource-loader.sh
