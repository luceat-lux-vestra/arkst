name: Quarkdown v2.6 focus black-box probe

on:
  pull_request:
    paths:
      - .github/workflows/v260-focus-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Fetch exact official v2.6.0 distribution
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/iamgio/quarkdown/releases/download/v2.6.0/quarkdown-linux-x64.zip'
          expected='5b015e47c820d06ff6774eb700e60d77bc575819d4a0140cc7f1a115e7ce6dc4'
          curl -fL --retry 3 --retry-all-errors --connect-timeout 20 -o /tmp/quarkdown-v2.6.0.zip "$url"
          printf '%s  %s\n' "$expected" /tmp/quarkdown-v2.6.0.zip | sha256sum -c -
          mkdir -p /tmp/quarkdown-v2.6.0
          unzip -q /tmp/quarkdown-v2.6.0.zip -d /tmp/quarkdown-v2.6.0
          qd="$(find /tmp/quarkdown-v2.6.0 -type f -name quarkdown -perm -111 -print -quit)"
          test -n "$qd"
          printf 'QD=%s\n' "$qd" >> "$GITHUB_ENV"
          "$qd" --version

      - name: Compile independently-authored layout controls
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/focus-probe
          mkdir -p "$root"
          for doctype in plain paged slides; do
            for variant in latex focus focus-default-color; do
              case "$variant" in
                latex) theme='.theme {paperwhite} layout:{latex}' ;;
                focus) theme='.theme {paperwhite} layout:{focus}' ;;
                focus-default-color) theme='.theme layout:{focus}' ;;
              esac
              src="$root/${doctype}-${variant}.qd"
              out="$root/out-${doctype}-${variant}"
              printf '%s\n' \
                ".docname {Focus Probe}" \
                ".doctype {$doctype}" \
                "$theme" \
                '' '# Probe Title' '' \
                'Lead paragraph with **bold** and *italic*.' '' \
                '## Section' '' '- Alpha' '- Beta' '' '> Quote' '' \
                '.code lang:{text}' '    hello' > "$src"
              "$QD" compile "$src" --strict --clean --out "$out" --out-name probe
              html="$(find "$out" -type f -name '*.html' -print -quit)"
              test -n "$html"
              printf '%s|%s|%s|%s\n' "$doctype" "$variant" "$out" "$html" >> "$root/html-paths.tsv"
            done
          done

      - name: Observe asset-set boundary only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from hashlib import sha256
          import json
          from pathlib import Path
          root = Path('/tmp/focus-probe')
          manifests = {}
          html_hashes = {}
          for row in (root / 'html-paths.tsv').read_text().splitlines():
              doctype, variant, out_dir, html_path = row.split('|', 3)
              out = Path(out_dir)
              key = f'{doctype}/{variant}'
              manifests[key] = {
                  str(p.relative_to(out)): sha256(p.read_bytes()).hexdigest()
                  for p in sorted(out.rglob('*')) if p.is_file()
              }
              html_hashes[key] = sha256(Path(html_path).read_bytes()).hexdigest()
          for doctype in ('plain', 'paged', 'slides'):
              latex = manifests[f'{doctype}/latex']
              focus = manifests[f'{doctype}/focus']
              changed = [p for p in sorted(set(latex) | set(focus)) if latex.get(p) != focus.get(p)]
              print(json.dumps({
                  'doctype': doctype,
                  'html_byte_identical': html_hashes[f'{doctype}/latex'] == html_hashes[f'{doctype}/focus'],
                  'latex_file_count': len(latex),
                  'focus_file_count': len(focus),
                  'changed_file_count': len(changed),
                  'focus_layout_asset_present': any('/theme/layout/focus/' in ('/' + p) or p.endswith('/theme/layout/focus.checksum') for p in focus),
                  'latex_layout_asset_present': any('/theme/layout/latex/' in ('/' + p) or p.endswith('/theme/layout/latex.checksum') for p in latex),
              }, sort_keys=True))
          PY

      - name: Observe unknown-layout renderer warning boundary
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/focus-probe
          src="$root/unknown-layout.qd"
          printf '%s\n' '.doctype {plain}' '.theme {paperwhite} layout:{arkst-probe-missing-layout}' '# Probe' > "$src"
          set +e
          "$QD" compile "$src" --strict --clean --out "$root/out-unknown" --out-name probe >"$root/unknown.stdout" 2>"$root/unknown.stderr"
          rc=$?
          set -e
          printf 'unknown_layout_exit=%s\n' "$rc"
          cat "$root/unknown.stderr"
          test "$rc" -eq 0
          grep -F "'layout' theme not found: arkst-probe-missing-layout" "$root/unknown.stderr"
          test -n "$(find "$root/out-unknown" -type f -name '*.html' -print -quit)"

      - name: Observe rendered computed styles and geometry
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          printf 'chrome=%s\n' "$chrome"

          python3 - <<'PY'
          from pathlib import Path
          root = Path('/tmp/focus-probe')
          script = r'''<script>
          window.addEventListener('load', () => {
            const selectors = ['body','main','section','h1','h2','p','ul','blockquote','pre','code'];
            const props = ['display','position','fontFamily','fontSize','fontWeight','lineHeight','textAlign','color','backgroundColor','marginTop','marginBottom','paddingTop','paddingBottom','maxWidth'];
            const result = {};
            for (const selector of selectors) {
              const el = document.querySelector(selector);
              if (!el) continue;
              const style = getComputedStyle(el);
              const rect = el.getBoundingClientRect();
              const values = {};
              for (const prop of props) values[prop] = style[prop];
              values.rect = {x: Math.round(rect.x*100)/100, y: Math.round(rect.y*100)/100, width: Math.round(rect.width*100)/100, height: Math.round(rect.height*100)/100};
              result[selector] = values;
            }
            const pre = document.createElement('pre');
            pre.id = 'qd-focus-probe-style-dump';
            pre.textContent = JSON.stringify(result);
            document.body.appendChild(pre);
          });
          </script>'''
          rows = []
          for row in (root / 'html-paths.tsv').read_text().splitlines():
              doctype, variant, out_dir, html_path = row.split('|', 3)
              path = Path(html_path)
              text = path.read_text()
              instrumented = path.with_name(path.stem + '-instrumented.html')
              instrumented.write_text(text.replace('</body>', script + '</body>', 1))
              dump = root / f'{doctype}-{variant}-dom.html'
              rows.append((doctype, variant, instrumented, dump))
          (root / 'instrumented-paths.tsv').write_text('\n'.join('|'.join(map(str, row)) for row in rows) + '\n')
          PY

          while IFS='|' read -r doctype variant html dump; do
            "$chrome" --headless=new --no-sandbox --disable-gpu --allow-file-access-from-files \
              --window-size=1440,1000 --virtual-time-budget=3000 --dump-dom "file://$html" > "$dump"
          done < /tmp/focus-probe/instrumented-paths.tsv

          python3 - <<'PY'
          from html import unescape
          import json
          from pathlib import Path
          import re
          root = Path('/tmp/focus-probe')
          observed = {}
          pattern = re.compile(r'<pre id="qd-focus-probe-style-dump">(.*?)</pre>', re.S)
          for row in (root / 'instrumented-paths.tsv').read_text().splitlines():
              doctype, variant, html_path, dump_path = row.split('|', 3)
              match = pattern.search(Path(dump_path).read_text())
              if not match:
                  raise SystemExit(f'missing style dump for {doctype}/{variant}')
              observed[f'{doctype}/{variant}'] = json.loads(unescape(match.group(1)))

          for doctype in ('plain','paged','slides'):
              latex = observed[f'{doctype}/latex']
              focus = observed[f'{doctype}/focus']
              focus_default = observed[f'{doctype}/focus-default-color']
              diff = {}
              for selector in sorted(set(latex) | set(focus)):
                  keys = sorted(set(latex.get(selector, {})) | set(focus.get(selector, {})))
                  changed = {k: {'latex': latex.get(selector, {}).get(k), 'focus': focus.get(selector, {}).get(k)} for k in keys if latex.get(selector, {}).get(k) != focus.get(selector, {}).get(k)}
                  if changed:
                      diff[selector] = changed
              print(json.dumps({
                  'doctype': doctype,
                  'focus_vs_latex': diff,
                  'focus_default_color_equals_explicit_paperwhite': focus_default == focus,
              }, ensure_ascii=False, sort_keys=True))
          PY
