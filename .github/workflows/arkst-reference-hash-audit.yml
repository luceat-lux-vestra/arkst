name: Arkst reference hash audit

on:
  push:
    branches: [chore/rename-arkst]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sync repository-owned source fingerprints
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import re
          import tomllib
          from pathlib import Path

          root = Path('.')
          jdk_path = root / 'docs/compatibility/quarkdown/reference-jvm.toml'
          markdown_path = root / 'tests/compat/references.toml'
          jdk_text = jdk_path.read_text(encoding='utf-8')
          markdown_text = markdown_path.read_text(encoding='utf-8')
          with jdk_path.open('rb') as stream:
              cfg = tomllib.load(stream)
          prov = cfg['provenance']
          ref = cfg['reference']

          fields = [
              ('verifier_source_sha256', prov['verifier_path']),
              ('helper_source_sha256', 'tools/dump_jdk25_unicode_data.java'),
              ('unicode_generator_source_sha256', ref['unicode_generator_path']),
              ('unicode_verifier_source_sha256', ref['unicode_verifier_path']),
              ('locale_generator_source_sha256', ref['locale_generator_path']),
              ('locale_public_oracle_helper_source_sha256', ref['locale_public_oracle_helper_path']),
              ('locale_semantic_verifier_source_sha256', ref['locale_semantic_verifier_path']),
          ]

          verifier_sha = None
          for field, path_text in fields:
              actual = hashlib.sha256((root / path_text).read_bytes()).hexdigest()
              pattern = rf'(?m)^{re.escape(field)} = "[0-9a-f]{{64}}"$'
              replacement = f'{field} = "{actual}"'
              jdk_text, count = re.subn(pattern, replacement, jdk_text, count=1)
              if count != 1:
                  raise SystemExit(f'expected exactly one JDK {field} assignment, got {count}')
              if field == 'verifier_source_sha256':
                  verifier_sha = actual
              print(f'{field}={actual} ({path_text})')

          assert verifier_sha is not None
          markdown_text, count = re.subn(
              r'(?m)^verifier_source_sha256 = "[0-9a-f]{64}"$',
              f'verifier_source_sha256 = "{verifier_sha}"',
              markdown_text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'expected exactly one Markdown verifier_source_sha256 assignment, got {count}')

          jdk_path.write_text(jdk_text, encoding='utf-8')
          markdown_path.write_text(markdown_text, encoding='utf-8')
          PY

      - name: Verify reference contracts with synchronized fingerprints
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- docs/compatibility/quarkdown/reference-jvm.toml tests/compat/references.toml
          python3 tools/verify_reference_provenance.py

      - name: Commit synchronized fingerprints when needed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/compatibility/quarkdown/reference-jvm.toml tests/compat/references.toml; then
            echo "reference source fingerprints already synchronized"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/compatibility/quarkdown/reference-jvm.toml tests/compat/references.toml
          git commit -m 'test: rebind reference source fingerprints after Arkst rename'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:chore/rename-arkst
