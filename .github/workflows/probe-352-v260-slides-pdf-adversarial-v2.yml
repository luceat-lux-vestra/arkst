name: Probe 352 v2.6 slides PDF adversarial v2

on:
  pull_request:
    paths:
      - .github/workflows/probe-352-v260-slides-pdf-adversarial-v2.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install inspection tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          node="$(command -v node || true)"
          npm="$(command -v npm || true)"
          test -n "$chrome"
          printf 'CHROME=%s\nNODE=%s\nNPM=%s\n' "$chrome" "$node" "$npm" >> "$GITHUB_ENV"
          mkdir -p evidence
          "$chrome" --version | tee evidence/chrome-version.txt
          node --version | tee evidence/node-version.txt || true
          npm --version | tee evidence/npm-version.txt || true

      - name: Fetch exact official black-box distributions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/qd-251 /tmp/qd-260
          curl -fL --retry 3 --retry-all-errors -o /tmp/qd251.zip \
            https://github.com/iamgio/quarkdown/releases/download/v2.5.1/quarkdown-linux-x64.zip
          echo '5751ab608fcb4daa2ec857a3368c029beed5429554ae0bdd95c660b2706269e9  /tmp/qd251.zip' | sha256sum -c - | tee evidence/v251-sha256.txt
          unzip -q /tmp/qd251.zip -d /tmp/qd-251
          curl -fL --retry 3 --retry-all-errors -o /tmp/qd260.zip \
            https://github.com/iamgio/quarkdown/releases/download/v2.6.0/quarkdown-linux-x64.zip
          echo '5b015e47c820d06ff6774eb700e60d77bc575819d4a0140cc7f1a115e7ce6dc4  /tmp/qd260.zip' | sha256sum -c - | tee evidence/v260-sha256.txt
          unzip -q /tmp/qd260.zip -d /tmp/qd-260
          qd251="$(find /tmp/qd-251 -type f -name quarkdown -perm -111 -print -quit)"
          qd260="$(find /tmp/qd-260 -type f -name quarkdown -perm -111 -print -quit)"
          test -n "$qd251" && test -n "$qd260"
          printf 'QD251=%s\nQD260=%s\n' "$qd251" "$qd260" >> "$GITHUB_ENV"
          "$qd251" --version | tee evidence/v251-version.txt
          "$qd260" --version | tee evidence/v260-version.txt

      - name: Create independent adversarial fixtures
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/probe352-adv
          mkdir -p "$root/fixtures"
          cat > "$root/fixtures/auto-headings.qd" <<'EOF'
          .doctype {slides}

          # QD-AUTO-H1

          H1 body.

          ## QD-AUTO-H2-ONE

          First H2 body.

          ## QD-AUTO-H2-TWO

          Second H2 body.
          EOF
          cat > "$root/fixtures/consecutive-headerless.qd" <<'EOF'
          .doctype {slides}
          .autopagebreak maxdepth:{0}

          # QD-CONSEC-HEAD

          Headed body.

          .pagebreak

          QD-CONSEC-HL-ONE

          First consecutive headerless body.

          .pagebreak

          QD-CONSEC-HL-TWO

          Second consecutive headerless body.

          .pagebreak

          # QD-CONSEC-TAIL

          Tail body.
          EOF
          cat > "$root/fixtures/empty-double-break.qd" <<'EOF'
          .doctype {slides}
          .autopagebreak maxdepth:{0}

          # QD-EMPTY-BEFORE

          Before.

          .pagebreak
          .pagebreak

          # QD-EMPTY-AFTER

          After.
          EOF
          cat > "$root/fixtures/focus-headerless.qd" <<'EOF'
          .doctype {slides}
          .theme {paperwhite} layout:{focus}
          .autopagebreak maxdepth:{0}

          QD-FOCUS-HEADERLESS

          Focus body-only slide.
          EOF

      - name: Compile HTML controls
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/probe352-adv
          : > "$root/html.tsv"
          for version in 251 260; do
            var="QD${version}"; qd="${!var}"
            for name in auto-headings consecutive-headerless empty-double-break; do
              out="$root/out-$version-$name"
              "$qd" compile "$root/fixtures/$name.qd" --strict --clean --pretty --out "$out" --out-name probe
              html="$(find "$out" -type f -name '*.html' -print -quit)"
              test -n "$html"
              printf '%s|%s|%s\n' "$version" "$name" "$html" >> "$root/html.tsv"
            done
          done
          out="$root/out-260-focus-headerless"
          "$QD260" compile "$root/fixtures/focus-headerless.qd" --strict --clean --pretty --out "$out" --out-name probe
          html="$(find "$out" -type f -name '*.html' -print -quit)"
          test -n "$html"
          printf '260|focus-headerless|%s\n' "$html" >> "$root/html.tsv"

          set +e
          "$QD251" compile "$root/fixtures/focus-headerless.qd" --strict --clean --pretty \
            --out "$root/out-251-focus-headerless" --out-name probe \
            > evidence/v251-focus.stdout 2> evidence/v251-focus.stderr
          status=$?
          set -e
          echo "$status" > evidence/v251-focus.status
          cat "$root/html.tsv" | tee evidence/html-paths.txt

      - name: Instrument and capture runtime geometry
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/probe352-adv
          mkdir -p evidence/dom
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/probe352-adv')
          script=r'''<script>
          window.addEventListener('load',()=>setTimeout(()=>{
            const clean=s=>(s||'').replace(/\s+/g,' ').trim();
            const sections=[...new Set([...document.querySelectorAll('.reveal .slides > section, .slides > section')])].map((s,index)=>{
              const r=s.getBoundingClientRect(), cs=getComputedStyle(s);
              const first=[...s.children].find(el=>clean(el.innerText||el.textContent));
              const fr=first?first.getBoundingClientRect():null;
              return {index,text:clean(s.innerText).slice(0,240),hasHeading:!!s.querySelector('h1,h2,h3,h4,h5,h6'),
                rect:{x:r.x,y:r.y,width:r.width,height:r.height},paddingTop:cs.paddingTop,paddingBottom:cs.paddingBottom,
                first:first&&fr?{tag:first.tagName,text:clean(first.innerText||first.textContent).slice(0,120),x:fr.x,y:fr.y,width:fr.width,height:fr.height,offsetFromSectionTop:fr.y-r.y}:null};
            });
            const pre=document.createElement('pre'); pre.id='qd-layout-dump'; pre.textContent=JSON.stringify({sections}); document.body.appendChild(pre);
          },1200));
          </script>'''
          rows=[]
          for line in (root/'html.tsv').read_text().splitlines():
            version,name,html=line.split('|',2); p=Path(html); text=p.read_text(); pos=text.lower().find('</body>')
            if pos < 0: raise SystemExit(f'no body close in {p}')
            out=p.with_name('probe-instrumented.html'); out.write_text(text[:pos]+script+text[pos:]); rows.append((version,name,out))
          (root/'instrumented.tsv').write_text('\n'.join(f'{v}|{n}|{p}' for v,n,p in rows)+'\n')
          PY
          port=8131
          while IFS='|' read -r version name html; do
            dir="$(dirname "$html")"
            python3 -m http.server "$port" --bind 127.0.0.1 --directory "$dir" > "/tmp/http-${version}-${name}.log" 2>&1 &
            pid=$!; trap 'kill "$pid" 2>/dev/null || true' EXIT; sleep 1
            dump="evidence/dom/${version}-${name}.html"
            "$CHROME" --headless=new --no-sandbox --disable-gpu \
              --user-data-dir="/tmp/chrome-${version}-${name}" --window-size=1440,1000 \
              --virtual-time-budget=5000 --dump-dom "http://127.0.0.1:${port}/probe-instrumented.html" > "$dump" 2>/dev/null
            grep -F 'qd-layout-dump' "$dump" >/dev/null
            kill "$pid"; wait "$pid" 2>/dev/null || true; trap - EXIT
          done < "$root/instrumented.tsv"

      - name: Probe v2.6 native PDF output
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/probe352-adv
          mkdir -p evidence/native-v260
          for src in "$root"/fixtures/*.qd; do
            name="$(basename "$src" .qd)"; out="$root/native-260-$name"
            set +e
            "$QD260" compile "$src" --strict --clean --pdf --pdf-no-sandbox --chrome-path "$CHROME" \
              --out "$out" --out-name probe > "evidence/native-v260/$name.stdout" 2> "evidence/native-v260/$name.stderr"
            status=$?
            set -e
            echo "$status" > "evidence/native-v260/$name.status"
            test "$status" -eq 0
            pdf="$(find "$out" -type f -name '*.pdf' -print -quit)"
            test -n "$pdf"
            pdfinfo "$pdf" > "evidence/native-v260/$name.pdfinfo.txt"
            pdftotext -bbox-layout "$pdf" "evidence/native-v260/$name.bbox.html"
          done

      - name: Observe v2.5.1 native PDF availability fail-closed
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/probe352-adv
          mkdir -p evidence/native-v251
          for name in auto-headings consecutive-headerless empty-double-break; do
            src="$root/fixtures/$name.qd"; out="$root/native-251-$name"
            args=(compile "$src" --strict --clean --pdf --out "$out" --out-name probe)
            [[ -n "$NODE" ]] && args+=(--node-path "$NODE")
            [[ -n "$NPM" ]] && args+=(--npm-path "$NPM")
            set +e
            "$QD251" "${args[@]}" > "evidence/native-v251/$name.stdout" 2> "evidence/native-v251/$name.stderr"
            process_status=$?
            set -e
            echo "$process_status" > "evidence/native-v251/$name.process-status"
            pdf=''
            if [[ -d "$out" ]]; then
              pdf="$(find "$out" -type f -name '*.pdf' -print -quit || true)"
            fi
            if [[ -n "$pdf" ]]; then
              echo present > "evidence/native-v251/$name.artifact-status"
              pdfinfo "$pdf" > "evidence/native-v251/$name.pdfinfo.txt"
              pdftotext -bbox-layout "$pdf" "evidence/native-v251/$name.bbox.html"
            else
              echo missing > "evidence/native-v251/$name.artifact-status"
            fi
          done

      - name: Summarize adversarial evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee evidence/summary.txt
          from pathlib import Path
          from html import unescape
          import json,re,xml.etree.ElementTree as ET
          e=Path('evidence'); pat=re.compile(r'<pre id="qd-layout-dump">(.*?)</pre>',re.S)
          def payload(p):
            m=pat.search(p.read_text());
            if not m: raise SystemExit(f'missing layout dump {p}')
            return json.loads(unescape(m.group(1)))
          def marks(p):
            root=ET.fromstring(p.read_text()); out=[]
            pages=[x for x in root.iter() if x.tag.endswith('page')]
            for page_i,page in enumerate(pages,1):
              for w in page.iter():
                if not w.tag.endswith('word'): continue
                t=''.join(w.itertext()).strip()
                if t.startswith('QD-'): out.append({'page':page_i,'text':t,'xMin':w.attrib.get('xMin'),'yMin':w.attrib.get('yMin')})
            return out
          print('=== RUNTIME DOM ===')
          for p in sorted((e/'dom').glob('*.html')):
            rows=[]
            for s in payload(p)['sections']:
              rows.append({'index':s['index'],'hasHeading':s['hasHeading'],'text':s['text'][:100],'paddingTop':s['paddingTop'],
                           'height':round(s['rect']['height'],3),'firstOffset':None if not s['first'] else round(s['first']['offsetFromSectionTop'],3)})
            print(p.stem,json.dumps(rows,sort_keys=True))
          print('=== V260 NATIVE ===')
          for p in sorted((e/'native-v260').glob('*.status')):
            name=p.stem; print(name,'status',p.read_text().strip())
            info=e/'native-v260'/f'{name}.pdfinfo.txt'; bbox=e/'native-v260'/f'{name}.bbox.html'
            lines=[x for x in info.read_text().splitlines() if x.startswith(('Pages:','Page size:'))]
            print(name,' | '.join(lines)); print(name,'markers',json.dumps(marks(bbox),sort_keys=True))
          print('=== V251 NATIVE AVAILABILITY ===')
          for p in sorted((e/'native-v251').glob('*.process-status')):
            name=p.name.removesuffix('.process-status')
            artifact=(e/'native-v251'/f'{name}.artifact-status').read_text().strip()
            stderr=(e/'native-v251'/f'{name}.stderr').read_text()[:600].replace('\n',' | ')
            print(name,'process',p.read_text().strip(),'artifact',artifact,'stderr',stderr)
          print('=== FOCUS CONTROL ===')
          print('v251-focus-process', (e/'v251-focus.status').read_text().strip())
          print('v251-focus-stderr', (e/'v251-focus.stderr').read_text()[:600].replace('\n',' | '))
          PY

      - name: Upload clean-room adversarial evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: probe-352-v260-slides-pdf-adversarial-v2-${{ github.run_id }}
          path: evidence
          if-no-files-found: error
