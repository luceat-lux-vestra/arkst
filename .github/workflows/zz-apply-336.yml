name: Apply #336 stack alignment candidate

on:
  push:
    branches:
      - compat/336-stack-alignment-inheritance

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
