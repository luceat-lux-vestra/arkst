    assert!(result.diagnostics.is_empty(), "{:?}", result.diagnostics);
    let debug = format!("{:?}", result.ir.nodes);
    assert!(debug.contains("SHADOW-ROW"), "{debug}");
    assert!(debug.contains("SHADOW-COLUMN"), "{debug}");
    assert!(!debug.contains("Stacked"), "{debug}");
}
