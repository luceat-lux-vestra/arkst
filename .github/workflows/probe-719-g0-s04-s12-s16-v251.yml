name: Quarkdown G0 S04 S12 S16 clean-room probe

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: official-v2.5.1-black-box
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch exact official Quarkdown v2.5.1 distribution
        shell: bash
        run: |
          set -euo pipefail
          version='v2.5.1'
          expected='5751ab608fcb4daa2ec857a3368c029beed5429554ae0bdd95c660b2706269e9'
          archive='/tmp/quarkdown-v2.5.1.zip'
          root='/tmp/quarkdown-v2.5.1'
          url='https://github.com/iamgio/quarkdown/releases/download/v2.5.1/quarkdown-linux-x64.zip'

          curl -fL --retry 3 --retry-all-errors --connect-timeout 20 -o "$archive" "$url"
          printf '%s  %s\n' "$expected" "$archive" | sha256sum -c -

          rm -rf "$root"
          mkdir -p "$root"
          unzip -q "$archive" -d "$root"
          qd="$(find "$root" -type f -name quarkdown -perm -111 -print -quit)"
          test -n "$qd"
          printf 'QD=%s\n' "$qd" >> "$GITHUB_ENV"
          printf 'QD_REFERENCE_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          "$qd" --version

      - name: Run independently authored G0 S04 S12 S16 probes
        shell: bash
        run: |
          set -euo pipefail
          root='/tmp/arkst-g0-reference-v251'
          rm -rf "$root"
          mkdir -p "$root"

          cat > "$root/s04.qd" <<'QD'
          .function {greet}
              to from?:
              Hello, .to from .from!

          .greet {world}
          .greet {world} from:{Jane}
          QD

          cat > "$root/s12.qd" <<'QD'
          .docname {before}
          .function {greet}
              name:
              .docname {changed}
              .sum {true} {2}

          .extend {greet}
              name:
              .super

          .greet {world}
          .docname
          QD

          cat > "$root/s16-dynamic.qd" <<'QD'
          .var {numbertext} {.string {-3.5}}
          .abs {.numbertext}
          QD

          cat > "$root/s16-static.qd" <<'QD'
          .abs {.string {-3.5}}
          QD

          : > "$root/observations.jsonl"

          for fixture in s04 s12 s16-dynamic s16-static; do
            for mode in default strict; do
              out="$root/out-$fixture-$mode"
              stdout="$root/$fixture-$mode.stdout"
              stderr="$root/$fixture-$mode.stderr"
              rm -rf "$out"

              args=(compile "$root/$fixture.qd" --clean --pretty --out "$out" --out-name probe)
              if [ "$mode" = strict ]; then
                args+=(--strict)
              fi

              set +e
              "$QD" "${args[@]}" >"$stdout" 2>"$stderr"
              rc=$?
              set -e

              python3 - "$root" "$fixture" "$mode" "$rc" "$stdout" "$stderr" "$out" <<'PY'
          from __future__ import annotations

          from hashlib import sha256
          from html.parser import HTMLParser
          import json
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          fixture = sys.argv[2]
          mode = sys.argv[3]
          rc = int(sys.argv[4])
          stdout_path = Path(sys.argv[5])
          stderr_path = Path(sys.argv[6])
          out_dir = Path(sys.argv[7])

          class VisibleText(HTMLParser):
              def __init__(self) -> None:
                  super().__init__()
                  self.parts: list[str] = []
                  self.skip = 0

              def handle_starttag(self, tag: str, attrs) -> None:
                  if tag in ("script", "style"):
                      self.skip += 1

              def handle_endtag(self, tag: str) -> None:
                  if tag in ("script", "style") and self.skip:
                      self.skip -= 1

              def handle_data(self, data: str) -> None:
                  if not self.skip:
                      self.parts.append(data)

          html_files = sorted(out_dir.rglob("*.html")) if out_dir.is_dir() else []
          html_texts = []
          html_sha256 = []
          for path in html_files:
              data = path.read_bytes()
              parser = VisibleText()
              parser.feed(data.decode("utf-8", errors="replace"))
              html_texts.append(" ".join(" ".join(parser.parts).split()))
              html_sha256.append(sha256(data).hexdigest())

          observation = {
              "reference": "official-quarkdown-v2.5.1-linux-x64",
              "archive_sha256": "5751ab608fcb4daa2ec857a3368c029beed5429554ae0bdd95c660b2706269e9",
              "fixture": fixture,
              "mode": mode,
              "rc": rc,
              "stdout": stdout_path.read_text(encoding="utf-8", errors="replace"),
              "stderr": stderr_path.read_text(encoding="utf-8", errors="replace"),
              "html_count": len(html_files),
              "html_text": html_texts,
              "html_sha256": html_sha256,
          }
          with (root / "observations.jsonl").open("a", encoding="utf-8") as stream:
              stream.write(json.dumps(observation, ensure_ascii=False, sort_keys=True) + "\n")
          print(json.dumps(observation, ensure_ascii=False, sort_keys=True))
          PY
            done
          done

      - name: Upload clean-room observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g0-s04-s12-s16-quarkdown-v2.5.1
          path: /tmp/arkst-g0-reference-v251
          if-no-files-found: error
