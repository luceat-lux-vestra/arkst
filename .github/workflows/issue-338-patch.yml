name: Temporary issue 338 patch harness

on:
  push:
    branches: [compat/338-page-alignment-state]
    paths:
      - .github/workflows/issue-338-patch.yml
      - tools/issue_338_patch.py

permissions:
  contents: write

concurrency:
  group: issue-338-patch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot
        with:
          toolchain: 1.98.0
          components: rustfmt
      - name: Apply bounded patch
        run: python3 tools/issue_338_patch.py
      - name: Format
        run: cargo fmt --all
      - name: Targeted contract tests
        run: |
          cargo test --locked -p arkst-core --test quarkdown_v260_page_alignment
          cargo test --locked -p arkst-ir document_state_roundtrips_deterministically_and_defaults_for_old_ir
      - name: Diff validation
        run: git diff --check
      - name: Commit semantic patch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            crates/arkst-ir/src/lib.rs \
            crates/arkst-engine/src/value_conversion.rs \
            crates/arkst-engine/src/evaluator.rs \
            crates/arkst-core/tests/quarkdown_v260_page_alignment.rs
          git commit -m 'feat(compat): add bounded page alignment state'
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            push origin "HEAD:${GITHUB_REF_NAME}"

# rerun after correcting independently-authored fixture indentation
