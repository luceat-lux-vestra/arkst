name: v2.6 callout backtick proof patch

on:
  push:
    branches:
      - compat/311-v260-code-callouts

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded lowering fix and adversarial proof
        shell: python
        run: |
          from pathlib import Path

          lowering = Path('crates/arkst-typst/src/lowering.rs')
          text = lowering.read_text()
          old = "'*' | '_' | '~' | '#' | '$' | '<' | '>' | '@' | '[' | ']'"
          new = "'*' | '_' | '~' | '`' | '#' | '$' | '<' | '>' | '@' | '[' | ']'"
          assert text.count(old) == 1, text.count(old)
          lowering.write_text(text.replace(old, new, 1))

          test = Path('crates/arkst-typst-subprocess/tests/code_callouts_integration.rs')
          text = test.read_text()
          import_anchor = 'use arkst_core::{compile, CompileOptions, VirtualProjectBuilder};\n'
          import_replacement = 'use arkst_core::ir::IrNode;\nuse arkst_core::{compile, CompileOptions, VirtualProjectBuilder};\n'
          assert text.count(import_anchor) == 1, text.count(import_anchor)
          text = text.replace(import_anchor, import_replacement, 1)

          lower_anchor = '    let typst_code = lower_to_typst_code(&result.ir);\n'
          lower_replacement = '''    let mut result = result;\n    let IrNode::CodeBlock { callouts, .. } = &mut result.ir.nodes[0] else {\n        panic!("expected compiled code block");\n    };\n    callouts[0].description = "literal ` backtick".into();\n\n    let typst_code = lower_to_typst_code(&result.ir);\n'''
          assert text.count(lower_anchor) == 1, text.count(lower_anchor)
          text = text.replace(lower_anchor, lower_replacement, 1)

          assertion = '    assert!(typst_code.contains("[First]"), "{typst_code}");\n'
          replacement = '    assert!(typst_code.contains(r"[literal \\` backtick]"), "{typst_code}");\n'
          assert text.count(assertion) == 1, text.count(assertion)
          text = text.replace(assertion, replacement, 1)
          test.write_text(text)

      - name: Format and verify patch ownership
        run: |
          cargo fmt --all
          git diff --check
          git diff -- crates/arkst-typst/src/lowering.rs crates/arkst-typst-subprocess/tests/code_callouts_integration.rs

      - name: Commit patch and remove disposable workflow
        run: |
          rm .github/workflows/v260-backtick-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/arkst-typst/src/lowering.rs crates/arkst-typst-subprocess/tests/code_callouts_integration.rs .github/workflows/v260-backtick-fix.yml
          git commit -m "fix(typst): escape backticks in callout text"
          git push origin HEAD:compat/311-v260-code-callouts
