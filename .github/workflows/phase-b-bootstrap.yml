name: Phase B bootstrap

on:
  push:
    branches: [compat/173-doclang-locale-closure]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[phase-b-jdk25]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Download exact Temurin 25 reference
        id: jdk
        shell: bash
        run: |
          set -euo pipefail
          readarray -t v < <(python3 - <<'PY'
          import tomllib
          from pathlib import Path
          with Path('docs/compatibility/quarkdown/reference-jvm.toml').open('rb') as f:
              r=tomllib.load(f)['reference']
          print(r['archive_filename']); print(r['archive_url']); print(r['archive_sha256'])
          PY
          )
          p="$RUNNER_TEMP/${v[0]}"
          curl --fail --location --retry 3 --output "$p" "${v[1]}"
          printf '%s  %s\n' "${v[2]}" "$p" | sha256sum --check --strict
          d="$RUNNER_TEMP/jdk25"; mkdir -p "$d"; tar -xzf "$p" -C "$d"
          j="$(find "$d" -path '*/bin/java' -print -quit)"; test -x "$j"
          echo "archive=$p" >> "$GITHUB_OUTPUT"; echo "java=$j" >> "$GITHUB_OUTPUT"
      - name: Convert and generate JDK25 CLDR locale data
        env:
          REFERENCE_JAVA: ${{ steps.jdk.outputs.java }}
          ARCHIVE_PATH: ${{ steps.jdk.outputs.archive }}
        run: |
          set -euo pipefail
          python3 tools/phase_b_migrate.py
          python3 tools/generate_jdk25_locale_data.py --java "$REFERENCE_JAVA" --archive "$ARCHIVE_PATH"
          sha256sum tools/dump_jdk25_locale_data.java tools/dump_jdk25_locale_display_data.java crates/scribium-engine/src/locale_data.rs crates/scribium-engine/data/jdk25_locale_display.bin
      - name: Commit discovery snapshot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'compat(engine): regenerate locale oracle on Temurin25 CLDR [phase-b-jdk25]'
          git push origin HEAD:compat/173-doclang-locale-closure
