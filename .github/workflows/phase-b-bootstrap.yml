name: Phase B bootstrap

on:
  push:
    branches: [compat/173-doclang-locale-closure]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[phase-b-candidates]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Download exact Temurin 25 reference
        id: jdk
        shell: bash
        run: |
          set -euo pipefail
          readarray -t v < <(python3 - <<'PY'
          import tomllib
          from pathlib import Path
          with Path('docs/compatibility/quarkdown/reference-jvm.toml').open('rb') as f:
              r=tomllib.load(f)['reference']
          print(r['archive_filename']); print(r['archive_url']); print(r['archive_sha256'])
          PY
          )
          p="$RUNNER_TEMP/${v[0]}"; curl --fail --location --retry 3 --output "$p" "${v[1]}"
          printf '%s  %s\n' "${v[2]}" "$p" | sha256sum --check --strict
          d="$RUNNER_TEMP/jdk25"; mkdir -p "$d"; tar -xzf "$p" -C "$d"
          j="$(find "$d" -path '*/bin/java' -print -quit)"; test -x "$j"
          echo "archive=$p" >> "$GITHUB_OUTPUT"; echo "java=$j" >> "$GITHUB_OUTPUT"
      - name: Apply exact candidate graph and regenerate
        env:
          REFERENCE_JAVA: ${{ steps.jdk.outputs.java }}
          ARCHIVE_PATH: ${{ steps.jdk.outputs.archive }}
        run: |
          set -euo pipefail
          python3 tools/phase_b_finalize.py
          python3 tools/phase_b_tests.py
          python3 tools/generate_jdk25_locale_data.py --java "$REFERENCE_JAVA" --archive "$ARCHIVE_PATH"
          sha256sum crates/scribium-engine/src/locale_data.rs crates/scribium-engine/data/jdk25_locale_display.bin
      - name: Run external JDK25 BaseLocale and public-resolution differential
        env:
          REFERENCE_JAVA: ${{ steps.jdk.outputs.java }}
        run: |
          set -euo pipefail
          "$REFERENCE_JAVA" -Djava.locale.providers=CLDR --source 25 tools/dump_jdk25_locale_oracle.java > "$RUNNER_TEMP/locale-oracle.tsv"
          SCRIBIUM_JDK25_LOCALE_ORACLE="$RUNNER_TEMP/locale-oracle.tsv" \
            cargo test -p scribium-engine --locked \
            'locale::tests::jdk25_locale_oracle_matches_candidate_graph_and_public_resolution' -- --exact
          wc -l "$RUNNER_TEMP/locale-oracle.tsv"
      - name: Report timezone-source provenance
        env:
          ARCHIVE_PATH: ${{ steps.jdk.outputs.archive }}
        run: |
          python3 - <<'PY'
          import hashlib, io, re, tarfile, zipfile, os
          archive=os.environ['ARCHIVE_PATH']
          with tarfile.open(archive,'r:gz') as tar:
              member=next(m for m in tar.getmembers() if m.name.endswith('/lib/src.zip'))
              raw=tar.extractfile(member).read()
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              source=z.read('java.base/sun/util/cldr/CLDRBaseLocaleDataMetaInfo.java')
          matches=re.findall(rb'tzCanonicalIDMap\.put\("([^"]+)",', source)
          ids=sorted({v.decode('ascii') for v in matches if v.isascii() and v.isalnum() and v==v.lower() and 3<=len(v)<=8})
          print('tz_source_sha256='+hashlib.sha256(source).hexdigest())
          print('tz_source_entries='+str(len(matches)))
          print('tz_source_unique='+str(len(set(matches))))
          print('tz_candidate_ids='+str(len(ids)))
          PY
      - name: Compile focused tree
        run: |
          cargo fmt --all -- --check
          cargo check -p scribium-engine --all-features --locked
      - name: Commit candidate-graph snapshot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'compat(engine): match JDK25 locale candidate graph [phase-b-candidates]'
          git push origin HEAD:compat/173-doclang-locale-closure
