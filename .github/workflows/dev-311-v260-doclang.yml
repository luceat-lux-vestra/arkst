name: Dev #311 v2.6.0 doclang

on:
  push:
    branches:
      - compat/311-v260-doclang-getter

permissions:
  contents: write
  actions: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Fetch pinned black-box snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -L -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/luceat-lux-vestra/arkst/actions/artifacts/10268667042/zip \
            -o "$RUNNER_TEMP/doclang.zip"
          unzip -q "$RUNNER_TEMP/doclang.zip" -d "$RUNNER_TEMP/doclang"
          snapshot="$RUNNER_TEMP/doclang/quarkdown-v2.6.0-doclang-snapshot.tsv"
          printf '%s  %s\n' 'b684f0cd8f6b14537f2857494c967cd73b1a33c9f51938ddcb2fbbcb8525c3a6' "$snapshot" | sha256sum -c --strict
          python3 tools/apply_v260_doclang.py "$snapshot"

      - name: Format and targeted regression
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo test -p arkst-engine doclang_v260_snapshot_tests --locked
          cargo test -p arkst-core doclang_ --locked
          cargo test -p arkst-core --test quarkdown_localization --locked
          cargo test -p arkst-test-support doclang --locked

      - name: Commit product candidate without disposable workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/dev-311-v260-doclang.yml tools/apply_v260_doclang.py
          git add -A
          test -n "$(git status --porcelain)"
          test -z "$(git status --porcelain | grep -E '^.. (\.github/workflows/dev-311-v260-doclang\.yml|tools/apply_v260_doclang\.py)$' || true)"
          git config user.name 'luceat-lux-vestra'
          git config user.email 'heathkimdev@gmail.com'
          git commit -m 'feat(compat): migrate doclang to Quarkdown v2.6.0'
          git push origin HEAD:compat/311-v260-doclang-getter
