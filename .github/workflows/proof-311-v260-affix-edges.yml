name: Disposable #311 v2.6.0 collection affix edges

on:
  push:
    branches:
      - proof/311-v260-doclang-iterable-oracle

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Observe typed iterables and shadowing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release="$RUNNER_TEMP/release.json"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" https://api.github.com/repos/iamgio/quarkdown/releases/tags/v2.6.0 > "$release"
          asset="quarkdown-linux-x64.zip"
          url="$(jq -r --arg n "$asset" '.assets[] | select(.name==$n) | .browser_download_url' "$release")"
          digest="$(jq -r --arg n "$asset" '.assets[] | select(.name==$n) | .digest' "$release")"
          test "$digest" = "sha256:5b015e47c820d06ff6774eb700e60d77bc575819d4a0140cc7f1a115e7ce6dc4"
          zip="$RUNNER_TEMP/$asset"; curl -fsSL "$url" -o "$zip"
          printf '%s  %s\n' "${digest#sha256:}" "$zip" | sha256sum -c --strict
          root="$RUNNER_TEMP/q"; mkdir -p "$root"; unzip -q "$zip" -d "$root"
          q="$(find "$root" -type f -path '*/bin/quarkdown' -print -quit)"; chmod +x "$q"
          "$q" --version | grep -F '2.6.0'

          run_case() {
            name="$1"
            shift
            dir="$RUNNER_TEMP/$name"; mkdir -p "$dir"
            printf '%s\n' "$@" > "$dir/main.qd"
            set +e
            (cd "$dir" && "$q" c main.qd --clean) >"$dir/stdout" 2>"$dir/stderr"
            status=$?
            set -e
            echo "CASE=$name EXIT=$status"
            sed -n '1,100p' "$dir/stderr" | sed 's/^/STDERR: /'
            if [ -d "$dir/quarkdown-output" ]; then
              python3 - "$dir/quarkdown-output" <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import sys
          class T(HTMLParser):
              def __init__(self): super().__init__(); self.parts=[]
              def handle_data(self,d): self.parts.append(d)
          parts=[]
          for p in Path(sys.argv[1]).rglob('*.html'):
              t=T(); t.feed(p.read_text(encoding='utf-8')); parts.extend(t.parts)
          print('TEXT:', ' '.join(' '.join(parts).split()))
          PY
            fi
          }

          run_case pair '.doctype {plain}' '.pair {left} {right}::prepended {zero}::first' '.pair {left} {right}::appended {tail}::last'
          run_case dictionary '.doctype {plain}' '.var {table}' '    .dictionary' '        - a: 1' '        - b: 2' '.table::prepended {zero}::first' '.table::appended {tail}::last' '.table::prepended {zero}::last::first'
          run_case range '.doctype {plain}' '.range {-2} {1}::prepended {zero}::first' '.range {-2} {1}::appended {tail}::last'
          run_case typed_insert '.doctype {plain}' '.var {values}' '    - B' '    - C' '.values::prepended {.pair {x} {y}}::first::first' '.values::appended {.pair {x} {y}}::last::second'
          run_case shadow '.doctype {plain}' '.function {prepended}' '    to value:' '    .value' '.function {appended}' '    to value:' '    .value' '.prepended {not-an-iterable} {shadow-pre}' '.appended {not-an-iterable} {shadow-app}'
