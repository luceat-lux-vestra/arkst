name: Quarkdown v2.6 logger black-box probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch exact official v2.6.0 distribution
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/iamgio/quarkdown/releases/download/v2.6.0/quarkdown-linux-x64.zip'
          expected='5b015e47c820d06ff6774eb700e60d77bc575819d4a0140cc7f1a115e7ce6dc4'
          curl -fL --retry 3 --retry-all-errors --connect-timeout 20 -o /tmp/quarkdown-v2.6.0.zip "$url"
          printf '%s  %s\n' "$expected" /tmp/quarkdown-v2.6.0.zip | sha256sum -c -
          mkdir -p /tmp/quarkdown-v2.6.0
          unzip -q /tmp/quarkdown-v2.6.0.zip -d /tmp/quarkdown-v2.6.0
          qd="$(find /tmp/quarkdown-v2.6.0 -type f -name quarkdown -perm -111 -print -quit)"
          test -n "$qd"
          printf 'QD=%s\n' "$qd" >> "$GITHUB_ENV"
          "$qd" --version

      - name: Probe severity output channels and return visibility
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/logger197
          mkdir -p "$root"
          cat > "$root/log.qd" <<'QD'
          before-log
          .log {QD197_LOG}
          after-log
          QD
          cat > "$root/debug.qd" <<'QD'
          before-debug
          .debug {QD197_DEBUG}
          after-debug
          QD
          cat > "$root/error.qd" <<'QD'
          before-error
          .error {QD197_ERROR}
          after-error
          QD
          cat > "$root/ordered.qd" <<'QD'
          visible-before
          .log {QD197_ORDER_LOG}
          visible-middle-1
          .debug {QD197_ORDER_DEBUG}
          visible-middle-2
          .error {QD197_ORDER_ERROR}
          visible-after
          QD

          for fixture in log debug error ordered; do
            for strict in default strict; do
              out="$root/out-$fixture-$strict"
              stdout="$root/$fixture-$strict.stdout"
              stderr="$root/$fixture-$strict.stderr"
              args=(compile "$root/$fixture.qd" --clean --pretty --out "$out" --out-name probe)
              if [ "$strict" = strict ]; then args+=(--strict); fi
              set +e
              "$QD" "${args[@]}" >"$stdout" 2>"$stderr"
              rc=$?
              set -e
              printf 'QD197-RUN fixture=%s mode=%s rc=%s\n' "$fixture" "$strict" "$rc"
              printf '%s\n' "QD197-STDOUT-BEGIN $fixture $strict"
              cat "$stdout"
              printf '%s\n' "QD197-STDOUT-END $fixture $strict"
              printf '%s\n' "QD197-STDERR-BEGIN $fixture $strict"
              cat "$stderr"
              printf '%s\n' "QD197-STDERR-END $fixture $strict"
              html="$(find "$out" -type f -name '*.html' -print -quit 2>/dev/null || true)"
              if [ -n "$html" ]; then
                python3 - "$html" "$fixture" "$strict" <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re, sys

          class Text(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts=[]
                  self.skip=0
              def handle_starttag(self, tag, attrs):
                  if tag in ("script","style"):
                      self.skip += 1
              def handle_endtag(self, tag):
                  if tag in ("script","style") and self.skip:
                      self.skip -= 1
              def handle_data(self, data):
                  if not self.skip:
                      self.parts.append(data)

          p=Text()
          p.feed(Path(sys.argv[1]).read_text())
          text=" ".join(" ".join(p.parts).split())
          markers=re.findall(r'(?:visible|before|after|middle)[-A-Za-z0-9]*|QD197_[A-Z0-9_]+', text)
          print(f"QD197-HTML fixture={sys.argv[2]} mode={sys.argv[3]} markers={markers!r}")
          PY
              else
                printf 'QD197-HTML fixture=%s mode=%s NONE\n' "$fixture" "$strict"
              fi
            done
          done

      - name: Probe message conversion and repeated calls
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/logger197-values
          mkdir -p "$root"
          cat > "$root/values.qd" <<'QD'
          .log {first}
          .log {second}
          .debug {third}
          .log {42}
          .debug {true}
          QD
          set +e
          "$QD" compile "$root/values.qd" --clean --pretty --out "$root/out" --out-name probe >"$root/stdout" 2>"$root/stderr"
          rc=$?
          set -e
          printf 'QD197-VALUES rc=%s\n' "$rc"
          printf '%s\n' 'QD197-VALUES-STDOUT-BEGIN'
          cat "$root/stdout"
          printf '%s\n' 'QD197-VALUES-STDOUT-END'
          printf '%s\n' 'QD197-VALUES-STDERR-BEGIN'
          cat "$root/stderr"
          printf '%s\n' 'QD197-VALUES-STDERR-END'

      - name: Probe CLI debug controls and isolated scalar messages
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/logger197-second
          mkdir -p "$root"
          printf '%s\n' 'QD197-ROOT-HELP-BEGIN'
          "$QD" --help | grep -Ei 'debug|verbose|log|trace' || true
          printf '%s\n' 'QD197-ROOT-HELP-END'
          printf '%s\n' 'QD197-COMPILE-HELP-BEGIN'
          "$QD" compile --help | grep -Ei 'debug|verbose|log|trace|strict' || true
          printf '%s\n' 'QD197-COMPILE-HELP-END'

          cat > "$root/log-text.qd" <<'QD'
          before
          .log {QD197_ISO_LOG_TEXT}
          after
          QD
          cat > "$root/log-number.qd" <<'QD'
          before
          .log {42}
          after
          QD
          cat > "$root/debug-text.qd" <<'QD'
          before
          .debug {QD197_ISO_DEBUG_TEXT}
          after
          QD
          cat > "$root/debug-number.qd" <<'QD'
          before
          .debug {42}
          after
          QD
          cat > "$root/error-number.qd" <<'QD'
          before
          .error {42}
          after
          QD
          cat > "$root/repeated.qd" <<'QD'
          .log {QD197_REPEAT_ONE}

          .log {QD197_REPEAT_TWO}

          .debug {QD197_REPEAT_DEBUG}
          QD

          for fixture in log-text log-number debug-text debug-number error-number repeated; do
            out="$root/out-$fixture"
            set +e
            "$QD" compile "$root/$fixture.qd" --clean --pretty --out "$out" --out-name probe >"$root/$fixture.stdout" 2>"$root/$fixture.stderr"
            rc=$?
            set -e
            printf 'QD197-ISO fixture=%s rc=%s\n' "$fixture" "$rc"
            printf 'QD197-ISO-STDOUT %s [' "$fixture"
            tr '\n' '|' <"$root/$fixture.stdout"
            printf ']\n'
            printf 'QD197-ISO-STDERR %s [' "$fixture"
            tr '\n' '|' <"$root/$fixture.stderr"
            printf ']\n'
          done

          root_help="$("$QD" --help 2>&1 || true)"
          compile_help="$("$QD" compile --help 2>&1 || true)"
          debug_args=()
          if grep -q -- '--debug' <<<"$compile_help"; then
            debug_args=(--debug)
          elif grep -q -- '--verbose' <<<"$compile_help"; then
            debug_args=(--verbose)
          elif grep -q -- '--debug' <<<"$root_help"; then
            debug_args=(--debug compile)
          elif grep -q -- '--verbose' <<<"$root_help"; then
            debug_args=(--verbose compile)
          fi
          if [ "${#debug_args[@]}" -gt 0 ]; then
            if [ "${debug_args[-1]}" = compile ]; then
              args=("${debug_args[@]}" "$root/debug-text.qd" --clean --pretty --out "$root/out-debug-enabled" --out-name probe)
            else
              args=(compile "$root/debug-text.qd" --clean --pretty --out "$root/out-debug-enabled" --out-name probe "${debug_args[@]}")
            fi
            set +e
            "$QD" "${args[@]}" >"$root/debug-enabled.stdout" 2>"$root/debug-enabled.stderr"
            rc=$?
            set -e
            printf 'QD197-DEBUG-ENABLED args=%q rc=%s\n' "${debug_args[*]}" "$rc"
            printf 'QD197-DEBUG-ENABLED-STDOUT ['
            tr '\n' '|' <"$root/debug-enabled.stdout"
            printf ']\n'
            printf 'QD197-DEBUG-ENABLED-STDERR ['
            tr '\n' '|' <"$root/debug-enabled.stderr"
            printf ']\n'
          else
            printf '%s\n' 'QD197-DEBUG-ENABLED no-debug-or-verbose-cli-flag'
          fi

      - name: Probe error value shape and continuation
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/logger197-error-shape
          mkdir -p "$root"
          cat > "$root/standalone.qd" <<'QD'
          alpha
          .error {QD197_SHAPE}
          omega
          QD
          cat > "$root/inside-if.qd" <<'QD'
          before
          .if {true}
              .error {QD197_IF_ERROR}
          after
          QD
          cat > "$root/inside-function.qd" <<'QD'
          .function {boom}
              .error {QD197_FN_ERROR}
          before
          .boom
          after
          QD

          for fixture in standalone inside-if inside-function; do
            out="$root/out-$fixture"
            set +e
            "$QD" compile "$root/$fixture.qd" --clean --out "$out" --out-name probe >"$root/$fixture.stdout" 2>"$root/$fixture.stderr"
            rc=$?
            set -e
            printf 'QD197-SHAPE fixture=%s rc=%s\n' "$fixture" "$rc"
            printf 'QD197-SHAPE-STDOUT %s [' "$fixture"
            tr '\n' '|' <"$root/$fixture.stdout"
            printf ']\n'
            printf 'QD197-SHAPE-STDERR %s [' "$fixture"
            tr '\n' '|' <"$root/$fixture.stderr"
            printf ']\n'
            html="$(find "$out" -type f -name '*.html' -print -quit 2>/dev/null || true)"
            if [ -n "$html" ]; then
              python3 - "$html" "$fixture" <<'PY'
          from pathlib import Path
          import re, sys
          html=Path(sys.argv[1]).read_text()
          marker="QD197_"
          positions=[m.start() for m in re.finditer(marker, html)]
          print(f"QD197-SHAPE-HTML fixture={sys.argv[2]} occurrences={len(positions)}")
          for i,pos in enumerate(positions[:8]):
              lo=max(0,pos-180)
              hi=min(len(html),pos+260)
              snippet=" ".join(html[lo:hi].split())
              print(f"QD197-SHAPE-SNIP fixture={sys.argv[2]} index={i} text={snippet}")
          PY
            else
              printf 'QD197-SHAPE-HTML fixture=%s NONE\n' "$fixture"
            fi
          done

      - name: Probe return values and failure propagation
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/logger197-return
          mkdir -p "$root"

          cat > "$root/log-chain.qd" <<'QD'
          before
          .log {QD197_CHAIN_LOG}::isnone
          after
          QD
          cat > "$root/debug-chain.qd" <<'QD'
          before
          .debug {QD197_CHAIN_DEBUG}::isnone
          after
          QD
          cat > "$root/error-chain.qd" <<'QD'
          before
          .error {QD197_CHAIN_ERROR}::isnone
          after
          QD
          cat > "$root/log-variable.qd" <<'QD'
          .var {x} {.log {QD197_VAR_LOG}}
          value:.x
          QD
          cat > "$root/debug-variable.qd" <<'QD'
          .var {x} {.debug {QD197_VAR_DEBUG}}
          value:.x
          QD

          for fixture in log-chain debug-chain error-chain log-variable debug-variable; do
            for strict in default strict; do
              out="$root/out-$fixture-$strict"
              args=(compile "$root/$fixture.qd" --clean --pretty --out "$out" --out-name probe)
              if [ "$strict" = strict ]; then args+=(--strict); fi
              set +e
              "$QD" "${args[@]}" >"$root/$fixture-$strict.stdout" 2>"$root/$fixture-$strict.stderr"
              rc=$?
              set -e
              printf 'QD197-RETURN fixture=%s mode=%s rc=%s\n' "$fixture" "$strict" "$rc"
              printf 'QD197-RETURN-STDOUT %s %s [' "$fixture" "$strict"
              tr '\n' '|' <"$root/$fixture-$strict.stdout"
              printf ']\n'
              printf 'QD197-RETURN-STDERR %s %s [' "$fixture" "$strict"
              tr '\n' '|' <"$root/$fixture-$strict.stderr"
              printf ']\n'
              html="$(find "$out" -type f -name '*.html' -print -quit 2>/dev/null || true)"
              if [ -n "$html" ]; then
                python3 - "$html" "$fixture" "$strict" <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import sys

          class Text(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts=[]
                  self.skip=0
              def handle_starttag(self, tag, attrs):
                  if tag in ("script","style"): self.skip += 1
              def handle_endtag(self, tag):
                  if tag in ("script","style") and self.skip: self.skip -= 1
              def handle_data(self, data):
                  if not self.skip: self.parts.append(data)

          p=Text()
          p.feed(Path(sys.argv[1]).read_text())
          text=" ".join(" ".join(p.parts).split())
          print(f"QD197-RETURN-HTML fixture={sys.argv[2]} mode={sys.argv[3]} text={text!r}")
          PY
              else
                printf 'QD197-RETURN-HTML fixture=%s mode=%s NONE\n' "$fixture" "$strict"
              fi
            done
          done
