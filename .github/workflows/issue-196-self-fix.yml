name: Temporary issue 196 self-fix

on:
  push:
    branches: [compat/196-localization-semantics]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: issue-196-self-fix
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: compat/196-localization-semantics
          fetch-depth: 0
          persist-credentials: true

      - name: Download exact pinned Temurin 25
        id: jdk
        shell: bash
        run: |
          readarray -t values < <(python3 - <<'PY'
          import tomllib
          from pathlib import Path
          with Path('docs/compatibility/quarkdown/reference-jvm.toml').open('rb') as stream:
              reference = tomllib.load(stream)['reference']
          print(reference['archive_filename'])
          print(reference['archive_url'])
          print(reference['archive_sha256'])
          PY
          )
          archive="$RUNNER_TEMP/${values[0]}"
          curl --fail --location --retry 3 --output "$archive" "${values[1]}"
          printf '%s  %s\n' "${values[2]}" "$archive" | sha256sum --check --strict
          extract_root="$RUNNER_TEMP/temurin25"
          mkdir -p "$extract_root"
          tar --extract --gzip --file "$archive" --directory "$extract_root"
          java="$(find "$extract_root" -path '*/bin/java' -print -quit)"
          test -x "$java"
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"
          printf 'java=%s\n' "$java" >> "$GITHUB_OUTPUT"

      - name: Apply and verify exact localization fix
        env:
          REFERENCE_JAVA: ${{ steps.jdk.outputs.java }}
          REFERENCE_ARCHIVE: ${{ steps.jdk.outputs.archive }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          (
            set -e
            python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/self_fix_196.py')
          source = path.read_text(encoding='utf-8')
          start = source.index("    return f'''//! Locale.ROOT word-break DFA")
          source = source[:start] + source[start:].replace("    return f'''//! Locale.ROOT word-break DFA", '    return f"""//! Locale.ROOT word-break DFA', 1)
          end = source.index("\n'''\n\n\ndef main() -> None:", start)
          source = source[:end] + source[end:].replace("\n'''\n\n\ndef main() -> None:", '\n"""\n\n\ndef main() -> None:', 1)
          source = source.replace(
              "updated, count = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE | re.DOTALL)",
              "updated, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=re.MULTILINE | re.DOTALL)",
              1,
          )
          source = source.replace(
              '''pub const REFERENCE_JVM_ARCHIVE_SHA256: &str = "{reference['archive_sha256']}";\npub const WORD_BREAK_ORACLE_SHA256: &str = "{oracle_sha}";''',
              '''pub const REFERENCE_JVM_ARCHIVE_SHA256: &str =\n    "{reference['archive_sha256']}";\npub const WORD_BREAK_ORACLE_SHA256: &str =\n    "{oracle_sha}";''',
              1,
          )
          source = source.replace('assert_eq!(points("ΟΣ\'\'Α"), vec![0, 2, 3, 5]);', 'assert_eq!(points("ΟΣ\'\'Α"), vec![0, 2, 3, 4, 5]);', 1)
          source = source.replace('assert_eq!(points("ΟΣ..Α"), vec![0, 2, 3, 5]);', 'assert_eq!(points("ΟΣ..Α"), vec![0, 2, 3, 4, 5]);', 1)
          source = source.replace(
              '    run("cargo", "fmt", "--all", "--", "--check")',
              '    run("cargo", "fmt", "--all")\n    run("cargo", "fmt", "--all", "--", "--check")',
              1,
          )
          path.write_text(source, encoding='utf-8')
          PY
            python3 -m py_compile tools/self_fix_196.py
            python3 tools/self_fix_196.py --java "$REFERENCE_JAVA" --archive "$REFERENCE_ARCHIVE"
          ) > /tmp/self-fix.log 2>&1
          status=$?
          set -e
          cat /tmp/self-fix.log
          if [ "$status" -ne 0 ]; then
            {
              echo 'Temporary self-fix diagnostic (will be deleted after repair):'
              echo
              echo '```text'
              tail -c 50000 /tmp/self-fix.log
              echo
              echo '```'
            } > /tmp/comment.md
            gh api "repos/$GITHUB_REPOSITORY/issues/269/comments" -F body=@/tmp/comment.md
            exit "$status"
          fi

      - name: Commit final corrected branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/issue-196-self-fix.yml tools/self_fix_196.py
          git add -A
          git diff --cached --check
          git commit -m 'fix(stdlib): preserve pinned JVM word boundaries in localization'
          git push origin HEAD:compat/196-localization-semantics
