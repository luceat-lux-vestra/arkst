name: Quarkdown residual error-context black-box probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: residual-error-context-probe-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: probe (${{ matrix.version }})
    strategy:
      fail-fast: false
      matrix:
        version: [v2.5.1, v2.6.0]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch exact official distribution
        shell: bash
        run: |
          set -euo pipefail
          version='${{ matrix.version }}'
          case "$version" in
            v2.5.1) expected='5751ab608fcb4daa2ec857a3368c029beed5429554ae0bdd95c660b2706269e9' ;;
            v2.6.0) expected='5b015e47c820d06ff6774eb700e60d77bc575819d4a0140cc7f1a115e7ce6dc4' ;;
            *) echo "unexpected version: $version" >&2; exit 1 ;;
          esac
          url="https://github.com/iamgio/quarkdown/releases/download/$version/quarkdown-linux-x64.zip"
          archive="/tmp/quarkdown-$version.zip"
          dist="/tmp/quarkdown-$version"
          curl -fL --retry 3 --retry-all-errors --connect-timeout 20 -o "$archive" "$url"
          printf '%s  %s\n' "$expected" "$archive" | sha256sum -c -
          mkdir -p "$dist"
          unzip -q "$archive" -d "$dist"
          qd="$(find "$dist" -type f -name quarkdown -perm -111 -print -quit)"
          test -n "$qd"
          printf 'QD=%s\n' "$qd" >> "$GITHUB_ENV"
          "$qd" --version

      - name: Probe remaining output contexts
        shell: bash
        run: |
          set -euo pipefail
          root="/tmp/error-residual-${{ matrix.version }}"
          mkdir -p "$root"

          cat > "$root/direct-error.qd" <<'QD'
          direct-before
          .error {QD197_RES_DIRECT_ERROR}
          direct-after
          QD

          cat > "$root/ordered-error.qd" <<'QD'
          outer-before

          1. ordered-before .error {QD197_RES_ORDERED_ERROR} ordered-after

          outer-after
          QD

          cat > "$root/row-error.qd" <<'QD'
          outer-before
          .row
              row-before
              .error {QD197_RES_ROW_ERROR}
              row-after
          outer-after
          QD

          cat > "$root/landscape-error.qd" <<'QD'
          outer-before
          .landscape
              landscape-before
              .error {QD197_RES_LANDSCAPE_ERROR}
              landscape-after
          outer-after
          QD

          cat > "$root/deeper-error.qd" <<'QD'
          outer-before
          .center
              center-before
              .row
                  deep-before
                  .error {QD197_RES_DEEP_ERROR}
                  deep-after
              center-after
          outer-after
          QD

          cat > "$root/top-inline-error.qd" <<'QD'
          inline-before .error {QD197_RES_TOP_INLINE_ERROR} inline-after
          QD

          cat > "$root/ordered-log-control.qd" <<'QD'
          outer-before

          1. ordered-before .log {QD197_RES_ORDERED_LOG} ordered-after

          outer-after
          QD

          cat > "$root/row-log-control.qd" <<'QD'
          outer-before
          .row
              row-before
              .log {QD197_RES_ROW_LOG}
              row-after
          outer-after
          QD

          cat > "$root/landscape-log-control.qd" <<'QD'
          outer-before
          .landscape
              landscape-before
              .log {QD197_RES_LANDSCAPE_LOG}
              landscape-after
          outer-after
          QD

          cat > "$root/deeper-log-control.qd" <<'QD'
          outer-before
          .center
              center-before
              .row
                  deep-before
                  .log {QD197_RES_DEEP_LOG}
                  deep-after
              center-after
          outer-after
          QD

          cat > "$root/top-inline-log-control.qd" <<'QD'
          inline-before .log {QD197_RES_TOP_INLINE_LOG} inline-after
          QD

          inspect_html() {
            html="$1"
            fixture="$2"
            mode="$3"
            marker="$4"
            python3 - "$html" "$fixture" "$mode" "$marker" <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import json
          import sys

          path = Path(sys.argv[1])
          fixture, mode, marker = sys.argv[2:]
          raw = path.read_text(errors="replace")

          class Probe(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.stack = []
                  self.text = []
                  self.marker_paths = []
                  self.skip = 0

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  label = tag
                  if attrs.get("id"):
                      label += f"#{attrs['id']}"
                  if attrs.get("class"):
                      label += "." + ".".join(attrs["class"].split())
                  self.stack.append(label)
                  if tag in ("script", "style"):
                      self.skip += 1

              def handle_endtag(self, tag):
                  if tag in ("script", "style") and self.skip:
                      self.skip -= 1
                  if self.stack:
                      self.stack.pop()

              def handle_data(self, data):
                  if not self.skip:
                      self.text.append(data)
                  if marker in data:
                      self.marker_paths.append(list(self.stack))

          parser = Probe()
          parser.feed(raw)
          text = " ".join(" ".join(parser.text).split())
          index = raw.find(marker)
          neighborhood = ""
          if index >= 0:
              neighborhood = raw[max(0, index - 500):index + len(marker) + 700]
              neighborhood = neighborhood.replace("\r", "\\r").replace("\n", "\\n")

          print(
              "QD197-RESIDUAL-HTML "
              f"fixture={fixture} mode={mode} marker={marker} "
              f"marker_count={raw.count(marker)} dot_error_count={raw.count('.error')} "
              f"marker_paths={json.dumps(parser.marker_paths)}"
          )
          print(f"QD197-RESIDUAL-TEXT fixture={fixture} mode={mode} text={text!r}")
          print(f"QD197-RESIDUAL-RAW fixture={fixture} mode={mode} neighborhood={neighborhood!r}")
          PY
          }

          run_control() {
            fixture="$1"
            marker="$2"
            out="$root/out-$fixture"
            set +e
            "$QD" compile "$root/$fixture.qd" --clean --out "$out" --out-name probe >"$root/$fixture.stdout" 2>"$root/$fixture.stderr"
            rc=$?
            set -e

            printf 'QD197-RESIDUAL-CONTROL version=%s fixture=%s rc=%s\n' '${{ matrix.version }}' "$fixture" "$rc"
            printf 'QD197-RESIDUAL-CONTROL-STDOUT fixture=%s [' "$fixture"
            tr '\n' '|' <"$root/$fixture.stdout"
            printf ']\n'
            printf 'QD197-RESIDUAL-CONTROL-STDERR fixture=%s [' "$fixture"
            tr '\n' '|' <"$root/$fixture.stderr"
            printf ']\n'

            test "$rc" -eq 0
            grep -Fxq "$marker" "$root/$fixture.stdout"
            html="$(find "$out" -type f -name '*.html' -print -quit 2>/dev/null || true)"
            test -n "$html"
            inspect_html "$html" "$fixture" control "$marker"
          }

          run_error() {
            fixture="$1"
            marker="$2"
            mode="$3"
            out="$root/out-$fixture-$mode"
            args=(compile "$root/$fixture.qd" --clean --out "$out" --out-name probe)
            if [ "$mode" = strict ]; then
              args+=(--strict)
            fi

            set +e
            "$QD" "${args[@]}" >"$root/$fixture-$mode.stdout" 2>"$root/$fixture-$mode.stderr"
            rc=$?
            set -e

            printf 'QD197-RESIDUAL version=%s fixture=%s mode=%s rc=%s\n' '${{ matrix.version }}' "$fixture" "$mode" "$rc"
            printf 'QD197-RESIDUAL-STDOUT fixture=%s mode=%s [' "$fixture" "$mode"
            tr '\n' '|' <"$root/$fixture-$mode.stdout"
            printf ']\n'
            printf 'QD197-RESIDUAL-STDERR fixture=%s mode=%s [' "$fixture" "$mode"
            tr '\n' '|' <"$root/$fixture-$mode.stderr"
            printf ']\n'
            printf 'QD197-RESIDUAL-ARTIFACTS fixture=%s mode=%s [' "$fixture" "$mode"
            find "$out" -type f -printf '%f|' 2>/dev/null || true
            printf ']\n'

            grep -Fq "$marker" "$root/$fixture-$mode.stderr"

            html="$(find "$out" -type f -name '*.html' -print -quit 2>/dev/null || true)"
            if [ -n "$html" ]; then
              inspect_html "$html" "$fixture" "$mode" "$marker"
            else
              printf 'QD197-RESIDUAL-HTML fixture=%s mode=%s none\n' "$fixture" "$mode"
            fi

            if [ "$fixture" = direct-error ] && [ "$mode" = default ]; then
              test "$rc" -eq 0
              test -n "$html"
            fi
            if [ "$fixture" = direct-error ] && [ "$mode" = strict ]; then
              test "$rc" -eq 66
              grep -Fq 'An error occurred while in strict mode (error code 66)' "$root/$fixture-$mode.stderr"
              if find "$out" -type f \( -name '*.html' -o -name '*.pdf' \) -print -quit 2>/dev/null | grep -q .; then
                echo 'direct strict control unexpectedly published an artifact' >&2
                exit 1
              fi
            fi
          }

          run_control ordered-log-control QD197_RES_ORDERED_LOG
          run_control row-log-control QD197_RES_ROW_LOG
          run_control landscape-log-control QD197_RES_LANDSCAPE_LOG
          run_control deeper-log-control QD197_RES_DEEP_LOG
          run_control top-inline-log-control QD197_RES_TOP_INLINE_LOG

          for mode in default strict; do
            run_error direct-error QD197_RES_DIRECT_ERROR "$mode"
            run_error ordered-error QD197_RES_ORDERED_ERROR "$mode"
            run_error row-error QD197_RES_ROW_ERROR "$mode"
            run_error landscape-error QD197_RES_LANDSCAPE_ERROR "$mode"
            run_error deeper-error QD197_RES_DEEP_ERROR "$mode"
            run_error top-inline-error QD197_RES_TOP_INLINE_ERROR "$mode"
          done

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qd197-residual-error-${{ matrix.version }}-${{ github.run_id }}
          path: /tmp/error-residual-${{ matrix.version }}
          if-no-files-found: error
