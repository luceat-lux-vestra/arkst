name: Arkst rename reconciliation

on:
  push:
    branches:
      - fix/253-arkst-rename-reconciliation
    paths:
      - .github/workflows/253-reconcile.yml

permissions:
  contents: write

concurrency:
  group: arkst-rename-reconciliation
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/253-arkst-rename-reconciliation
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: rustfmt
      - name: Apply bounded reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          old_url = "https://github.com/luceat-lux-vestra/scribium"
          new_url = "https://github.com/luceat-lux-vestra/arkst"
          skip_dirs = {".git", "target"}

          for path in Path(".").rglob("*"):
              if not path.is_file() or any(part in skip_dirs for part in path.parts):
                  continue
              if path.as_posix() == ".github/workflows/253-reconcile.yml":
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              updated = text.replace(old_url, new_url)
              # Pre-v0.1 extension reconciliation. Upper-case test variants are
              # migrated as well; product-name history is intentionally untouched.
              updated = updated.replace(".SCRIB", ".ARKST").replace(".scrib", ".arkst")
              if path.suffix == ".rs":
                  updated = updated.replace('"scrib"', '"arkst"')
                  updated = updated.replace("qd, scrib, md", "qd, arkst, md")
              if updated != text:
                  path.write_text(updated, encoding="utf-8")

          # ADR-0004 must preserve why .scrib existed while making the current
          # accepted contract unambiguous.
          adr = Path("docs/adr/0004-source-syntax-and-file-extensions.md")
          text = adr.read_text(encoding="utf-8")
          text = text.replace(
              "### Option 1: Single `.arkst` extension\n\nClean but breaks expectations — users already have `.md` and `.qd` files.",
              "### Option 1: Single `.arkst` extension\n\nClean but breaks expectations — users already have `.md` and `.qd` files.\n\n> Historical note: before the Arkst rename, the working-name-specific `.scrib`\n> alias occupied this role. It was removed before the first public release and\n> is not part of the Arkst compatibility contract.",
          )
          text = text.replace(
              "- `.arkst` — alias for `.qd`",
              "- `.arkst` — Arkst-native alias for `.qd`",
          )
          adr.write_text(text, encoding="utf-8")

          # README's distribution status must match #233 without implying that a
          # release already exists.
          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          old = (
              "Arkst has no current public package or release distribution contract. The\n"
              "workspace package, CLI, binary-release, WASM, and internal-tool decisions are\n"
              "recorded and enforced in [`docs/engineering/DISTRIBUTION_POLICY.md`](docs/engineering/DISTRIBUTION_POLICY.md)."
          )
          new = (
              "Arkst's canonical distribution contract approves the `arkst` CLI binary for\n"
              "GitHub Releases, although no public Arkst release has shipped yet. crates.io /\n"
              "public `cargo install` and distributed WASM remain disabled. The workspace\n"
              "package, CLI, binary-release, WASM, and internal-tool decisions are recorded and\n"
              "enforced in [`docs/engineering/DISTRIBUTION_POLICY.md`](docs/engineering/DISTRIBUTION_POLICY.md)."
          )
          assert old in text
          readme.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Add an explicit compatibility test: the working-name extension must
          # fail rather than remain a silent alias.
          commands = Path("crates/arkst-cli/src/commands.rs")
          text = commands.read_text(encoding="utf-8")
          marker = "    #[test]\n    fn all_supported_extensions_are_accepted() {"
          assert marker in text
          test = '''    #[test]\n    fn legacy_scrib_extension_is_rejected() {\n        let dir = tempdir().unwrap();\n        let input = dir.path().join("document.scrib");\n        fs::write(&input, "# Hello\\n").unwrap();\n        let error = check(input.to_str().unwrap()).unwrap_err().to_string();\n        assert!(\n            error.contains("unsupported input extension '.scrib'"),\n            "error was: {}",\n            error\n        );\n        assert!(error.contains("qd, arkst, md"), "error was: {}", error);\n    }\n\n'''
          text = text.replace(marker, test + marker, 1)
          commands.write_text(text, encoding="utf-8")
          PY
      - name: Validate reconciliation
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test -p arkst-cli --locked
          cargo test -p arkst-core --locked
          python3 tools/ci/test_verify_distribution_policy.py
          python3 tools/ci/verify_distribution_policy.py
          python3 tools/ci/test_verify_workflow_security.py
          python3 tools/ci/verify_workflow_security.py
          if git grep -nF 'https://github.com/luceat-lux-vestra/scribium' -- ':!docs/legal/TRADEMARKS.md'; then
            echo 'stale repository URL remains' >&2
            exit 1
          fi
          # Any remaining .scrib must be an explicitly historical statement.
          git grep -nE '\.scrib|\.SCRIB' -- ':!.github/workflows/253-reconcile.yml' || true
          git diff --check
      - name: Commit reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "luceat-lux-vestra"
          git config user.email "heathkimdev@gmail.com"
          git add -A ':!.github/workflows/253-reconcile.yml'
          test -n "$(git diff --cached --name-only)"
          git commit -m "fix: finish Arkst rename reconciliation"
          git push origin HEAD:fix/253-arkst-rename-reconciliation
