name: Temporary issue 196 provenance fixture fix

on:
  push:
    branches: [compat/196-localization-semantics]

permissions:
  contents: write

concurrency:
  group: issue-196-provenance-fixture-fix
  cancel-in-progress: false

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: compat/196-localization-semantics
          fetch-depth: 0
          persist-credentials: true

      - name: Patch and verify provenance fixture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/ci/test_reference_provenance.py')
          text = path.read_text(encoding='utf-8')

          anchor = '        "tools/generate_jdk25_unicode_case.py",\n'
          replacement = anchor + '        "tools/generate_word_break_jdk25.py",\n'
          if text.count(anchor) != 1:
              raise SystemExit('unicode generator FILES anchor mismatch')
          text = text.replace(anchor, replacement, 1)

          anchor = '        "tools/dump_jdk25_unicode_data.java",\n'
          replacement = anchor + '        "tools/dump_word_break_jdk25.java",\n'
          if text.count(anchor) != 1:
              raise SystemExit('unicode helper FILES anchor mismatch')
          text = text.replace(anchor, replacement, 1)

          anchor = '        "crates/arkst-engine/src/unicode_case.rs",\n'
          replacement = anchor + '        "crates/arkst-engine/src/word_break.rs",\n'
          if text.count(anchor) != 1:
              raise SystemExit('unicode artifact FILES anchor mismatch')
          text = text.replace(anchor, replacement, 1)

          old = 'unicode_generator_source_sha256 = "7c872bc872c4db6141b2d40e5ded0e75dcd06b129ef7cf278f37ed4f42daaa08"'
          new = 'unicode_generator_source_sha256 = "2d33f70ca87801e9083fdce58d57d6bfa3fc54d0c8f671cc30ade28c6b702b8a"'
          if text.count(old) != 1:
              raise SystemExit('generator identity test anchor mismatch')
          text = text.replace(old, new, 1)

          old = 'helper_source_sha256 = "2b6459d6dfee9e2780c50e1734ac8302900bd9d601acae401b0af064c0ba568f"'
          new = 'helper_source_sha256 = "31534a3c5c8c63910479b16ae3eed994e71e14bae7105e84d9703b9f7e6bfea6"'
          if text.count(old) != 1:
              raise SystemExit('helper identity test anchor mismatch')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
          python3 tools/ci/test_reference_provenance.py
          python3 tools/verify_reference_provenance.py
          cargo fmt --all -- --check
          git diff --check

      - name: Commit final fixture repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/issue-196-provenance-fixture-fix.yml
          git add tools/ci/test_reference_provenance.py
          git diff --cached --check
          git commit -m 'test(ci): align provenance fixture with word-break oracle'
          git push origin HEAD:compat/196-localization-semantics
