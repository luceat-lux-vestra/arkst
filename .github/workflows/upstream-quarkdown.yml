name: Quarkdown Upstream Watch

on:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:
    inputs:
      observed_tag:
        description: 'Override observed tag for dry-run (e.g., v9.9.9)'
        required: false
        type: string
      dry_run:
        description: 'If true, print issue payload without creating issue'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  watch:
    name: Check Quarkdown upstream drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build upstream watcher
        run: cargo build -p scribium-upstream-watch --locked

      - name: Get latest stable release from GitHub
        if: github.event.inputs.observed_tag == ''
        id: get_release
        run: |
          RELEASE=$(gh api repos/iamgio/quarkdown/releases/latest --jq '.tag_name')
          URL=$(gh api repos/iamgio/quarkdown/releases/latest --jq '.html_url')
          echo "tag=$RELEASE" >> $GITHUB_OUTPUT
          echo "url=$URL" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Use manual override for dry-run
        if: github.event.inputs.observed_tag != ''
        id: manual_override
        env:
          OBSERVED_TAG: ${{ github.event.inputs.observed_tag }}
        run: |
          echo "tag=$OBSERVED_TAG" >> $GITHUB_OUTPUT
          echo "url=https://github.com/iamgio/quarkdown/releases/tag/$OBSERVED_TAG" >> $GITHUB_OUTPUT

      - name: Determine observed release
        id: observed
        env:
          GET_RELEASE_TAG: ${{ steps.get_release.outputs.tag }}
          GET_RELEASE_URL: ${{ steps.get_release.outputs.url }}
          MANUAL_TAG: ${{ steps.manual_override.outputs.tag }}
          MANUAL_URL: ${{ steps.manual_override.outputs.url }}
        run: |
          if [ -n "$GET_RELEASE_TAG" ]; then
            echo "tag=$GET_RELEASE_TAG" >> $GITHUB_OUTPUT
            echo "url=$GET_RELEASE_URL" >> $GITHUB_OUTPUT
          else
            echo "tag=$MANUAL_TAG" >> $GITHUB_OUTPUT
            echo "url=$MANUAL_URL" >> $GITHUB_OUTPUT
          fi
