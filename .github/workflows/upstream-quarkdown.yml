name: Quarkdown Upstream Watch

on:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:
    inputs:
      observed_tag:
        description: 'Override observed tag for dry-run (e.g., v9.9.9)'
        required: false
        type: string
      dry_run:
        description: 'If true, print issue payload without creating issue'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  watch:
    name: Check Quarkdown upstream drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build upstream watcher
        run: cargo build -p scribium-upstream-watch --locked

      - name: Test workflow runs
        run: echo "Workflow parsed successfully"
