name: Disposable #311 v2.6.0 doclang JDK17 oracle

on:
  push:
    branches:
      - proof/311-v260-doclang-jdk17-oracle

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up pinned JDK 17 candidate
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17.0.20.1+1'
      - name: Compare JDK17 public locale API with exact Quarkdown v2.6.0
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo 'JAVA_VERSION_BEGIN'; java -version 2>&1; echo 'JAVA_VERSION_END'
          java -version 2>&1 | grep -F 'Temurin-17.0.20.1+1'

          release="$RUNNER_TEMP/release.json"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" https://api.github.com/repos/iamgio/quarkdown/releases/tags/v2.6.0 > "$release"
          test "$(jq -r '.tag_name' "$release")" = 'v2.6.0'
          asset='quarkdown-linux-x64.zip'
          url="$(jq -r --arg n "$asset" '.assets[] | select(.name==$n) | .browser_download_url' "$release")"
          digest="$(jq -r --arg n "$asset" '.assets[] | select(.name==$n) | .digest' "$release")"
          test "$digest" = 'sha256:5b015e47c820d06ff6774eb700e60d77bc575819d4a0140cc7f1a115e7ce6dc4'
          zip="$RUNNER_TEMP/$asset"; curl -fsSL "$url" -o "$zip"
          printf '%s  %s\n' "${digest#sha256:}" "$zip" | sha256sum -c --strict
          root="$RUNNER_TEMP/q"; mkdir -p "$root"; unzip -q "$zip" -d "$root"
          q="$(find "$root" -type f -path '*/bin/quarkdown' -print -quit)"; test -n "$q"; chmod +x "$q"
          "$q" --version | grep -F '2.6.0'

          cat > "$RUNNER_TEMP/Locale17.java" <<'JAVA'
          import java.util.*;
          public final class Locale17 {
            static String simple(Locale l) {
              String language=l.getDisplayLanguage(Locale.ENGLISH);
              String country=l.getDisplayCountry(Locale.ENGLISH);
              return country.isEmpty()?language:language+" ("+country+")";
            }
            public static void main(String[] args) {
              Locale[] a=Locale.getAvailableLocales();
              LinkedHashSet<String> seen=new LinkedHashSet<>();
              System.err.printf(Locale.ROOT,"raw_available=%d%n",a.length);
              for(int i=0;i<a.length;i++) {
                Locale l=a[i]; String tag=l.toLanguageTag();
                if(!seen.add(tag)) continue;
                System.out.printf(Locale.ROOT,"%d\t%s\t%s\t%s%n",i,tag,l.getDisplayName(Locale.ENGLISH),simple(l));
              }
              System.err.printf(Locale.ROOT,"unique_available_tags=%d%n",seen.size());
            }
          }
          JAVA
          javac --release 17 -d "$RUNNER_TEMP/classes" "$RUNNER_TEMP/Locale17.java"
          java -cp "$RUNNER_TEMP/classes" Locale17 > "$RUNNER_TEMP/j17.tsv" 2> "$RUNNER_TEMP/j17.stats"
          cat "$RUNNER_TEMP/j17.stats"; sha256sum "$RUNNER_TEMP/j17.tsv"

          cat > "$RUNNER_TEMP/Predict17.java" <<'JAVA'
          import java.nio.charset.StandardCharsets; import java.nio.file.*; import java.util.*;
          public final class Predict17 {
            static String simple(Locale l) {
              String language=l.getDisplayLanguage(Locale.ENGLISH), country=l.getDisplayCountry(Locale.ENGLISH);
              return country.isEmpty()?language:language+" ("+country+")";
            }
            public static void main(String[] args) throws Exception {
              Set<Locale> available=new HashSet<>(Arrays.asList(Locale.getAvailableLocales()));
              for(String tag:Files.readAllLines(Path.of(args[0]),StandardCharsets.UTF_8)) {
                if(tag.isEmpty()) continue; Locale l=Locale.forLanguageTag(tag);
                System.out.printf(Locale.ROOT,"%s\t%s\t%s\t%s%n",tag,available.contains(l)?"1":"0",l.getDisplayName(Locale.ENGLISH),simple(l));
              }
            }
          }
          JAVA
          javac --release 17 -d "$RUNNER_TEMP/classes" "$RUNNER_TEMP/Predict17.java"

          python3 - "$RUNNER_TEMP/j17.tsv" tools/jdk25_available_locale_order.tsv "$RUNNER_TEMP/candidates.txt" <<'PY'
          import csv,sys
          from pathlib import Path
          j17,old,out=map(Path,sys.argv[1:]); tags=set()
          for line in j17.read_text(encoding='utf-8').splitlines():
              _i,tag,_f,_s=line.split('\t',3)
              if tag: tags.add(tag)
          with old.open(encoding='utf-8',newline='') as f:
              for row in csv.reader(f,delimiter='\t'):
                  if row and row[0]: tags.add(row[0])
          ordered=sorted(tags); out.write_text('\n'.join(ordered)+'\n',encoding='utf-8')
          print(f'union_candidate_tags={len(ordered)}')
          PY
          java -cp "$RUNNER_TEMP/classes" Predict17 "$RUNNER_TEMP/candidates.txt" > "$RUNNER_TEMP/predicted.tsv"

          cases="$RUNNER_TEMP/cases"; mkdir -p "$cases"
          python3 - "$cases" "$RUNNER_TEMP/predicted.tsv" <<'PY'
          import sys
          from pathlib import Path
          root=Path(sys.argv[1]); rows=[]
          for line in Path(sys.argv[2]).read_text(encoding='utf-8').splitlines(): rows.append(line.split('\t',3))
          size=80
          for start in range(0,len(rows),size):
              p=root/f'{start//size:03d}'; p.mkdir()
              with (p/'main.qd').open('w',encoding='utf-8') as out:
                  out.write('.doctype {plain}\n')
                  for i,(tag,_ok,_full,_simple) in enumerate(rows[start:start+size],start=start):
                      key=f'Q{i:04d}'
                      out.write(f'{key}-BEGIN\n.doclang {{English}}\n.doclang {{{tag}}}\n{key}-VALUE .doclang {key}-END\n')
          print(f'probe_rows={len(rows)} chunk_count={(len(rows)+size-1)//size}')
          PY

          : > "$RUNNER_TEMP/all.stderr"
          for project in "$cases"/*; do
            chunk="$(basename "$project")"; set +e
            (cd "$project" && "$q" c main.qd --clean) > "$RUNNER_TEMP/$chunk.stdout" 2> "$RUNNER_TEMP/$chunk.stderr"; status=$?; set -e
            printf 'chunk_%s_exit=%s\n' "$chunk" "$status"; test -d "$project/quarkdown-output"
            sed "s/^/[chunk $chunk] /" "$RUNNER_TEMP/$chunk.stderr" >> "$RUNNER_TEMP/all.stderr"
          done

          python3 - "$cases" "$RUNNER_TEMP/predicted.tsv" "$RUNNER_TEMP/all.stderr" "$RUNNER_TEMP/j17.tsv" <<'PY'
          from collections import defaultdict
          from html.parser import HTMLParser
          from pathlib import Path
          import re,sys
          cases,pred_path,stderr_path,j17_path=map(Path,sys.argv[1:]); rows=[]
          for line in pred_path.read_text(encoding='utf-8').splitlines():
              tag,ok,full,simple=line.split('\t',3); rows.append((tag,ok=='1',full,simple))
          class T(HTMLParser):
              def __init__(self): super().__init__(); self.parts=[]
              def handle_data(self,d): self.parts.append(d)
          text={}
          for p in sorted(cases.iterdir()):
              parts=[]
              for html in (p/'quarkdown-output').rglob('*.html'):
                  t=T(); t.feed(html.read_text(encoding='utf-8')); parts+=t.parts
              text[int(p.name)]=' '.join(' '.join(parts).split())
          stderr=stderr_path.read_text(encoding='utf-8',errors='replace')
          acceptance=[]; full_names=[]; simple_names=[]; missing=[]; accepted=0
          for i,(tag,pred_ok,pred_full,pred_simple) in enumerate(rows):
              key=f'Q{i:04d}'; m=re.search(rf'{key}-VALUE\s*(.*?)\s*{key}-END',text[i//80])
              if not m: missing.append(tag); continue
              ok=not bool(re.search(rf'Locale\s+{re.escape(tag)}\s+not found',stderr,re.I)); accepted+=int(ok)
              if ok!=pred_ok: acceptance.append((tag,pred_ok,ok,m.group(1)))
              if ok and m.group(1)!=pred_full: full_names.append((tag,pred_full,m.group(1)))
              if ok and m.group(1)!=pred_simple: simple_names.append((tag,pred_simple,m.group(1)))
          collisions=defaultdict(list)
          for line in j17_path.read_text(encoding='utf-8').splitlines():
              idx,tag,_full,simple=line.split('\t',3); collisions[simple.casefold()].append((int(idx),tag,simple))
          groups=[v for v in collisions.values() if len({x[1] for x in v})>1]
          print(f'blackbox_accepted={accepted}')
          print(f'jdk17_acceptance_mismatches={len(acceptance)}')
          print(f'jdk17_full_name_mismatches={len(full_names)}')
          print(f'jdk17_simple_name_mismatches={len(simple_names)}')
          print(f'missing_markers={len(missing)}')
          print(f'jdk17_simple_name_collision_classes={len(groups)}')
          print('ACCEPTANCE_MISMATCHES_BEGIN'); [print('\t'.join(map(str,r))) for r in acceptance]; print('ACCEPTANCE_MISMATCHES_END')
          print('SIMPLE_NAME_MISMATCHES_BEGIN'); [print('\t'.join(r)) for r in simple_names]; print('SIMPLE_NAME_MISMATCHES_END')
          print('SIMPLE_NAME_COLLISIONS_BEGIN')
          for g in sorted(groups,key=lambda x:(x[0][2].casefold(),x[0][0])): print(' | '.join(f'{i}:{t}:{n}' for i,t,n in g))
          print('SIMPLE_NAME_COLLISIONS_END')
          if missing: raise SystemExit(f'missing markers: {missing[:20]}')
          if acceptance: raise SystemExit('JDK17 acceptance model mismatch')
          if simple_names: raise SystemExit('JDK17 simple English-name model mismatch')
          PY
