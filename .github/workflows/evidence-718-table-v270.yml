name: Evidence 718 table v2.7.0

on:
  push:
    branches:
      - evidence/718-table-v270

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download and verify official Quarkdown v2.7.0
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/quarkdown-linux-x64-v2.7.0.zip"
          url="https://github.com/iamgio/quarkdown/releases/download/v2.7.0/quarkdown-linux-x64.zip"
          sha="5ff4e78e391abd073e62030da816faef265d681d3b8ccfd05768cc9c586f7e85"
          curl --fail --location --retry 3 --output "$archive" "$url"
          printf '%s  %s\n' "$sha" "$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/quarkdown-v270"
          unzip -q "$archive" -d "$RUNNER_TEMP/quarkdown-v270"
          qd="$(find "$RUNNER_TEMP/quarkdown-v270" -type f -path '*/bin/quarkdown' -print -quit)"
          test -n "$qd"
          chmod +x "$qd"
          echo "QD=$qd" >> "$GITHUB_ENV"
          "$qd" --version || true

      - name: Run independent callable table probes
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/table-probes"
          mkdir -p "$root"
          mkprobe() { mkdir -p "$root/$1"; }

          mkprobe documented_repeat
          cat > "$root/documented_repeat/input.qd" <<'QD'
          .table
              .repeat {3}
                  n:
                  | Column .n |
                  |-----------|
                  | Cell .n:1 |
                  | Cell .n:2 |
                  | Cell .n:3 |
          QD

          mkprobe explicit_body
          cat > "$root/explicit_body/input.qd" <<'QD'
          .table {
              .repeat {2}
                  n:
                  | H.n |
                  |-----|
                  | A.n |
                  | B.n |
          }
          QD

          mkprobe named_subtables
          cat > "$root/named_subtables/input.qd" <<'QD'
          .table subTables:{
              .repeat {2}
                  n:
                  | N.n |
                  |-----|
                  | V.n |
          }
          QD

          mkprobe variable_collection
          cat > "$root/variable_collection/input.qd" <<'QD'
          .var {parts}
              .repeat {2}
                  n:
                  | P.n |
                  |-----|
                  | X.n |
                  | Y.n |
          .table {.parts}
          QD

          mkprobe rich_cells
          cat > "$root/rich_cells/input.qd" <<'QD'
          .table
              .repeat {2}
                  n:
                  | **H.n** |
                  |---------|
                  | *E.n*   |
                  | `C.n`   |
          QD

          mkprobe uneven_rows
          cat > "$root/uneven_rows/input.qd" <<'QD'
          .var {parts}
              - |
                | A |
                |---|
                | 1 |
                | 2 |
              - |
                | B |
                |---|
                | x |
          .table {.parts}
          QD

          mkprobe multi_column_subtable
          cat > "$root/multi_column_subtable/input.qd" <<'QD'
          .var {parts}
              - |
                | A | B |
                |---|---|
                | 1 | 2 |
              - |
                | C |
                |---|
                | 3 |
          .table {.parts}
          QD

          mkprobe empty_collection
          cat > "$root/empty_collection/input.qd" <<'QD'
          .table {.emptycollection}
          QD

          mkprobe scalar_rejected
          cat > "$root/scalar_rejected/input.qd" <<'QD'
          .table {not-iterable}
          QD

          mkprobe source_defined
          cat > "$root/source_defined/input.qd" <<'QD'
          .function {table}
              subTables:
              custom-.subTables::size
          .table {.emptycollection}
          QD

          mkprobe column_extract
          cat > "$root/column_extract/input.qd" <<'QD'
          .tablecolumn {2} of:{
              .table
                  .repeat {2}
                      n:
                      | H.n |
                      |-----|
                      | A.n |
                      | B.n |
          }::join { / }
          QD

          inspect_html() {
            python3 - "$1" <<'PY'
          import re
          import sys
          from html.parser import HTMLParser

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.depth = 0
                  self.cell = None
                  self.cells = []
                  self.top_tables = 0
                  self.text = []
              def handle_starttag(self, tag, attrs):
                  if tag == "table":
                      self.depth += 1
                      if self.depth == 1:
                          self.top_tables += 1
                  if self.depth >= 1 and tag in ("td","th"):
                      self.cell = {"kind": tag, "parts": []}
                  elif self.cell is not None and tag in ("strong","em","code","a","br"):
                      suffix = ""
                      if tag == "a":
                          suffix = " href=" + repr(dict(attrs).get("href"))
                      self.cell["parts"].append(f"<{tag}{suffix}>")
              def handle_endtag(self, tag):
                  if self.cell is not None and tag in ("td","th"):
                      self.cells.append(self.cell)
                      self.cell = None
                  elif self.cell is not None and tag in ("strong","em","code","a"):
                      self.cell["parts"].append(f"</{tag}>")
                  if tag == "table":
                      self.depth -= 1
              def handle_data(self, data):
                  value = re.sub(r"\s+", " ", data)
                  if self.cell is not None and value:
                      self.cell["parts"].append(value)
                  if value.strip():
                      self.text.append(value.strip())

          raw=open(sys.argv[1],encoding="utf-8").read()
          p=P(); p.feed(raw)
          print("TOP_TABLES=", p.top_tables)
          for i,c in enumerate(p.cells):
              print(f"CELL[{i}] {c['kind']}=" + "".join(c["parts"]).strip())
          print("TEXT=", " | ".join(p.text))
          PY
          }

          run_probe() {
            local name="$1"
            local dir="$root/$name"
            echo "::group::PROBE $name"
            set +e
            (cd "$dir" && "$QD" --log-level error c input.qd --pipe -r html --strict) >"$dir/stdout.log" 2>"$dir/stderr.log"
            rc=$?
            set -e
            echo "RESULT name=$name rc=$rc"
            if [ -s "$dir/stderr.log" ]; then
              echo "STDERR:"
              sed -n '1,100p' "$dir/stderr.log"
            fi
            if [ "$rc" -eq 0 ]; then
              inspect_html "$dir/stdout.log"
            elif [ -s "$dir/stdout.log" ]; then
              echo "STDOUT:"
              sed -n '1,100p' "$dir/stdout.log"
            fi
            echo "::endgroup::"
          }

          for name in documented_repeat explicit_body named_subtables variable_collection rich_cells uneven_rows multi_column_subtable empty_collection scalar_rejected source_defined column_extract
          do
            run_probe "$name"
          done
