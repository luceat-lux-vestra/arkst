name: Quarkdown v2.6 library inspection black-box probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: v260-library-inspection-probe-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Fetch exact official v2.6.0 distribution
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/iamgio/quarkdown/releases/download/v2.6.0/quarkdown-linux-x64.zip'
          expected='5b015e47c820d06ff6774eb700e60d77bc575819d4a0140cc7f1a115e7ce6dc4'
          curl -fL --retry 3 --retry-all-errors --connect-timeout 20 -o /tmp/quarkdown-v2.6.0.zip "$url"
          printf '%s  %s\n' "$expected" /tmp/quarkdown-v2.6.0.zip | sha256sum -c -
          mkdir -p /tmp/quarkdown-v2.6.0
          unzip -q /tmp/quarkdown-v2.6.0.zip -d /tmp/quarkdown-v2.6.0
          qd="$(find /tmp/quarkdown-v2.6.0 -type f -name quarkdown -perm -111 -print -quit)"
          test -n "$qd"
          printf 'QD=%s\n' "$qd" >> "$GITHUB_ENV"
          "$qd" --version

      - name: Probe stdlib enumeration repeatability
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/library-order-probe
          mkdir -p "$root"
          cat > "$root/stdlib.qd" <<'QD'
          QD-ORDER-BEGIN
          .foreach {.libfunctions {stdlib}}
              QD-ORDER-ITEM:[.1]
          QD-ORDER-END
          QD

          for i in 1 2 3 4 5; do
            out="$root/out-$i"
            "$QD" compile "$root/stdlib.qd" --strict --clean --pretty --out "$out" --out-name probe >/dev/null 2>"$root/$i.stderr"
            html="$(find "$out" -type f -name '*.html' -print -quit)"
            python3 - "$html" "$root/$i.txt" "$i" <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import hashlib
          import re
          import sys

          class Text(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts = []
                  self.skip = 0
              def handle_starttag(self, tag, attrs):
                  if tag in ('script', 'style'):
                      self.skip += 1
              def handle_endtag(self, tag):
                  if tag in ('script', 'style') and self.skip:
                      self.skip -= 1
              def handle_data(self, data):
                  if not self.skip:
                      self.parts.append(data)

          parser = Text()
          parser.feed(Path(sys.argv[1]).read_text())
          visible = '\n'.join(parser.parts)
          names = re.findall(r'QD-ORDER-ITEM:\s*\[([^\]]+)\]', visible)
          if not names:
              raise SystemExit('no function names extracted from visible HTML text')
          payload = '\n'.join(names) + '\n'
          Path(sys.argv[2]).write_text(payload)
          digest = hashlib.sha256(payload.encode()).hexdigest()
          print(f'QD-ORDER-RUN-{sys.argv[3]} count={len(names)} sha256={digest} first={names[:8]} last={names[-8:]}')
          PY
          done

          cmp "$root/1.txt" "$root/2.txt"
          cmp "$root/1.txt" "$root/3.txt"
          cmp "$root/1.txt" "$root/4.txt"
          cmp "$root/1.txt" "$root/5.txt"

      - name: Probe loaded library and pseudo-library ordering
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/library-registry-order
          libs="$root/libs"
          mkdir -p "$libs"
          cat > "$libs/alpha.qd" <<'QD'
          .function {alpha_first}
              alpha-first
          .function {alpha_second}
              alpha-second
          QD
          cat > "$libs/beta.qd" <<'QD'
          .function {beta_only}
              beta-only
          QD

          cat > "$root/beta-alpha.qd" <<'QD'
          .function {local_first}
              local-first
          .function {local_second}
              local-second
          .include {beta}
          .include {alpha}
          QD-LIB-BEGIN
          .foreach {.libraries}
              QD-LIB-ITEM:[.1]
          QD-LIB-END
          QD

          cat > "$root/alpha-beta.qd" <<'QD'
          .function {local_first}
              local-first
          .function {local_second}
              local-second
          .include {alpha}
          .include {beta}
          QD-LIB-BEGIN
          .foreach {.libraries}
              QD-LIB-ITEM:[.1]
          QD-LIB-END
          QD

          for fixture in beta-alpha alpha-beta; do
            out="$root/out-$fixture"
            "$QD" compile "$root/$fixture.qd" --strict --clean --pretty --libs "$libs" --out "$out" --out-name probe >/dev/null 2>"$root/$fixture.stderr"
            html="$(find "$out" -type f -name '*.html' -print -quit)"
            python3 - "$html" "$fixture" <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re
          import sys

          class Text(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts = []
                  self.skip = 0
              def handle_starttag(self, tag, attrs):
                  if tag in ('script', 'style'):
                      self.skip += 1
              def handle_endtag(self, tag):
                  if tag in ('script', 'style') and self.skip:
                      self.skip -= 1
              def handle_data(self, data):
                  if not self.skip:
                      self.parts.append(data)

          parser = Text()
          parser.feed(Path(sys.argv[1]).read_text())
          visible = '\n'.join(parser.parts)
          names = re.findall(r'QD-LIB-ITEM:\s*\[([^\]]+)\]', visible)
          if not names:
              raise SystemExit('no library names extracted from visible HTML text')
          print(f'QD-LIB-ORDER-{sys.argv[2]} count={len(names)} names={names!r}')
          PY
          done