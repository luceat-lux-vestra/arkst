name: Dependency review

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          license-check: true
          allow-licenses: Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, MIT, Unicode-3.0, Zlib, CC0-1.0
          allow-dependencies-licenses: pkg:cargo/az@1.3.0,pkg:cargo/guillotiere@0.7.0,pkg:cargo/unicode-properties@0.1.4,pkg:cargo/wasmi@1.1.0,pkg:cargo/wasmi_collections@1.1.0,pkg:cargo/wasmi_core@1.1.0,pkg:cargo/wasmi_ir@1.1.0,pkg:cargo/ar_archive_writer@0.5.3
          # cargo-deny remains the authoritative full-graph license check

  issue195-finalize:
    name: issue195-finalize
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/195-library-inspection'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot
        with:
          toolchain: 1.98.0
          components: rustfmt
      - name: Apply final cleanup
        run: python3 tools/dev/issue195_fix.py
      - name: Format and run targeted regression suite
        run: |
          cargo fmt --all
          cargo test --locked -p arkst-engine --test library_inspection
          cargo test --locked -p arkst-engine --test library_inspection_adversarial
          cargo test --locked -p arkst-engine library_inspection --lib
          cargo test --locked -p arkst-engine --test loadable_library_dispatch
      - name: Commit candidate changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No candidate changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            crates/arkst-engine/src/evaluator.rs \
            crates/arkst-engine/src/library_inspection.rs \
            crates/arkst-engine/tests/library_inspection.rs \
            crates/arkst-engine/tests/library_inspection_adversarial.rs \
            docs/compatibility/quarkdown/README.md
          git diff --cached --check
          git commit -m 'compat(stdlib): finalize library inspection contract'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}