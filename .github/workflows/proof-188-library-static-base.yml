name: Proof library static resource base

on:
  push:
    branches: [proof/188-library-static-base]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUSTUP_TOOLCHAIN: 1.98.0

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: rustfmt,clippy
      - name: Apply bounded fix
        run: python3 tools/proof_188_library_static_base.py
      - name: Format and diff sanity
        run: |
          cargo fmt --all
          git diff --check
          git status --short
      - name: Run bounded proof suite
        run: |
          cargo test --locked -p arkst-project --test loadable_library_registry
          cargo test --locked -p arkst-engine --test loadable_library_dispatch
          cargo test --locked -p arkst-engine --test markdown_subdocument_links
          cargo test --locked -p arkst-engine --test resource_contract
          cargo test --locked -p arkst-core --test loadable_library_compile
          cargo test --locked -p arkst-core --test engine_facade
          cargo test --locked -p arkst-core --test filesystem_project_data_resources_audit
          cargo test --locked -p arkst-core --test quarkdown_v251_reconciliation
          cargo clippy --locked -p arkst-project -p arkst-engine -p arkst-core --all-targets --all-features -- -D warnings
      - name: Commit exact proven product tree
        run: |
          git rm .github/workflows/proof-188-library-static-base.yml tools/proof_188_library_static_base.py
          test -z "$(git diff --name-only -- Cargo.lock)"
          expected="crates/arkst-core/tests/loadable_library_compile.rs
          crates/arkst-engine/src/evaluator.rs
          crates/arkst-engine/tests/loadable_library_dispatch.rs
          docs/compatibility/quarkdown/FILESYSTEM_PROJECT_DATA_RESOURCES_AUDIT.md
          docs/compatibility/quarkdown/FILESYSTEM_PROJECT_DATA_RESOURCES_AUDIT_MANIFEST.tsv"
          actual="$(git diff --name-only 94a21e0a8d207043ad4c400a3c213446fea60d3e | sort)"
          test "$actual" = "$(printf '%s\n' "$expected" | sort)"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          proven_tree="$(git write-tree)"
          echo "PROVEN_TREE=${proven_tree}"
          git commit -m "proof: validate library static resource base"
          test "$(git rev-parse 'HEAD^{tree}')" = "$proven_tree"
          git push origin HEAD:proof/188-library-static-base
