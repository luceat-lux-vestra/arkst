name: tmp-189-directory-identity-reconcile
on:
  push:
    branches: [compat/189-empty-directory-identity-proof]
permissions:
  contents: write
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: compat/189-empty-directory-identity-proof
          fetch-depth: 0
      - name: Apply reconciliation
        run: python3 tools/tmp_reconcile_189_directory_identity.py
      - name: Prove canonical contract
        run: |
          cargo fmt --all
          cargo fmt --all --check
          cargo test --locked -p arkst-core --test filesystem_project_data_resources_audit
          cargo test --locked -p arkst-core --test quarkdown_v251_reconciliation
          cargo test --locked -p arkst-core --test quarkdown_resource_builtins
          cargo test --locked -p arkst-project --test logical_directory_listing_189
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          git diff --check
      - name: Verify and collapse
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "6307c09f466e1543b5ad96e04950eb67482c7a62"
          git checkout origin/main -- Cargo.lock
          git diff --exit-code origin/main -- Cargo.lock
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('docs/compatibility/quarkdown/FILESYSTEM_PROJECT_DATA_RESOURCES_AUDIT_MANIFEST.tsv').read_text()
          rows = {r[1]: r for r in (line.split('\t') for line in manifest.splitlines() if line and not line.startswith('#'))}
          listfiles = rows['builtin:.listfiles']
          filename = rows['builtin:.filename']
          assert len(listfiles) == 24 and len(filename) == 24
          assert listfiles[17] == 'PARTIAL' and filename[17] == 'PARTIAL'
          assert 'empty-directory' in listfiles[18] and 'empty-directory' not in listfiles[19]
          assert all('non-empty' not in listfiles[i] for i in (8, 14, 18))
          assert 'not representable' not in listfiles[9]
          assert all(token in listfiles[21] for token in ('#189', '#191', 'POLICY_DIVERGENCE:global-read'))
          assert 'directory' in filename[13] and 'logical-directory' in filename[18]
          assert filename[21] == 'POLICY_DIVERGENCE:global-read;#191'
          research = Path('docs/research/quarkdown-project-data-189.md').read_text()
          audit = Path('docs/compatibility/quarkdown/FILESYSTEM_PROJECT_DATA_RESOURCES_AUDIT.md').read_text()
          assert 'source, asset, and logical-directory' in research
          assert 'source/asset/directory logical metadata' in audit
          assert 'empty directories are not representable' not in manifest.lower()
          PY
          git rm .github/workflows/tmp-189-directory-identity-reconcile.yml
          git rm tools/tmp_reconcile_189_directory_identity.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(compat): reconcile empty directory identity' -m 'Refs #189'
          git push origin HEAD:compat/189-empty-directory-identity-proof
