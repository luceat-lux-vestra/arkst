name: Rust CodeQL x64 vs arm64 570

on:
  push:
    branches:
      - exp/570-codeql-arm64
    paths:
      - .github/workflows/codeql-arm64-570.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arkst-570-codeql-arm64-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_SHA: 10dd9cdc638f8a7047eb4b08b9fd20b3edaa93e2

jobs:
  benchmark:
    name: codeql-${{ matrix.arch }}-rep${{ matrix.rep }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            rep: 1
          - arch: arm64
            runner: ubuntu-24.04-arm
            rep: 1
          - arch: x64
            runner: ubuntu-24.04
            rep: 2
          - arch: arm64
            runner: ubuntu-24.04-arm
            rep: 2
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25

    steps:
      - name: Check out research harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact harness scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          changed="$(git diff --name-only "$SOURCE_SHA..$GITHUB_SHA")"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l | tr -d ' ')" -eq 1
          test "$changed" = ".github/workflows/codeql-arm64-570.yml"
          git diff --check "$SOURCE_SHA..$GITHUB_SHA" -- .github/workflows/codeql-arm64-570.yml

      - name: Switch to protected exact source
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"

      - name: Capture runner resources
        shell: bash
        run: |
          set -euo pipefail
          echo "BENCH_ARCH=${{ matrix.arch }}"
          echo "BENCH_RUNNER=${{ matrix.runner }}"
          echo "BENCH_REP=${{ matrix.rep }}"
          echo "UNAME=$(uname -a)"
          echo "NPROC=$(nproc)"
          echo "ARCH=$(uname -m)"
          echo "MEMORY:"
          free -m
          echo "CPU:"
          lscpu

      - name: Mark benchmark start
        id: start
        shell: bash
        run: |
          set -euo pipefail
          echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "BENCH_START=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Initialize CodeQL Rust
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: rust
          build-mode: none

      - name: Analyze Rust without upload
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:rust/benchmark-${{ matrix.arch }}-rep${{ matrix.rep }}"
          upload: never

      - name: Mark benchmark end
        if: always()
        shell: bash
        env:
          START_EPOCH: ${{ steps.start.outputs.epoch }}
        run: |
          set -euo pipefail
          end="$(date +%s)"
          echo "BENCH_END=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [ -n "$START_EPOCH" ]; then
            echo "BENCH_ELAPSED_SECONDS=$((end - START_EPOCH))"
          fi
