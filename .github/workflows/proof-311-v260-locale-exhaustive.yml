name: Disposable #311 v2.6.0 locale exhaustive oracle

on:
  push:
    branches:
      - proof/311-v260-doclang-iterable-oracle

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Compare all pinned available-locale tags against exact v2.6.0
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release="$RUNNER_TEMP/release.json"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" https://api.github.com/repos/iamgio/quarkdown/releases/tags/v2.6.0 > "$release"
          asset="quarkdown-linux-x64.zip"
          url="$(jq -r --arg n "$asset" '.assets[] | select(.name==$n) | .browser_download_url' "$release")"
          digest="$(jq -r --arg n "$asset" '.assets[] | select(.name==$n) | .digest' "$release")"
          test "$digest" = "sha256:5b015e47c820d06ff6774eb700e60d77bc575819d4a0140cc7f1a115e7ce6dc4"
          zip="$RUNNER_TEMP/$asset"; curl -fsSL "$url" -o "$zip"
          printf '%s  %s\n' "${digest#sha256:}" "$zip" | sha256sum -c --strict
          root="$RUNNER_TEMP/q"; mkdir -p "$root"; unzip -q "$zip" -d "$root"
          q="$(find "$root" -type f -path '*/bin/quarkdown' -print -quit)"; chmod +x "$q"
          "$q" --version | grep -F '2.6.0'

          project="$RUNNER_TEMP/exhaustive"; mkdir -p "$project"
          python3 - "$project/main.qd" "$RUNNER_TEMP/expected.tsv" <<'PY'
          import csv, sys
          from pathlib import Path
          source = Path(sys.argv[1]); expected = Path(sys.argv[2])
          seen = set(); rows=[]
          with open('tools/jdk25_available_locale_order.tsv', encoding='utf-8', newline='') as f:
              for row in csv.reader(f, delimiter='\t'):
                  if not row or row[0] in seen: continue
                  seen.add(row[0]); rows.append((row[0], row[1]))
          with source.open('w', encoding='utf-8') as out, expected.open('w', encoding='utf-8') as exp:
              out.write('.doctype {plain}\n')
              for i,(tag,name) in enumerate(rows):
                  key=f'Q{i:04d}'
                  out.write(f'{key}-BEGIN\n.doclang {{{tag}}}\n{key}-VALUE .doclang {key}-END\n')
                  exp.write(f'{key}\t{tag}\t{name}\n')
          print(f'unique_input_tags={len(rows)}')
          PY

          set +e
          (cd "$project" && "$q" c main.qd --clean) >"$RUNNER_TEMP/stdout" 2>"$RUNNER_TEMP/stderr"
          status=$?
          set -e
          printf 'compile_exit=%s\n' "$status"
          test -d "$project/quarkdown-output"

          python3 - "$project/quarkdown-output" "$RUNNER_TEMP/expected.tsv" "$RUNNER_TEMP/stderr" <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re, sys
          root, expected_path, stderr_path = Path(sys.argv[1]), Path(sys.argv[2]), Path(sys.argv[3])
          class T(HTMLParser):
              def __init__(self): super().__init__(); self.parts=[]
              def handle_data(self,data): self.parts.append(data)
          parts=[]
          for p in root.rglob('*.html'):
              t=T(); t.feed(p.read_text(encoding='utf-8')); parts.extend(t.parts)
          flat=' '.join(' '.join(parts).split())
          stderr=stderr_path.read_text(encoding='utf-8', errors='replace')
          rows=[]
          for line in expected_path.read_text(encoding='utf-8').splitlines():
              key,tag,expected=line.split('\t',2); rows.append((key,tag,expected))
          invalid=[]; missing=[]; mismatch=[]; valid=0
          for key,tag,expected in rows:
              m=re.search(rf'{key}-VALUE\s*(.*?)\s*{key}-END', flat)
              if not m:
                  missing.append(tag); continue
              if re.search(rf'Locale\s+{re.escape(tag)}\s+not found', stderr, re.I):
                  invalid.append(tag); continue
              valid += 1
              observed=m.group(1)
              if observed != expected:
                  mismatch.append((tag,expected,observed))
          print(f'valid_tags={valid}')
          print(f'invalid_tags={len(invalid)}')
          print(f'missing_markers={len(missing)}')
          print(f'english_name_mismatches={len(mismatch)}')
          print('INVALID_TAGS_BEGIN')
          for tag in invalid: print(tag)
          print('INVALID_TAGS_END')
          print('NAME_MISMATCHES_BEGIN')
          for tag,expected,observed in mismatch: print(f'{tag}\t{expected}\t{observed}')
          print('NAME_MISMATCHES_END')
          if missing:
              raise SystemExit(f'missing output markers: {missing[:20]}')
          PY
