name: tmp-189-name-sort

on:
  push:
    branches:
      - compat/189-listfiles-name-sort

permissions:
  contents: write

jobs:
  patch-and-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: compat/189-listfiles-name-sort
          fetch-depth: 0

      - name: Apply fail-closed product patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          evaluator = Path('crates/arkst-engine/src/evaluator.rs')
          text = evaluator.read_text()

          old_enum = '''#[derive(Debug, Clone, Copy, PartialEq, Eq)]
          enum ListFilesOrder {
              Ascending,
              Descending,
          }
          '''.replace('          ', '')
          new_enum = '''#[derive(Debug, Clone, Copy, PartialEq, Eq)]
          enum ListFilesOrder {
              Ascending,
              Descending,
          }

          /// Compares the ASCII subset of Quarkdown's pinned
          /// `se.sawano.java.text.AlphanumericComparator` 2.0.0 input after
          /// Kotlin's filename `lowercase()` selector. The supported slice is
          /// deliberately ASCII-only so Unicode-version/case-mapping drift
          /// cannot be mistaken for exact JVM compatibility.
          fn compare_quarkdown_ascii_alphanumeric(left: &str, right: &str) -> Ordering {
              debug_assert!(left.is_ascii() && right.is_ascii());
              let left = left.as_bytes();
              let right = right.as_bytes();
              let mut left_index = 0;
              let mut right_index = 0;

              while left_index < left.len() && right_index < right.len() {
                  let left_numeric = left[left_index].is_ascii_digit();
                  let right_numeric = right[right_index].is_ascii_digit();
                  let left_end = alphanumeric_window_end(left, left_index, left_numeric);
                  let right_end = alphanumeric_window_end(right, right_index, right_numeric);

                  let ordering = if left_numeric && right_numeric {
                      let left_significant = numeric_significant_start(left, left_index, left_end);
                      let right_significant =
                          numeric_significant_start(right, right_index, right_end);
                      (left_end - left_significant)
                          .cmp(&(right_end - right_significant))
                          .then_with(|| {
                              left[left_significant..left_end]
                                  .cmp(&right[right_significant..right_end])
                          })
                  } else {
                      compare_ascii_case_folded_windows(
                          &left[left_index..left_end],
                          &right[right_index..right_end],
                      )
                  };
                  if ordering != Ordering::Equal {
                      return ordering;
                  }

                  left_index = left_end;
                  right_index = right_end;
              }

              // The pinned Java comparator breaks otherwise-equal window
              // sequences by the original CharSequence length. For ASCII,
              // byte length is exactly Java UTF-16 length.
              left.len().cmp(&right.len())
          }

          fn alphanumeric_window_end(bytes: &[u8], start: usize, numeric: bool) -> usize {
              let mut end = start;
              while end < bytes.len() && bytes[end].is_ascii_digit() == numeric {
                  end += 1;
              }
              end
          }

          fn numeric_significant_start(bytes: &[u8], start: usize, end: usize) -> usize {
              let mut significant = start;
              while significant + 1 < end && bytes[significant] == b'0' {
                  significant += 1;
              }
              significant
          }

          fn compare_ascii_case_folded_windows(left: &[u8], right: &[u8]) -> Ordering {
              for (left, right) in left.iter().zip(right) {
                  let ordering = left.to_ascii_lowercase().cmp(&right.to_ascii_lowercase());
                  if ordering != Ordering::Equal {
                      return ordering;
                  }
              }
              left.len().cmp(&right.len())
          }
          '''.replace('          ', '')
          if text.count(old_enum) != 1:
              raise SystemExit(f'expected one ListFilesOrder enum anchor, got {text.count(old_enum)}')
          text = text.replace(old_enum, new_enum)

          old_gate = '''        match arguments.sort_by {
              ListFilesSort::None => {}
              ListFilesSort::Name => {
                  diagnostics.push(resource_diagnostic(
                      "E3001",
                      "`.listfiles` `sortby:name` requires Quarkdown's exact alphanumeric comparator semantics".to_string(),
                      *span,
                      "Use `sortby:none`; exact name sorting remains bounded #189 compatibility debt.",
                  ));
                  return CallOutcome::Failed;
              }
              ListFilesSort::LastModified => {
                  diagnostics.push(resource_diagnostic(
                      "E8001",
                      "`.listfiles` `sortby:lastmodified` requires host filesystem timestamps".to_string(),
                      *span,
                      "Use `sortby:none`; deterministic VirtualProject evaluation does not expose host timestamps.",
                  ));
                  return CallOutcome::Failed;
              }
          }
          let _ = arguments.order;
          '''
          new_gate = '''        if arguments.sort_by == ListFilesSort::LastModified {
              diagnostics.push(resource_diagnostic(
                  "E8001",
                  "`.listfiles` `sortby:lastmodified` requires host filesystem timestamps".to_string(),
                  *span,
                  "Use `sortby:none` or the bounded ASCII `sortby:name` slice; deterministic VirtualProject evaluation does not expose host timestamps.",
              ));
              return CallOutcome::Failed;
          }
          '''
          if text.count(old_gate) != 1:
              raise SystemExit(f'expected one listfiles sort gate anchor, got {text.count(old_gate)}')
          text = text.replace(old_gate, new_gate)

          old_present = '''        // Upstream FileSorting.NONE returns an unordered Set after mapping
          // to the requested presentation. For the supported fullpath:false
          // slice, deduplicate bare names and choose a deterministic internal
          // order without claiming observable upstream enumeration order.
          let names = entries
              .into_iter()
              .filter(|entry| arguments.list_directories || entry.kind == ResourceEntryKind::File)
              .map(|entry| entry.name)
              .collect::<BTreeSet<_>>();
          if let Err(outcome) = self.check_materialized_elements_len(names.len(), *span, diagnostics)
          {
              return outcome;
          }
          CallOutcome::Value(IrValue::Collection(
              names.into_iter().map(IrValue::String).collect(),
          ))
          '''
          new_present = '''        let mut entries = entries
              .into_iter()
              .filter(|entry| arguments.list_directories || entry.kind == ResourceEntryKind::File)
              .collect::<Vec<_>>();

          match arguments.sort_by {
              ListFilesSort::None => {
                  // Upstream FileSorting.NONE returns an unordered Set after mapping
                  // to the requested presentation. For the supported fullpath:false
                  // slice, deduplicate bare names and choose a deterministic internal
                  // order without claiming observable upstream enumeration order.
                  let names = entries
                      .into_iter()
                      .map(|entry| entry.name)
                      .collect::<BTreeSet<_>>();
                  if let Err(outcome) =
                      self.check_materialized_elements_len(names.len(), *span, diagnostics)
                  {
                      return outcome;
                  }
                  CallOutcome::Value(IrValue::Collection(
                      names.into_iter().map(IrValue::String).collect(),
                  ))
              }
              ListFilesSort::Name => {
                  if let Some(entry) = entries.iter().find(|entry| !entry.name.is_ascii()) {
                      diagnostics.push(resource_diagnostic(
                          "E3001",
                          format!(
                              "`.listfiles` `sortby:name` exact comparator parity is bounded to ASCII names; `{}` is non-ASCII",
                              entry.name
                          ),
                          *span,
                          "Use `sortby:none` for non-ASCII logical names; #189 retains Unicode lowercase/comparator parity as explicit debt.",
                      ));
                      return CallOutcome::Failed;
                  }
                  entries.sort_by(|left, right| {
                      let ordering =
                          compare_quarkdown_ascii_alphanumeric(&left.name, &right.name);
                      match arguments.order {
                          ListFilesOrder::Ascending => ordering,
                          ListFilesOrder::Descending => ordering.reverse(),
                      }
                  });
                  if let Err(outcome) =
                      self.check_materialized_elements_len(entries.len(), *span, diagnostics)
                  {
                      return outcome;
                  }
                  // Unlike FileSorting.NONE, upstream NAME returns an ordered
                  // list after filename projection, so equal bare names are not
                  // deduplicated.
                  CallOutcome::Value(IrValue::Collection(
                      entries
                          .into_iter()
                          .map(|entry| IrValue::String(entry.name))
                          .collect(),
                  ))
              }
              ListFilesSort::LastModified => unreachable!("rejected before provider access"),
          }
          '''
          if text.count(old_present) != 1:
              raise SystemExit(f'expected one listfiles presentation anchor, got {text.count(old_present)}')
          text = text.replace(old_present, new_present)
          evaluator.write_text(text)

          tests = Path('crates/arkst-core/tests/quarkdown_resource_builtins.rs')
          text = tests.read_text()
          old_reject = '''        (
              ".listfiles {data} fullpath:{false} sortby:{name}\\n",
              "E3001",
              "sortby:name",
          ),
          '''
          if text.count(old_reject) != 1:
              raise SystemExit(f'expected one old name-sort rejection case, got {text.count(old_reject)}')
          text = text.replace(old_reject, '')

          anchor = '''#[test]
          fn listfiles_rejects_unimplemented_or_host_specific_options_before_enumeration() {
          '''.replace('          ', '')
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one listfiles rejection test anchor, got {text.count(anchor)}')
          added = r'''#[test]
          fn listfiles_name_sort_matches_pinned_ascii_alphanumeric_ordering_189() {
              let project = project(
                  "main.qd",
                  &[(
                      "main.qd",
                      ".listfiles {data} directories:{false} fullpath:{false} sortby:{name}::getat {1}\n.listfiles {data} directories:{false} fullpath:{false} sortby:{name}::getat {2}\n.listfiles {data} directories:{false} fullpath:{false} sortby:{name}::getat {3}\n.listfiles {data} directories:{false} fullpath:{false} sortby:{name} order:{descending}::getat {1}\n",
                  )],
                  &[
                      ("data/file10.txt", b"10"),
                      ("data/file2.txt", b"2"),
                      ("data/file1.txt", b"1"),
                  ],
              );
              let result = compile_project(&project);
              assert!(result.diagnostics.is_empty(), "{:?}", result.diagnostics);
              assert_eq!(
                  paragraph_text(&result),
                  "file1.txt\nfile2.txt\nfile10.txt\nfile10.txt"
              );
          }

          #[test]
          fn listfiles_name_sort_matches_leading_zero_length_tiebreak_and_preserves_duplicates_189() {
              let zeros = project(
                  "main.qd",
                  &[(
                      "main.qd",
                      ".listfiles {data} directories:{false} fullpath:{false} sortby:{name}::getat {1}\n.listfiles {data} directories:{false} fullpath:{false} sortby:{name}::getat {2}\n.listfiles {data} directories:{false} fullpath:{false} sortby:{name}::getat {3}\n",
                  )],
                  &[
                      ("data/x001.txt", b"001"),
                      ("data/x01.txt", b"01"),
                      ("data/x1.txt", b"1"),
                  ],
              );
              let zeros_result = compile_project(&zeros);
              assert!(
                  zeros_result.diagnostics.is_empty(),
                  "{:?}",
                  zeros_result.diagnostics
              );
              assert_eq!(paragraph_text(&zeros_result), "x1.txt\nx01.txt\nx001.txt");

              let duplicates = project(
                  "main.qd",
                  &[(
                      "main.qd",
                      ".listfiles {data} directories:{false} recursive:{true} fullpath:{false} sortby:{name}::size\n",
                  )],
                  &[("data/a/same.txt", b"a"), ("data/b/same.txt", b"b")],
              );
              let duplicate_result = compile_project(&duplicates);
              assert!(
                  duplicate_result.diagnostics.is_empty(),
                  "{:?}",
                  duplicate_result.diagnostics
              );
              assert_eq!(paragraph_text(&duplicate_result), "2");
          }

          #[test]
          fn listfiles_name_sort_is_ascii_bounded_and_fail_closed_for_unicode_case_mapping_189() {
              let project = project(
                  "main.qd",
                  &[(
                      "main.qd",
                      ".listfiles {data} directories:{false} fullpath:{false} sortby:{name}\n",
                  )],
                  &[("data/é2.txt", b"unicode")],
              );
              let result = compile_project(&project);
              assert_eq!(result.diagnostics.len(), 1, "{:?}", result.diagnostics);
              assert_eq!(result.diagnostics[0].code, "E3001");
              assert!(result.diagnostics[0].message.contains("ASCII"));
              assert!(result.ir.nodes.is_empty());
          }

          '''.replace('          ', '')
          text = text.replace(anchor, added + anchor)
          tests.write_text(text)
          PY

      - name: Format product patch
        run: cargo fmt --all

      - name: Prove resource builtins
        run: cargo test --locked -p arkst-core --test quarkdown_resource_builtins

      - name: Prove engine contract
        run: cargo test --locked -p arkst-engine

      - name: Prove clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Verify lockfile and commit product proof
        shell: bash
        run: |
          test -z "$(git diff -- Cargo.lock)"
          rm .github/workflows/tmp-189-name-sort.yml
          git add crates/arkst-engine/src/evaluator.rs crates/arkst-core/tests/quarkdown_resource_builtins.rs .github/workflows/tmp-189-name-sort.yml
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'compat(resource): support bounded listfiles name sorting' -m 'Refs #189'
          git push origin HEAD:compat/189-listfiles-name-sort
