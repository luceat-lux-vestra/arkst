name: Issue 332 implementation bootstrap

on:
  push:
    branches:
      - feat/332-slides-autopagebreak
    paths:
      - .github/workflows/issue-332-implement.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Apply bounded implementation
        run: |
          set -euo pipefail
          python3 -m py_compile .github/issue-332-implement.py
          python3 .github/issue-332-implement.py
          cargo fmt --all
          git diff --check

      - name: Run bounded engine and lowering tests
        run: |
          set -euo pipefail
          cargo test --locked -p arkst-core --test quarkdown_v260_autopagebreak
          cargo test --locked -p arkst-typst --test auto_page_break
          cargo test --locked -p arkst-engine

      - name: Run real pinned Typst integration
        run: |
          set -euo pipefail
          cargo test --locked -p arkst-typst-inprocess --test auto_page_break -- --nocapture

      - name: Commit candidate
        run: |
          set -euo pipefail
          git config user.name 'luceat-lux-vestra'
          git config user.email 'heathkimdev@gmail.com'
          git rm .github/workflows/issue-332-implement.yml .github/issue-332-implement.py
          git add \
            crates/arkst-ir/src/lib.rs \
            crates/arkst-engine/src/evaluator.rs \
            crates/arkst-core/tests/quarkdown_v260_autopagebreak.rs \
            crates/arkst-typst/src/lowering.rs \
            crates/arkst-typst/tests/auto_page_break.rs \
            crates/arkst-typst-inprocess/tests/auto_page_break.rs \
            docs/compatibility/quarkdown/V260_AUTOPAGEBREAK.md
          git diff --cached --check
          git commit -m 'feat(compat): implement v2.6 slides auto page breaks' -m 'Refs #332, #311'
          git push origin HEAD:feat/332-slides-autopagebreak
