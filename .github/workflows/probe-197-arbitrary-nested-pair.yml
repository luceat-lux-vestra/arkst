name: Quarkdown arbitrary nested Pair logger clean-room probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    name: probe-${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: v2.5.1
            sha256: 5751ab608fcb4daa2ec857a3368c029beed5429554ae0bdd95c660b2706269e9
          - version: v2.6.0
            sha256: 5b015e47c820d06ff6774eb700e60d77bc575819d4a0140cc7f1a115e7ce6dc4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch exact official distribution
        shell: bash
        run: |
          set -euo pipefail
          version='${{ matrix.version }}'
          expected='${{ matrix.sha256 }}'
          archive="/tmp/quarkdown-${version}.zip"
          root="/tmp/quarkdown-${version}"
          url="https://github.com/iamgio/quarkdown/releases/download/${version}/quarkdown-linux-x64.zip"
          curl -fL --retry 3 --retry-all-errors --connect-timeout 20 -o "$archive" "$url"
          printf '%s  %s\n' "$expected" "$archive" | sha256sum -c -
          mkdir -p "$root"
          unzip -q "$archive" -d "$root"
          qd="$(find "$root" -type f -name quarkdown -perm -111 -print -quit)"
          test -n "$qd"
          printf 'QD=%s\n' "$qd" >> "$GITHUB_ENV"
          "$qd" --version

      - name: Probe nested Pair depth and mixed leaves
        shell: bash
        run: |
          set -euo pipefail
          root="/tmp/logger197-nested-pair-${{ matrix.version }}"
          rm -rf "$root"
          mkdir -p "$root"

          cat > "$root/depth2.qd" <<'QD'
          .log {.pair {.pair {.pair {a} {b}} {c}} {.none}}
          QD

          cat > "$root/depth3.qd" <<'QD'
          .log {.pair {.pair {.pair {.pair {a} {b}} {c}} {d}} {.none}}
          QD

          cat > "$root/depth4-range.qd" <<'QD'
          .log {.pair {.pair {.pair {.pair {.range {1} {2}} {.range to:{3}}} {.none}} {tail}} {.range from:{4}}}
          QD

          cat > "$root/right-nested.qd" <<'QD'
          .log {.pair {head} {.pair {mid} {.pair {tail} {.none}}}}
          QD

          cat > "$root/debug-depth3.qd" <<'QD'
          .debug {.pair {.pair {.pair {a} {b}} {c}} {.none}}
          after-debug
          QD

          cat > "$root/error-depth3.qd" <<'QD'
          before
          .error {.pair {.pair {.pair {a} {b}} {c}} {.none}}
          after
          QD

          for fixture in depth2 depth3 depth4-range right-nested debug-depth3 error-depth3; do
            out="$root/out-$fixture"
            stdout="$root/$fixture.stdout"
            stderr="$root/$fixture.stderr"
            set +e
            "$QD" compile "$root/$fixture.qd" --clean --pretty --out "$out" --out-name probe >"$stdout" 2>"$stderr"
            rc=$?
            set -e
            python3 - "$fixture" "$rc" "$stdout" "$stderr" <<'PY'
          from pathlib import Path
          import sys
          fixture, rc, stdout_path, stderr_path = sys.argv[1:]
          stdout = Path(stdout_path).read_text(errors="replace")
          stderr = Path(stderr_path).read_text(errors="replace")
          print(f"QD197-NESTED-PAIR fixture={fixture} rc={rc}")
          print(f"QD197-NESTED-PAIR-STDOUT fixture={fixture} value={stdout!r}")
          print(f"QD197-NESTED-PAIR-STDERR fixture={fixture} value={stderr!r}")
          PY
          done
