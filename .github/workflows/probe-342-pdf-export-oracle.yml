name: Probe 342 PDF export oracle

on:
  push:
    branches:
      - probe/342-pdf-export-oracle

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download and verify exact Quarkdown v2.6.0 oracle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence unpack
          curl -fL --retry 3 --retry-all-errors \
            -o quarkdown-linux-x64.zip \
            https://github.com/iamgio/quarkdown/releases/download/v2.6.0/quarkdown-linux-x64.zip
          echo '5b015e47c820d06ff6774eb700e60d77bc575819d4a0140cc7f1a115e7ce6dc4  quarkdown-linux-x64.zip' | sha256sum -c - | tee evidence/sha256.txt
          unzip -q quarkdown-linux-x64.zip -d unpack
          qd="$(find unpack -type f -path '*/bin/quarkdown' -print -quit)"
          if [[ -z "$qd" ]]; then
            qd="$(find unpack -type f -name quarkdown -print -quit)"
          fi
          test -n "$qd"
          chmod +x "$qd"
          printf '%s\n' "$qd" > evidence/executable.txt
          "$qd" --version | tee evidence/version.txt
          printf '%s\n' "$qd" > "$RUNNER_TEMP/qd-path"

      - name: Capture v2.6 CLI surface
        shell: bash
        run: |
          set -euo pipefail
          qd="$(cat "$RUNNER_TEMP/qd-path")"
          "$qd" c --help > evidence/compiler-help.txt 2>&1
          grep -F -- '--chrome-path' evidence/compiler-help.txt
          ! grep -F -- '--node-path' evidence/compiler-help.txt
          ! grep -F -- '--npm-path' evidence/compiler-help.txt
          {
            echo '=== chrome-related help ==='
            grep -E -- 'chrome|pdf|sandbox' evidence/compiler-help.txt || true
          } | tee evidence/help-summary.txt

      - name: Run deterministic browser-path black-box matrix
        shell: bash
        run: |
          set -euo pipefail
          qd="$(cat "$RUNNER_TEMP/qd-path")"
          cat > probe.qd <<'EOF'
          .docname {Probe}
          .doclang {English}
          # Probe
          EOF

          cat > fake-cli-chrome <<'EOF'
          #!/usr/bin/env bash
          printf '%s|%s\n' "$0" "$*" >> "$PROBE_LOG"
          exit 93
          EOF
          cp fake-cli-chrome fake-env-chrome
          chmod +x fake-cli-chrome fake-env-chrome

          run_expect_failure() {
            local name="$1"
            shift
            set +e
            "$@" > "evidence/${name}.stdout" 2> "evidence/${name}.stderr"
            local status=$?
            set -e
            printf '%s\n' "$status" > "evidence/${name}.status"
            test "$status" -ne 0
          }

          explicit_log="$PWD/evidence/explicit-cli.log"
          PROBE_LOG="$explicit_log" run_expect_failure explicit-cli \
            "$qd" c probe.qd --pdf --chrome-path "$PWD/fake-cli-chrome"
          test -s "$explicit_log"
          grep -F 'fake-cli-chrome' "$explicit_log"

          env_log="$PWD/evidence/env-path.log"
          PROBE_LOG="$env_log" QD_CHROME_PATH="$PWD/fake-env-chrome" \
            run_expect_failure env-path "$qd" c probe.qd --pdf
          test -s "$env_log"
          grep -F 'fake-env-chrome' "$env_log"

          precedence_log="$PWD/evidence/precedence.log"
          PROBE_LOG="$precedence_log" QD_CHROME_PATH="$PWD/fake-env-chrome" \
            run_expect_failure precedence "$qd" c probe.qd --pdf --chrome-path "$PWD/fake-cli-chrome"
          test -s "$precedence_log"
          grep -F 'fake-cli-chrome' "$precedence_log"
          ! grep -F 'fake-env-chrome' "$precedence_log"

          legacy_env_log="$PWD/evidence/legacy-env.log"
          PROBE_LOG="$legacy_env_log" QD_NPM_PREFIX=/definitely/not/used NODE_PATH=/definitely/not/used \
            run_expect_failure legacy-env "$qd" c probe.qd --pdf --chrome-path "$PWD/fake-cli-chrome"
          test -s "$legacy_env_log"
          grep -F 'fake-cli-chrome' "$legacy_env_log"

          run_expect_failure missing-chrome \
            "$qd" c probe.qd --pdf --chrome-path "$PWD/does-not-exist"

          run_expect_failure legacy-node-flag \
            "$qd" c probe.qd --pdf --node-path /definitely/not/used
          run_expect_failure legacy-npm-flag \
            "$qd" c probe.qd --pdf --npm-path /definitely/not/used

          {
            echo '=== statuses ==='
            for file in evidence/*.status; do printf '%s=' "$(basename "$file" .status)"; cat "$file"; done
            echo '=== explicit invocation ==='; cat "$explicit_log"
            echo '=== env invocation ==='; cat "$env_log"
            echo '=== precedence invocation ==='; cat "$precedence_log"
            echo '=== legacy env invocation ==='; cat "$legacy_env_log"
            echo '=== missing chrome stderr ==='; cat evidence/missing-chrome.stderr
            echo '=== legacy node flag stderr ==='; cat evidence/legacy-node-flag.stderr
            echo '=== legacy npm flag stderr ==='; cat evidence/legacy-npm-flag.stderr
          } | tee evidence/summary.txt

      - name: Upload oracle evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: probe-342-pdf-export-oracle-${{ github.run_id }}
          path: evidence
          if-no-files-found: error
