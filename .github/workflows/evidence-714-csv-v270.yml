name: Evidence 714 csv v2.7.0

on:
  push:
    branches:
      - evidence/714-csv-v270

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download and verify official Quarkdown v2.7.0
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/quarkdown-linux-x64-v2.7.0.zip"
          url="https://github.com/iamgio/quarkdown/releases/download/v2.7.0/quarkdown-linux-x64.zip"
          sha="5ff4e78e391abd073e62030da816faef265d681d3b8ccfd05768cc9c586f7e85"
          curl --fail --location --retry 3 --output "$archive" "$url"
          printf '%s  %s\n' "$sha" "$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/quarkdown-v270"
          unzip -q "$archive" -d "$RUNNER_TEMP/quarkdown-v270"
          qd="$(find "$RUNNER_TEMP/quarkdown-v270" -type f -path '*/bin/quarkdown' -print -quit)"
          test -n "$qd"
          chmod +x "$qd"
          echo "QD=$qd" >> "$GITHUB_ENV"
          "$qd" --version || true

      - name: Run independent black-box csv producer probes
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/csv-probes"
          mkdir -p "$root"

          mkprobe() {
            local name="$1"
            mkdir -p "$root/$name"
          }

          mkprobe standard_default
          cat > "$root/standard_default/input.qd" <<'QD'
          .csv {data.csv}
          QD
          cat > "$root/standard_default/data.csv" <<'CSV'
           Signal , Amount , Note
           Alder , 4 , east
           Birch , 9 , west
          CSV

          mkprobe explicit_plain
          cat > "$root/explicit_plain/input.qd" <<'QD'
          .csv {data.csv} mode:{plain}
          QD
          cat > "$root/explicit_plain/data.csv" <<'CSV'
          Signal,Amount
          Cedar,6
          Dune,8
          CSV

          mkprobe plain_markers
          cat > "$root/plain_markers/input.qd" <<'QD'
          .csv {data.csv} mode:{plain}
          QD
          cat > "$root/plain_markers/data.csv" <<'CSV'
          Signal,Note
          Ember,**bold**
          CSV

          mkprobe markdown_markers
          cat > "$root/markdown_markers/input.qd" <<'QD'
          .csv {data.csv} mode:{markdown}
          QD
          cat > "$root/markdown_markers/data.csv" <<'CSV'
          Signal,Note
          Ember,**bold**
          CSV

          mkprobe quoted_trim
          cat > "$root/quoted_trim/input.qd" <<'QD'
          .csv {data.csv}
          QD
          cat > "$root/quoted_trim/data.csv" <<'CSV'
           Name , Value , Note
           "Harbor, Jr." , 7 , "a ""quote"""
           Iris , 3 , tail
          CSV

          mkprobe quoted_clean
          cat > "$root/quoted_clean/input.qd" <<'QD'
          .csv {data.csv}
          QD
          cat > "$root/quoted_clean/data.csv" <<'CSV'
          Name,Value,Note
          "Harbor, Jr.",7,"a ""quote"""
          Iris,3,tail
          CSV

          mkprobe header_only
          cat > "$root/header_only/input.qd" <<'QD'
          .csv {data.csv}
          QD
          printf 'Signal,Amount\n' > "$root/header_only/data.csv"

          mkprobe empty_file
          cat > "$root/empty_file/input.qd" <<'QD'
          .csv {data.csv}
          QD
          : > "$root/empty_file/data.csv"

          mkprobe composed_compute
          cat > "$root/composed_compute/input.qd" <<'QD'
          .tablecompute {2} {values: .values::sumall}
              .csv {data.csv}
          QD
          cat > "$root/composed_compute/data.csv" <<'CSV'
          Signal,Amount
          Juniper,5
          Kestrel,11
          CSV

          mkprobe invalid_mode
          cat > "$root/invalid_mode/input.qd" <<'QD'
          .csv {data.csv} mode:{unknown}
          QD
          cat > "$root/invalid_mode/data.csv" <<'CSV'
          Signal,Amount
          Lumen,2
          CSV

          mkdir -p "$root/nested_relative/nested"
          cat > "$root/nested_relative/nested/input.qd" <<'QD'
          .csv {data.csv}
          QD
          cat > "$root/nested_relative/nested/data.csv" <<'CSV'
          Signal,Amount
          Moss,13
          Nova,17
          CSV

          inspect_html() {
            local html="$1"
            python3 - "$html" <<'PY'
          import re
          import sys
          from html.parser import HTMLParser

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.depth = 0
                  self.tables = []
                  self.table = None
                  self.row = None
                  self.cell = None
              def handle_starttag(self, tag, attrs):
                  if tag == "table":
                      self.depth += 1
                      if self.depth == 1:
                          self.table = []
                  elif self.depth == 1 and tag == "tr":
                      self.row = []
                  elif self.depth == 1 and tag in ("td", "th"):
                      self.cell = []
              def handle_data(self, data):
                  if self.depth == 1 and self.cell is not None:
                      self.cell.append(data)
              def handle_endtag(self, tag):
                  if self.depth == 1 and tag in ("td", "th") and self.cell is not None:
                      value = re.sub(r"\s+", " ", "".join(self.cell)).strip()
                      self.row.append(value)
                      self.cell = None
                  elif self.depth == 1 and tag == "tr" and self.row is not None:
                      if self.row:
                          self.table.append(self.row)
                      self.row = None
                  elif tag == "table":
                      if self.depth == 1 and self.table is not None:
                          self.tables.append(self.table)
                          self.table = None
                      self.depth -= 1

          raw = open(sys.argv[1], encoding="utf-8").read()
          p = Parser()
          p.feed(raw)
          print(f"TABLE_COUNT={len(p.tables)}")
          for ti, table in enumerate(p.tables):
              print(f"TABLE[{ti}]")
              for ri, row in enumerate(table):
                  print(f"ROW[{ri}]=" + " || ".join(row))
          for needle in ("**bold**", "<strong>bold</strong>", "<strong>"):
              print(f"RAW_CONTAINS[{needle}]={needle in raw}")
          PY
          }

          run_probe() {
            local name="$1"
            local rel="${2:-input.qd}"
            local dir="$root/$name"
            echo "::group::PROBE $name"
            set +e
            (
              cd "$dir"
              "$QD" --log-level error c "$rel" --pipe -r html --strict
            ) >"$dir/stdout.log" 2>"$dir/stderr.log"
            rc=$?
            set -e
            echo "RESULT name=$name rc=$rc"
            if [ -s "$dir/stderr.log" ]; then
              echo "STDERR:"
              sed -n '1,100p' "$dir/stderr.log"
            fi
            if [ "$rc" -eq 0 ]; then
              echo "RENDERED:"
              inspect_html "$dir/stdout.log"
            elif [ -s "$dir/stdout.log" ]; then
              echo "STDOUT:"
              sed -n '1,100p' "$dir/stdout.log"
            fi
            echo "::endgroup::"
          }

          for name in standard_default explicit_plain plain_markers markdown_markers quoted_trim quoted_clean header_only empty_file composed_compute invalid_mode
          do
            run_probe "$name"
          done
          run_probe nested_relative nested/input.qd
