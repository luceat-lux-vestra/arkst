name: Dev #322 isolate v2.6 doclang

on:
  push:
    branches:
      - compat/311-v260-doclang-getter

permissions:
  contents: write

jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Restore JDK25 verifier and wire v2.6 module
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- crates/arkst-engine/src/locale.rs
          python3 - <<'PY'
          from pathlib import Path

          evaluator = Path('crates/arkst-engine/src/evaluator.rs')
          text = evaluator.read_text(encoding='utf-8')
          old = 'crate::locale::resolve_doclang_v260(&identifier)'
          new = 'crate::doclang_v260::resolve(&identifier)'
          assert text.count(old) == 1, text.count(old)
          evaluator.write_text(text.replace(old, new), encoding='utf-8')

          lib = Path('crates/arkst-engine/src/lib.rs')
          text = lib.read_text(encoding='utf-8')
          anchor = 'pub(crate) mod invocation_binder;\npub(crate) mod locale;'
          replacement = 'pub(crate) mod invocation_binder;\npub(crate) mod doclang_v260;\npub(crate) mod locale;'
          assert text.count(anchor) == 1, text.count(anchor)
          lib.write_text(text.replace(anchor, replacement), encoding='utf-8')
          PY
          cmp crates/arkst-engine/src/locale.rs <(git show origin/main:crates/arkst-engine/src/locale.rs)

      - name: Targeted verification
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo test -p arkst-engine doclang_v260 --locked
          cargo test -p arkst-core doclang_ --locked
          cargo test -p arkst-core --test quarkdown_localization --locked
          cargo test -p arkst-test-support doclang --locked
          cmp crates/arkst-engine/src/locale.rs <(git show origin/main:crates/arkst-engine/src/locale.rs)

      - name: Commit product fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/dev-322-isolate-doclang-v260.yml
          git add -A
          git config user.name 'luceat-lux-vestra'
          git config user.email 'heathkimdev@gmail.com'
          git commit -m 'fix(compat): isolate v2.6 doclang from JDK25 verifier'
          git push origin HEAD:compat/311-v260-doclang-getter
