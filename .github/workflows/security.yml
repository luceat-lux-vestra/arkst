name: Security Audit

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      force_failure:
        description: "Force audit failure to validate owned-issue reporting"
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/security.yml"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/security.yml"

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: 1.98.0

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot
        with:
          toolchain: 1.98.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features
      - name: Force reporter validation failure
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.force_failure) ||
          (github.event_name == 'pull_request' && github.head_ref == 'security/229-scheduled-failure-visibility')
        run: |
          echo "Forcing audit failure to validate scheduled-failure reporting."
          exit 1

  report-failure:
    name: report-scheduled-failure
    needs:
      - audit
    if: >-
      ${{ always() &&
      ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'pull_request' && github.head_ref == 'security/229-scheduled-failure-visibility')) &&
      needs.audit.result == 'failure' }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Create or update the owned failure issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = 'ci: scheduled supply-chain audit is failing';
            const marker = '<!-- scribium-owned:scheduled-supply-chain-failure -->';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runUrl = [
              context.serverUrl,
              owner,
              repo,
              'actions',
              'runs',
              context.runId,
            ].join('/');
            const body = [
              marker,
              'The scheduled full-graph supply-chain audit failed.',
              '',
              `Run: ${runUrl}`,
              '',
              'Triage advisories, licenses, bans, and dependency sources according to',
              '`docs/engineering/SUPPLY_CHAIN.md` and `deny.toml`.',
            ].join('\n');

            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner,
                repo,
                state: 'all',
                labels: 'type:bug,area:ci',
                per_page: 100,
              },
            );
            const existing = issues.find(
              (issue) =>
                !issue.pull_request &&
                issue.title === title &&
                (issue.body || '').includes(marker),
            );

            if (existing) {
              if (existing.state === 'closed') {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: existing.number,
                  state: 'open',
                });
              }
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels: ['type:bug', 'area:ci', 'priority:normal'],
              });
            }
