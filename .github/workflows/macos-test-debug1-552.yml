name: macOS test debug1 benchmark 552

on:
  push:
    branches:
      - exp/552-macos-test-debug1
    paths:
      - .github/workflows/macos-test-debug1-552.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arkst-552-macos-test-debug1-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  RUSTFLAGS: "-D warnings"
  RUSTUP_TOOLCHAIN: 1.98.0
  SOURCE_SHA: 07a9d478ae433b5e040f325b0fa231647b02150b

jobs:
  prime:
    name: producer ${{ matrix.variant }}
    runs-on: macos-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        variant: [A, B]

    steps:
      - name: Check out research harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify harness and source authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mapfile -t changed < <(git diff --name-only "$SOURCE_SHA..$GITHUB_SHA")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".github/workflows/macos-test-debug1-552.yml"
          git diff --check "$SOURCE_SHA..$GITHUB_SHA" -- .github/workflows/macos-test-debug1-552.yml
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code

      - name: Configure candidate test profile
        if: ${{ matrix.variant == 'B' }}
        shell: bash
        run: echo "CARGO_PROFILE_TEST_DEBUG=1" >> "$GITHUB_ENV"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot
        with:
          toolchain: 1.98.0

      - name: Install Typst 0.15.1
        uses: typst-community/setup-typst@9107b8dd77d7a7fd6c5faebbb507cac28069042e # v5
        with:
          typst-version: 0.15.1

      - name: Record producer identity
        shell: bash
        run: |
          set -euo pipefail
          echo "variant=${{ matrix.variant }}"
          echo "CARGO_PROFILE_TEST_DEBUG=${CARGO_PROFILE_TEST_DEBUG:-}"
          echo "ImageOS=$ImageOS"
          echo "ImageVersion=$ImageVersion"
          echo "RUNNER_ARCH=$RUNNER_ARCH"
          rustc -Vv
          cargo -V
          typst --version

      - name: Prime variant target cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: 552-${{ matrix.variant }}-macos-${{ github.sha }}

      - name: Prime default CLI feature boundary
        run: cargo test --locked -p arkst-cli --no-default-features

      - name: Prime Typst-required workspace
        run: cargo test --locked --workspace --all-targets --all-features
        env:
          ARKST_REQUIRE_TYPST: "1"

      - name: Capture target footprint
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/arkst-552-producer-$VARIANT"
          mkdir -p "$evidence"
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          root = Path("target")
          files = [p for p in root.rglob("*") if p.is_file()]
          dsym = [p for p in files if any(part.endswith(".dSYM") for part in p.parts)]
          dylibs = [p for p in files if p.suffix == ".dylib"]
          executables = [
              p for p in files
              if os.access(p, os.X_OK)
              and p.suffix not in {".dylib", ".rlib", ".rmeta", ".a", ".o", ".d"}
              and not any(part.endswith(".dSYM") for part in p.parts)
          ]

          def size(items):
              return sum(p.stat().st_size for p in items)

          data = {
              "variant": os.environ["VARIANT"],
              "cargo_profile_test_debug": os.environ.get("CARGO_PROFILE_TEST_DEBUG", ""),
              "file_count": len(files),
              "total_bytes": size(files),
              "dsym_file_count": len(dsym),
              "dsym_bytes": size(dsym),
              "dylib_count": len(dylibs),
              "dylib_bytes": size(dylibs),
              "executable_count": len(executables),
              "executable_bytes": size(executables),
          }
          out = Path(os.environ["RUNNER_TEMP"]) / f"arkst-552-producer-{os.environ['VARIANT']}" / "target-footprint.json"
          out.write_text(json.dumps(data, indent=2) + "\n")
          print(json.dumps(data, indent=2))
          PY

      - name: Upload producer footprint
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arkst-552-producer-${{ matrix.variant }}-${{ github.run_id }}
          path: ${{ runner.temp }}/arkst-552-producer-${{ matrix.variant }}
          if-no-files-found: error
          retention-days: 30

  benchmark:
    name: benchmark ${{ matrix.variant }} / rep ${{ matrix.rep }}
    needs: [prime]
    runs-on: macos-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        variant: [A, B]
        rep: [1, 2, 3, 4]

    steps:
      - name: Check out research harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify harness and source authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mapfile -t changed < <(git diff --name-only "$SOURCE_SHA..$GITHUB_SHA")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".github/workflows/macos-test-debug1-552.yml"
          git diff --check "$SOURCE_SHA..$GITHUB_SHA" -- .github/workflows/macos-test-debug1-552.yml
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code

      - name: Configure candidate test profile
        if: ${{ matrix.variant == 'B' }}
        shell: bash
        run: echo "CARGO_PROFILE_TEST_DEBUG=1" >> "$GITHUB_ENV"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot
        with:
          toolchain: 1.98.0

      - name: Install Typst 0.15.1
        uses: typst-community/setup-typst@9107b8dd77d7a7fd6c5faebbb507cac28069042e # v5
        with:
          typst-version: 0.15.1

      - name: Record benchmark identity
        shell: bash
        run: |
          set -euo pipefail
          echo "variant=${{ matrix.variant }}"
          echo "rep=${{ matrix.rep }}"
          echo "CARGO_PROFILE_TEST_DEBUG=${CARGO_PROFILE_TEST_DEBUG:-}"
          echo "ImageOS=$ImageOS"
          echo "ImageVersion=$ImageVersion"
          echo "RUNNER_ARCH=$RUNNER_ARCH"
          rustc -Vv
          cargo -V
          typst --version

      - name: Restore variant target cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: 552-${{ matrix.variant }}-macos-${{ github.sha }}
          save-if: false

      - name: Test default CLI feature boundary
        run: cargo test --locked -p arkst-cli --no-default-features

      - name: Test Typst-required workspace
        run: cargo test --locked --workspace --all-targets --all-features
        env:
          ARKST_REQUIRE_TYPST: "1"
