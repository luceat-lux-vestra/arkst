name: Arkst sccache compression-density benchmark round 5A

on:
  push:
    branches:
      - exp/525-sccache-rust-cache-benchmark
    paths:
      - .github/workflows/sccache-rust-cache-benchmark.yml

permissions:
  contents: read

concurrency:
  group: arkst-527-round5a-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"
  RUSTUP_TOOLCHAIN: 1.98.0
  SOURCE_BASE_SHA: 95255a3e68b9c29ca4dd051f289a6630a0208912
  BENCH_DIR: benchmark-evidence/sccache-compression-density

jobs:
  prime:
    name: zstd level ${{ matrix.level }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        level: [3, 10, 22]

    env:
      SCCACHE_CACHE_ZSTD_LEVEL: ${{ matrix.level }}
      SCCACHE_CACHE_SIZE: 2G

    steps:
      - name: Check out experiment
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot
        with:
          toolchain: 1.98.0

      - name: Verify bounded experiment identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git diff --name-only "$SOURCE_BASE_SHA"...HEAD)" = ".github/workflows/sccache-rust-cache-benchmark.yml"
          git diff --check "$SOURCE_BASE_SHA"...HEAD -- .github/workflows/sccache-rust-cache-benchmark.yml

      - name: Install verified sccache 0.18.0
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/sccache-v0.18.0-x86_64-unknown-linux-musl.tar.gz"
          install_dir="$RUNNER_TEMP/sccache-v0.18.0"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/mozilla/sccache/releases/download/v0.18.0/sccache-v0.18.0-x86_64-unknown-linux-musl.tar.gz" \
            --output "$archive"
          echo "45f1447fbe231e3037bde351ef70677dd212216c8d62ae7ca409fecc4d6acc89  $archive" \
            | sha256sum --check --strict
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" --strip-components=1
          test -x "$install_dir/sccache"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Prime exact full compile surface
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BENCH_DIR"
          export SCCACHE_DIR="$RUNNER_TEMP/arkst-527-sccache-zstd-$SCCACHE_CACHE_ZSTD_LEVEL"
          export RUSTC_WRAPPER=sccache
          rm -rf "$SCCACHE_DIR" target
          mkdir -p "$SCCACHE_DIR"
          cargo fetch --locked

          run_prime() {
            phase="$1"
            shift
            rm -rf target
            sccache --stop-server >/dev/null 2>&1 || true
            sccache --zero-stats >/dev/null
            start_ns="$(date +%s%N)"
            "$@"
            end_ns="$(date +%s%N)"
            sccache --show-stats --stats-format=json > "$BENCH_DIR/$phase-stats.json"
            python3 - "$phase" "$start_ns" "$end_ns" "$BENCH_DIR/$phase-stats.json" \
              >> "$BENCH_DIR/phase-results.jsonl" <<'PY'
          import json, sys
          phase, start_ns, end_ns, stats_path = sys.argv[1:]
          stats = json.load(open(stats_path, encoding="utf-8")).get("stats", {})
          print(json.dumps({
              "phase": phase,
              "wall_ms": (int(end_ns) - int(start_ns)) / 1_000_000,
              "rust_hits": stats.get("cache_hits", {}).get("counts", {}).get("Rust", 0),
              "rust_misses": stats.get("cache_misses", {}).get("counts", {}).get("Rust", 0),
              "read_errors": stats.get("cache_read_errors", 0),
              "write_errors": stats.get("cache_write_errors", 0),
              "successful_writes": stats.get("cache_writes", 0),
          }, sort_keys=True))
          PY
          }

          total_start_ns="$(date +%s%N)"

          run_prime no-default \
            cargo test --locked -p arkst-cli --no-default-features --no-run

          run_prime workspace-all \
            env ARKST_REQUIRE_TYPST=1 \
            cargo test --locked --workspace --all-targets --all-features --no-run

          run_prime backend-parity \
            env ARKST_REQUIRE_TYPST=1 \
            cargo test --locked -p arkst-typst-inprocess \
              --test backend_parity --all-features --no-run

          run_prime dev-cli \
            cargo build --locked -p arkst-cli

          sccache --stop-server >/dev/null 2>&1 || true
          total_end_ns="$(date +%s%N)"

          local_bytes="$(du -sb "$SCCACHE_DIR" | awk '{print $1}')"
          file_count="$(find "$SCCACHE_DIR" -type f | wc -l)"

          transport_archive="$RUNNER_TEMP/arkst-527-zstd-$SCCACHE_CACHE_ZSTD_LEVEL.tzst"
          archive_start_ns="$(date +%s%N)"
          tar --posix -cf "$transport_archive" -C "$SCCACHE_DIR" . --use-compress-program=zstdmt
          archive_end_ns="$(date +%s%N)"
          transport_bytes="$(stat -c '%s' "$transport_archive")"

          python3 \
            "$SCCACHE_CACHE_ZSTD_LEVEL" \
            "$total_start_ns" "$total_end_ns" \
            "$archive_start_ns" "$archive_end_ns" \
            "$local_bytes" "$transport_bytes" "$file_count" \
            > "$BENCH_DIR/summary.json" <<'PY'
          import json, sys
          (
              level, total_start, total_end, archive_start, archive_end,
              local_bytes, transport_bytes, file_count
          ) = sys.argv[1:]
          print(json.dumps({
              "zstd_level": int(level),
              "prime_wall_ms": (int(total_end) - int(total_start)) / 1_000_000,
              "transport_pack_wall_ms": (int(archive_end) - int(archive_start)) / 1_000_000,
              "local_cache_bytes": int(local_bytes),
              "transport_proxy_bytes": int(transport_bytes),
              "cache_file_count": int(file_count),
          }, sort_keys=True, indent=2))
          PY

          cat "$BENCH_DIR/summary.json"
          cat "$BENCH_DIR/phase-results.jsonl"

      - name: Retain compression evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arkst-527-round5a-zstd-${{ matrix.level }}
          path: benchmark-evidence/sccache-compression-density
          if-no-files-found: error
          retention-days: 30
