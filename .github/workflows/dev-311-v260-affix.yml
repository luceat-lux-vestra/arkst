name: dev-311-v260-affix

on:
  push:
    branches:
      - compat/311-v260-collection-affix

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Patch and test
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/dev_patch_311_v260_affix.py
          cargo fmt --all
          cargo test -p arkst-core --test quarkdown_v260_collection_affix --locked
          cargo test -p arkst-engine --lib --locked
          rm .github/workflows/dev-311-v260-affix.yml tools/dev_patch_311_v260_affix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(compat): add v2.6.0 collection affixes'
          git push origin HEAD:compat/311-v260-collection-affix
