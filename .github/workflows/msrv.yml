name: MSRV

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

permissions:
  contents: read

concurrency:
  group: msrv-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Draft final-gate placeholder
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: echo "full required-context validation is deferred until the pull request is ready for review"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        with:
          toolchain: 1.92.0
      - run: cargo +1.92.0 check --workspace --all-targets --all-features --locked
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
