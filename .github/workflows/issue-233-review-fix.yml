name: Apply issue 233 review fix

on:
  push:
    branches:
      - release/233-github-release-contract
    paths:
      - .github/workflows/issue-233-review-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/233-github-release-contract
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
      - name: Enforce sole CLI artifact classification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          verifier = Path('tools/ci/verify_distribution_policy.py')
          text = verifier.read_text()
          old = '''    metadata_names = set(package_map)\n    policy_names = {entry["name"] for entry in entries}\n    if metadata_names != policy_names:\n'''
          new = '''    metadata_names = set(package_map)\n    policy_names = {entry["name"] for entry in entries}\n    cli_names = [entry["name"] for entry in entries if entry["distribution"] == "cli"]\n    if cli_names != ["arkst-cli"]:\n        raise DistributionPolicyError(\n            "policy must classify exactly arkst-cli as the sole cli distribution artifact"\n        )\n    if metadata_names != policy_names:\n'''
          assert text.count(old) == 1
          verifier.write_text(text.replace(old, new, 1))

          tests = Path('tools/ci/test_verify_distribution_policy.py')
          text = tests.read_text()
          anchor = '''    def test_cli_wrong_publication_channel_is_rejected(self) -> None:\n'''
          insert = '''    def test_second_cli_distribution_classification_is_rejected(self) -> None:\n        policy_text = self.set_package_field(\n            POLICY.read_text(encoding="utf-8"),\n            "arkst-core",\n            "distribution",\n            '"cli"',\n        )\n        self.reject(\n            r"exactly arkst-cli as the sole cli distribution artifact",\n            policy_text=policy_text,\n        )\n\n'''
          assert text.count(anchor) == 1
          tests.write_text(text.replace(anchor, insert + anchor, 1))
          PY
          python3 tools/ci/test_verify_distribution_policy.py
          python3 tools/ci/verify_distribution_policy.py
          cargo fmt --all -- --check
          git diff --check
      - name: Commit review fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "luceat-lux-vestra"
          git config user.email "heathkimdev@gmail.com"
          git add tools/ci/verify_distribution_policy.py tools/ci/test_verify_distribution_policy.py
          git diff --cached --check
          git commit -m "test: enforce sole Arkst release CLI artifact"
          git push origin HEAD:release/233-github-release-contract
