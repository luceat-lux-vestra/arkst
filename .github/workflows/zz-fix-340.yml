name: Fix #340 test constructor

on:
  push:
    branches:
      - compat/336-stack-alignment-inheritance

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Apply exact test-only constructor fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/arkst-engine/src/evaluator.rs')
          text = path.read_text()
          old = '''        IrValue::Component(IrComponent::Stacked(IrStackedComponent {
              layout: IrStackedLayout::Column,
              main_axis_alignment: IrMainAxisAlignment::Start,
              cross_axis_alignment: IrCrossAxisAlignment::Center,'''
          new = '''        IrValue::Component(IrComponent::Stacked(IrStackedComponent {
              layout: IrStackedLayout::Column,
              main_axis_alignment: Some(IrMainAxisAlignment::Start),
              cross_axis_alignment: IrCrossAxisAlignment::Center,'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one test constructor, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/zz-fix-340.yml
          cargo fmt --all --check
          cargo test --locked -p arkst-engine --lib
          cargo clippy --locked -p arkst-engine --all-targets --all-features -- -D warnings
          git diff --check

      - name: Commit clean fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(compat): update stacked constructor for optional alignment'
          git push origin HEAD:compat/336-stack-alignment-inheritance
