name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: release-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.contract.outputs.version }}
      matrix: ${{ steps.contract.outputs.matrix }}
    steps:
      - name: Check out immutable release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
          fetch-depth: 1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0

      - name: Verify canonical distribution and release contract
        id: contract
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 tools/ci/verify_distribution_policy.py
          python3 tools/ci/verify_release_contract.py \
            --tag "${RELEASE_TAG}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Verify tag points to current protected main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          tag_sha="$(git rev-parse HEAD)"
          if test "${tag_sha}" != "${main_sha}"; then
            echo "::error::release tag points to ${tag_sha}, but current main is ${main_sha}" >&2
            exit 1
          fi

      - name: Verify live immutable release tag ruleset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rulesets="${RUNNER_TEMP}/release-rulesets.json"
          detail="${RUNNER_TEMP}/release-ruleset.json"
          gh api "repos/${GITHUB_REPOSITORY}/rulesets?per_page=100" > "${rulesets}"
          ruleset_id="$(jq -er '[.[] | select(.name == "Protect release tags" and .target == "tag" and .enforcement == "active")] | if length == 1 then .[0].id else error("expected exactly one active Protect release tags ruleset") end' "${rulesets}")"
          gh api "repos/${GITHUB_REPOSITORY}/rulesets/${ruleset_id}" > "${detail}"
          python3 tools/ci/verify_release_ruleset.py "${detail}"

  build:
    name: release-build (${{ matrix.target }})
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out immutable release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
          fetch-depth: 1

      - name: Install Rust toolchain and release target
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target }}

      - name: Build approved CLI binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cargo build --release --locked --package arkst-cli --target "${TARGET}"

      - name: Package deterministic release asset and checksum
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.plan.outputs.version }}
          BINARY: ${{ matrix.binary }}
        run: |
          set -euo pipefail
          python3 tools/ci/package_release_asset.py \
            --binary "target/${TARGET}/release/${BINARY}" \
            --target "${TARGET}" \
            --version "${VERSION}" \
            --output-dir dist

      - name: Upload exact target asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish-release
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out immutable release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
          fetch-depth: 1

      - name: Download all native release assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Reverify contract, live main, tag ruleset, and exact asset set
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 tools/ci/verify_distribution_policy.py
          python3 tools/ci/verify_release_contract.py --tag "${RELEASE_TAG}" --dist dist

          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          tag_sha="$(git rev-parse HEAD)"
          if test "${tag_sha}" != "${main_sha}"; then
            echo "::error::release tag moved away from current main state" >&2
            exit 1
          fi

          rulesets="${RUNNER_TEMP}/release-rulesets.json"
          detail="${RUNNER_TEMP}/release-ruleset.json"
          gh api "repos/${GITHUB_REPOSITORY}/rulesets?per_page=100" > "${rulesets}"
          ruleset_id="$(jq -er '[.[] | select(.name == "Protect release tags" and .target == "tag" and .enforcement == "active")] | if length == 1 then .[0].id else error("expected exactly one active Protect release tags ruleset") end' "${rulesets}")"
          gh api "repos/${GITHUB_REPOSITORY}/rulesets/${ruleset_id}" > "${detail}"
          python3 tools/ci/verify_release_ruleset.py "${detail}"

      - name: Publish GitHub Release once
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::error::GitHub Release ${RELEASE_TAG} already exists; refusing to replace or mutate release assets" >&2
            exit 1
          fi
          gh release create "${RELEASE_TAG}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "Arkst ${VERSION}" \
            --notes "Arkst ${VERSION} native CLI binaries with SHA-256 checksums."
