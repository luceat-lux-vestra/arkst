name: proof-188-library-dispatch

on:
  push:
    branches:
      - proof/188-library-dispatch

permissions:
  contents: write

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Apply bounded product patch
        run: |
          sed -i '0,/expected=2,/s//expected=1,/' .github/proof-188-library-dispatch.py
          python3 .github/proof-188-library-dispatch.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path("crates/arkst-engine/src/evaluator.rs")
          text = p.read_text()
          old = "            resources: None,\n            metadata_defaults: Default::default(),\n"
          new = "            resources: None,\n            loadable_libraries: None,\n            metadata_defaults: Default::default(),\n"
          if text.count(old) != 1:
              raise SystemExit(f"lookup-only context anchor count={text.count(old)}")
          p.write_text(text.replace(old, new))
          PY
          cargo fmt --all
          git diff --check
          git rm .github/workflows/proof-188-library-dispatch.yml .github/proof-188-library-dispatch.py
      - name: Validate exact patched tree
        run: |
          cargo test --locked -p arkst-project --test loadable_library_registry
          cargo test --locked -p arkst-engine --test loadable_library_dispatch
          cargo test --locked -p arkst-engine --test resource_contract
          cargo test --locked -p arkst-core --test loadable_library_compile
          cargo test --locked -p arkst-core --test engine_facade
          cargo clippy --locked -p arkst-project -p arkst-engine -p arkst-core --all-targets --all-features -- -D warnings
          git diff --check
      - name: Commit proven product tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "compat(resource): dispatch loadable libraries before files"
          git push origin HEAD:proof/188-library-dispatch
