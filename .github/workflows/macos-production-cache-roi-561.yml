name: macOS production cache ROI 561

on:
  push:
    branches:
      - exp/561-production-macos-cache-roi
    paths:
      - .github/workflows/macos-production-cache-roi-561.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arkst-561-production-cache-roi-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  RUSTFLAGS: "-D warnings"
  RUSTUP_TOOLCHAIN: 1.98.0
  SOURCE_SHA: 07a9d478ae433b5e040f325b0fa231647b02150b

jobs:
  prime:
    name: producer ${{ matrix.variant }}
    runs-on: macos-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        variant: [A, B]

    env:
      VARIANT: ${{ matrix.variant }}

    steps:
      - name: Check out research harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify harness and source authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          changed="$(git diff --name-only "$SOURCE_SHA..$GITHUB_SHA")"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l | tr -d ' ')" -eq 1
          test "$changed" = ".github/workflows/macos-production-cache-roi-561.yml"
          git diff --check "$SOURCE_SHA..$GITHUB_SHA" -- .github/workflows/macos-production-cache-roi-561.yml
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0

      - name: Install Typst 0.15.1
        uses: typst-community/setup-typst@9107b8dd77d7a7fd6c5faebbb507cac28069042e
        with:
          typst-version: 0.15.1

      - name: Create producer evidence directory
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/arkst-561-producer-$VARIANT"
          mkdir -p "$evidence"
          echo "ARKST_561_EVIDENCE=$evidence" >> "$GITHUB_ENV"

      - name: Configure current Rust cache policy
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: 561-producer-${{ matrix.variant }}-${{ github.sha }}

      - name: Prime default CLI feature boundary
        run: cargo test --locked -p arkst-cli --no-default-features

      - name: Prime Typst-required workspace
        env:
          ARKST_REQUIRE_TYPST: "1"
        run: cargo test --locked --workspace --all-targets --all-features

      - name: Measure extra targeted prime for B
        if: ${{ matrix.variant == 'B' }}
        shell: bash
        env:
          ARKST_REQUIRE_TYPST: "1"
        run: |
          set -euo pipefail
          start_ns="$(python3 -c 'import time; print(time.monotonic_ns())')"
          cargo test --locked -p arkst-typst-inprocess --all-features \
            --test backend_parity --no-run
          end_ns="$(python3 -c 'import time; print(time.monotonic_ns())')"
          elapsed_ms=$(( (end_ns - start_ns) / 1000000 ))
          printf '%s\n' "$elapsed_ms" | tee "$ARKST_561_EVIDENCE/extra-prime-ms.txt"
          echo "ARKST_561_EXTRA_PRIME variant=B elapsed_ms=$elapsed_ms"

      - name: Record zero extra prime for A
        if: ${{ matrix.variant == 'A' }}
        shell: bash
        run: |
          set -euo pipefail
          printf '0\n' | tee "$ARKST_561_EVIDENCE/extra-prime-ms.txt"
          echo "ARKST_561_EXTRA_PRIME variant=A elapsed_ms=0"

      - name: Record producer target size
        shell: bash
        run: |
          set -euo pipefail
          du -sk target | tee "$ARKST_561_EVIDENCE/target-kib.txt"

      - name: Upload producer evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: arkst-561-producer-${{ matrix.variant }}-${{ github.run_id }}
          path: ${{ runner.temp }}/arkst-561-producer-${{ matrix.variant }}
          if-no-files-found: error
          retention-days: 30

  consume:
    name: consumer ${{ matrix.variant }} / rep ${{ matrix.rep }}
    needs: [prime]
    runs-on: macos-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        variant: [A, B]
        rep: [1, 2]

    env:
      VARIANT: ${{ matrix.variant }}
      REP: ${{ matrix.rep }}

    steps:
      - name: Check out research harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify harness and source authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          changed="$(git diff --name-only "$SOURCE_SHA..$GITHUB_SHA")"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l | tr -d ' ')" -eq 1
          test "$changed" = ".github/workflows/macos-production-cache-roi-561.yml"
          git diff --check "$SOURCE_SHA..$GITHUB_SHA" -- .github/workflows/macos-production-cache-roi-561.yml
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0

      - name: Install Typst 0.15.1
        uses: typst-community/setup-typst@9107b8dd77d7a7fd6c5faebbb507cac28069042e
        with:
          typst-version: 0.15.1

      - name: Create consumer evidence directory
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/arkst-561-$VARIANT-$REP"
          mkdir -p "$evidence"
          echo "ARKST_561_EVIDENCE=$evidence" >> "$GITHUB_ENV"

      - name: Mark restore start
        shell: bash
        run: |
          set -euo pipefail
          start_ns="$(python3 -c 'import time; print(time.monotonic_ns())')"
          echo "ARKST_561_RESTORE_START_NS=$start_ns" >> "$GITHUB_ENV"

      - name: Restore producer cache
        id: cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: 561-producer-${{ matrix.variant }}-${{ github.sha }}
          save-if: false

      - name: Measure restore
        shell: bash
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          end_ns="$(python3 -c 'import time; print(time.monotonic_ns())')"
          elapsed_ms=$(( (end_ns - ARKST_561_RESTORE_START_NS) / 1000000 ))
          printf '%s\n' "$elapsed_ms" > "$ARKST_561_EVIDENCE/restore-ms.txt"
          printf '%s\n' "$CACHE_HIT" > "$ARKST_561_EVIDENCE/cache-hit.txt"
          echo "ARKST_561_RESTORE variant=$VARIANT rep=$REP cache_hit=$CACHE_HIT elapsed_ms=$elapsed_ms"

      - name: Run production default CLI test
        shell: bash
        run: |
          set -euo pipefail
          start_ns="$(python3 -c 'import time; print(time.monotonic_ns())')"
          cargo test --locked -p arkst-cli --no-default-features \
            > "$ARKST_561_EVIDENCE/default-cli.log" 2>&1
          end_ns="$(python3 -c 'import time; print(time.monotonic_ns())')"
          elapsed_ms=$(( (end_ns - start_ns) / 1000000 ))
          printf '%s\n' "$elapsed_ms" > "$ARKST_561_EVIDENCE/default-cli-ms.txt"
          echo "ARKST_561_DEFAULT variant=$VARIANT rep=$REP elapsed_ms=$elapsed_ms"

      - name: Run production Typst-required workspace test
        shell: bash
        env:
          ARKST_REQUIRE_TYPST: "1"
        run: |
          set -euo pipefail
          start_ns="$(python3 -c 'import time; print(time.monotonic_ns())')"
          cargo test --locked --workspace --all-targets --all-features \
            --message-format=json-render-diagnostics \
            > "$ARKST_561_EVIDENCE/workspace.jsonl" \
            2> "$ARKST_561_EVIDENCE/workspace.stderr"
          end_ns="$(python3 -c 'import time; print(time.monotonic_ns())')"
          elapsed_ms=$(( (end_ns - start_ns) / 1000000 ))
          printf '%s\n' "$elapsed_ms" > "$ARKST_561_EVIDENCE/workspace-ms.txt"
          echo "ARKST_561_WORKSPACE variant=$VARIANT rep=$REP elapsed_ms=$elapsed_ms"

      - name: Analyze production consumer
        shell: bash
        run: |
          set -euo pipefail
          end_ns="$(python3 -c 'import time; print(time.monotonic_ns())')"
          total_ms=$(( (end_ns - ARKST_561_RESTORE_START_NS) / 1000000 ))
          printf '%s\n' "$total_ms" > "$ARKST_561_EVIDENCE/consumer-total-ms.txt"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          e = Path(os.environ["ARKST_561_EVIDENCE"])

          rows = []
          for line in (e / "workspace.jsonl").read_text(errors="replace").splitlines():
              try:
                  obj = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if obj.get("reason") != "compiler-artifact":
                  continue
              target = obj.get("target") or {}
              package_id = str(obj.get("package_id", ""))
              if "typst-library" in package_id or target.get("name") == "typst_library":
                  rows.append({
                      "package_id": package_id,
                      "target_name": target.get("name"),
                      "fresh": obj.get("fresh"),
                      "features": obj.get("features"),
                      "profile": obj.get("profile"),
                      "filenames": obj.get("filenames"),
                  })

          result = {
              "variant": os.environ["VARIANT"],
              "rep": int(os.environ["REP"]),
              "cache_hit": (e / "cache-hit.txt").read_text().strip(),
              "restore_ms": int((e / "restore-ms.txt").read_text().strip()),
              "default_cli_ms": int((e / "default-cli-ms.txt").read_text().strip()),
              "workspace_ms": int((e / "workspace-ms.txt").read_text().strip()),
              "consumer_total_ms": int((e / "consumer-total-ms.txt").read_text().strip()),
              "typst_library_artifacts": rows,
          }

          (e / "summary.json").write_text(json.dumps(result, indent=2, sort_keys=True) + "\n")
          print("ARKST_561_SUMMARY=" + json.dumps({
              "variant": result["variant"],
              "rep": result["rep"],
              "cache_hit": result["cache_hit"],
              "restore_ms": result["restore_ms"],
              "default_cli_ms": result["default_cli_ms"],
              "workspace_ms": result["workspace_ms"],
              "consumer_total_ms": result["consumer_total_ms"],
              "typst_library_fresh": [row["fresh"] for row in rows],
              "typst_library_count": len(rows),
          }, sort_keys=True))
          PY

      - name: Upload consumer evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: arkst-561-${{ matrix.variant }}-${{ matrix.rep }}-${{ github.run_id }}
          path: ${{ runner.temp }}/arkst-561-${{ matrix.variant }}-${{ matrix.rep }}
          if-no-files-found: error
          retention-days: 30
