name: Markdown compatibility

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/scribium-markdown/**"
      - "crates/scribium-core/**"
      - "crates/scribium-typst/**"
      - "tools/markdown-compat/**"
      - "tests/compat/**"
      - "fixtures/markdown/real/**"
      - "docs/compatibility/markdown/**"
      - ".github/workflows/markdown-compat.yml"
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/scribium-markdown/**"
      - "crates/scribium-core/**"
      - "crates/scribium-typst/**"
      - "tools/markdown-compat/**"
      - "tests/compat/**"
      - "fixtures/markdown/real/**"
      - "docs/compatibility/markdown/**"
      - ".github/workflows/markdown-compat.yml"

permissions:
  contents: read

concurrency:
  group: markdown-compat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown-compat:
    name: markdown-compat
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot
        with:
          toolchain: 1.98.0
      - uses: typst-community/setup-typst@9107b8dd77d7a7fd6c5faebbb507cac28069042e # v5
        with:
          typst-version: 0.15.1

      - name: Prepare pinned CommonMark and cmark-gfm references
        id: references
        run: |
          python3 tools/markdown-compat/prepare_references.py \
            --config tests/compat/references.toml \
            --output-dir "$RUNNER_TEMP/markdown-compat-references" \
            --github-output "$GITHUB_OUTPUT"

      - name: Build pinned cmark-gfm
        run: |
          cmake -S "${{ steps.references.outputs.cmark_gfm_root }}" \
            -B "${{ steps.references.outputs.cmark_gfm_root }}/build" \
            -DCMARK_TESTS=OFF \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build "${{ steps.references.outputs.cmark_gfm_root }}/build" \
            --target cmark-gfm --parallel

      - name: Build pinned CommonMark cmark
        run: |
          cmake -S "${{ steps.references.outputs.cmark_root }}" \
            -B "${{ steps.references.outputs.cmark_root }}/build" \
            -DCMARK_TESTS=OFF \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build "${{ steps.references.outputs.cmark_root }}/build" \
            --target cmark_exe --parallel

      - name: Verify checked-in specification corpora
        run: |
          python3 tools/markdown-compat/extract_corpus.py \
            --spec "${{ steps.references.outputs.commonmark_spec }}" \
            --prefix commonmark \
            --output "$RUNNER_TEMP/commonmark.json"
          python3 tools/markdown-compat/extract_corpus.py \
            --spec "${{ steps.references.outputs.cmark_gfm_spec }}" \
            --prefix gfm \
            --output "$RUNNER_TEMP/gfm.json"
          cmp tests/compat/corpus/commonmark.json "$RUNNER_TEMP/commonmark.json"
          cmp tests/compat/corpus/gfm.json "$RUNNER_TEMP/gfm.json"

      - name: Run differential corpus and PDF smoke harness
        run: |
          cargo run --locked -q -p scribium-markdown-compat -- \
            --commonmark-cmark "${{ steps.references.outputs.cmark_root }}/build/src/cmark" \
            --gfm-cmark "${{ steps.references.outputs.cmark_gfm_root }}/build/src/cmark-gfm" \
            --output-dir "$RUNNER_TEMP/markdown-compat-report" \
            --typst typst

      - name: Upload Markdown compatibility artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: markdown-compat-${{ github.run_id }}
          path: ${{ runner.temp }}/markdown-compat-report
          if-no-files-found: error
