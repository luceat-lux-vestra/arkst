name: Markdown compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: markdown-compat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine compatibility scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git fetch --no-tags --quiet origin "${BASE_SHA}" "${HEAD_SHA}"
            python3 tools/ci/verify_gate_policy.py compatibility-scope \
              --base-sha "${BASE_SHA}" \
              --head-sha "${HEAD_SHA}" \
              --github-output "${GITHUB_OUTPUT}"
          else
            echo "relevant=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: No-op compatibility gate
        if: steps.scope.outputs.relevant != 'true'
        run: echo "No compatibility-affecting files changed; compatibility campaign not applicable."

      - if: steps.scope.outputs.relevant == 'true'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot
        with:
          toolchain: 1.98.0

      - if: steps.scope.outputs.relevant == 'true'
        uses: typst-community/setup-typst@9107b8dd77d7a7fd6c5faebbb507cac28069042e # v5
        with:
          typst-version: 0.15.1

      - name: Prepare pinned CommonMark and cmark-gfm references
        id: references
        if: steps.scope.outputs.relevant == 'true'
        run: |
          python3 tools/markdown-compat/prepare_references.py \
            --config tests/compat/references.toml \
            --output-dir "$RUNNER_TEMP/markdown-compat-references" \
            --github-output "$GITHUB_OUTPUT"

      - name: Build pinned cmark-gfm
        if: steps.scope.outputs.relevant == 'true'
        env:
          CMARK_GFM_ROOT: ${{ steps.references.outputs.cmark_gfm_root }}
        run: |
          cmake -S "$CMARK_GFM_ROOT" \
            -B "$CMARK_GFM_ROOT/build" \
            -DCMARK_TESTS=OFF \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build "$CMARK_GFM_ROOT/build" \
            --target cmark-gfm --parallel

      - name: Build pinned CommonMark cmark
        if: steps.scope.outputs.relevant == 'true'
        env:
          CMARK_ROOT: ${{ steps.references.outputs.cmark_root }}
        run: |
          cmake -S "$CMARK_ROOT" \
            -B "$CMARK_ROOT/build" \
            -DCMARK_TESTS=OFF \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build "$CMARK_ROOT/build" \
            --target cmark_exe --parallel

      - name: Verify checked-in specification corpora
        if: steps.scope.outputs.relevant == 'true'
        env:
          COMMONMARK_SPEC: ${{ steps.references.outputs.commonmark_spec }}
          CMARK_GFM_SPEC: ${{ steps.references.outputs.cmark_gfm_spec }}
        run: |
          python3 tools/markdown-compat/extract_corpus.py \
            --spec "$COMMONMARK_SPEC" \
            --prefix commonmark \
            --output "$RUNNER_TEMP/commonmark.json"
          python3 tools/markdown-compat/extract_corpus.py \
            --spec "$CMARK_GFM_SPEC" \
            --prefix gfm \
            --output "$RUNNER_TEMP/gfm.json"
          cmp tests/compat/corpus/commonmark.json "$RUNNER_TEMP/commonmark.json"
          cmp tests/compat/corpus/gfm.json "$RUNNER_TEMP/gfm.json"

      - name: Run differential corpus and PDF smoke harness
        if: steps.scope.outputs.relevant == 'true'
        env:
          CMARK_ROOT: ${{ steps.references.outputs.cmark_root }}
          CMARK_GFM_ROOT: ${{ steps.references.outputs.cmark_gfm_root }}
        run: |
          cargo run --locked -q -p scribium-markdown-compat -- \
            --commonmark-cmark "$CMARK_ROOT/build/src/cmark" \
            --gfm-cmark "$CMARK_GFM_ROOT/build/src/cmark-gfm" \
            --output-dir "$RUNNER_TEMP/markdown-compat-report" \
            --typst typst

      - name: Upload Markdown compatibility artifacts
        if: always() && steps.scope.outputs.relevant == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: markdown-compat-${{ github.run_id }}
          path: ${{ runner.temp }}/markdown-compat-report
          if-no-files-found: error
