name: Windows test debug0 benchmark 548

on:
  push:
    branches:
      - exp/548-windows-test-debug0
    paths:
      - .github/workflows/windows-test-debug0-548.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arkst-548-windows-test-debug0-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  RUSTFLAGS: "-D warnings"
  RUSTUP_TOOLCHAIN: 1.98.0
  SOURCE_SHA: 0dfc076e3f995af5cd38549927f2fdb1a4d690e2

jobs:
  prime:
    name: producer ${{ matrix.variant }}
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        variant: [A, B]

    steps:
      - name: Check out exact protected-main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Verify source authority
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ((git rev-parse HEAD).Trim() -ne $env:SOURCE_SHA) { throw "source authority mismatch" }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw "source worktree dirty" }

      - name: Configure candidate test profile
        if: ${{ matrix.variant == 'B' }}
        shell: pwsh
        run: |
          "CARGO_PROFILE_TEST_DEBUG=0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot
        with:
          toolchain: 1.98.0

      - name: Install Typst 0.15.1
        uses: typst-community/setup-typst@9107b8dd77d7a7fd6c5faebbb507cac28069042e # v5
        with:
          typst-version: 0.15.1

      - name: Record producer identity
        shell: pwsh
        run: |
          Write-Host "variant=${{ matrix.variant }}"
          Write-Host "CARGO_PROFILE_TEST_DEBUG=$env:CARGO_PROFILE_TEST_DEBUG"
          Write-Host "ImageOS=$env:ImageOS"
          Write-Host "ImageVersion=$env:ImageVersion"
          Write-Host "RUNNER_ARCH=$env:RUNNER_ARCH"
          rustc -Vv
          cargo -V
          typst --version

      - name: Prime variant target cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: 548-${{ matrix.variant }}-windows-${{ github.sha }}

      - name: Prime default CLI feature boundary
        run: cargo test --locked -p arkst-cli --no-default-features

      - name: Prime Typst-required workspace
        run: cargo test --locked --workspace --all-targets --all-features
        env:
          ARKST_REQUIRE_TYPST: "1"

      - name: Capture target footprint
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $evidence = Join-Path $env:RUNNER_TEMP "arkst-548-producer-${{ matrix.variant }}"
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null

          $all = @(Get-ChildItem -Path "target" -Recurse -File)
          $pdb = @($all | Where-Object { $_.Extension -ieq ".pdb" })
          $exe = @($all | Where-Object { $_.Extension -ieq ".exe" })
          $dll = @($all | Where-Object { $_.Extension -ieq ".dll" })

          [ordered]@{
            variant = "${{ matrix.variant }}"
            cargo_profile_test_debug = $env:CARGO_PROFILE_TEST_DEBUG
            file_count = $all.Count
            total_bytes = [int64](($all | Measure-Object -Property Length -Sum).Sum)
            pdb_count = $pdb.Count
            pdb_bytes = [int64](($pdb | Measure-Object -Property Length -Sum).Sum)
            exe_count = $exe.Count
            exe_bytes = [int64](($exe | Measure-Object -Property Length -Sum).Sum)
            dll_count = $dll.Count
            dll_bytes = [int64](($dll | Measure-Object -Property Length -Sum).Sum)
          } | ConvertTo-Json | Set-Content -Path (Join-Path $evidence "target-footprint.json") -Encoding utf8

          Get-Content -Raw (Join-Path $evidence "target-footprint.json")

      - name: Upload producer footprint
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arkst-548-producer-${{ matrix.variant }}-${{ github.run_id }}
          path: ${{ runner.temp }}/arkst-548-producer-${{ matrix.variant }}
          if-no-files-found: error
          retention-days: 30

  benchmark:
    name: benchmark ${{ matrix.variant }} / rep ${{ matrix.rep }}
    needs: [prime]
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        variant: [A, B]
        rep: [1, 2, 3, 4]

    steps:
      - name: Check out exact protected-main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Verify source authority
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ((git rev-parse HEAD).Trim() -ne $env:SOURCE_SHA) { throw "source authority mismatch" }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw "source worktree dirty" }

      - name: Configure candidate test profile
        if: ${{ matrix.variant == 'B' }}
        shell: pwsh
        run: |
          "CARGO_PROFILE_TEST_DEBUG=0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot
        with:
          toolchain: 1.98.0

      - name: Install Typst 0.15.1
        uses: typst-community/setup-typst@9107b8dd77d7a7fd6c5faebbb507cac28069042e # v5
        with:
          typst-version: 0.15.1

      - name: Record benchmark identity
        shell: pwsh
        run: |
          Write-Host "variant=${{ matrix.variant }}"
          Write-Host "rep=${{ matrix.rep }}"
          Write-Host "CARGO_PROFILE_TEST_DEBUG=$env:CARGO_PROFILE_TEST_DEBUG"
          Write-Host "ImageOS=$env:ImageOS"
          Write-Host "ImageVersion=$env:ImageVersion"
          Write-Host "RUNNER_ARCH=$env:RUNNER_ARCH"
          rustc -Vv
          cargo -V
          typst --version

      - name: Restore variant target cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: 548-${{ matrix.variant }}-windows-${{ github.sha }}
          save-if: false

      - name: Test default CLI feature boundary
        run: cargo test --locked -p arkst-cli --no-default-features

      - name: Test Typst-required workspace
        run: cargo test --locked --workspace --all-targets --all-features
        env:
          ARKST_REQUIRE_TYPST: "1"
