name: CodeQL

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "23 3 * * 4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  analyze:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, rust]
    steps:
      - name: Check out trusted base for Rust scope
        id: trusted_base
        if: matrix.language == 'rust' && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .codeql-trusted-base
          persist-credentials: false

      - name: Classify Rust CodeQL scope
        id: rust_scope
        if: matrix.language == 'rust' && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TRUSTED_BASE_OUTCOME: ${{ steps.trusted_base.outcome }}
        run: |
          set -euo pipefail

          emit_full_scan() {
            echo "rust_impact=true" >> "$GITHUB_OUTPUT"
            echo "reason=$1" >> "$GITHUB_OUTPUT"
          }

          if [ "$TRUSTED_BASE_OUTCOME" != "success" ]; then
            emit_full_scan "trusted-base-checkout-$TRUSTED_BASE_OUTCOME"
            exit 0
          fi

          helper=".codeql-trusted-base/tools/ci/codeql_scope.py"
          if [ ! -f "$helper" ]; then
            emit_full_scan "trusted-base-helper-missing"
            exit 0
          fi

          evidence="$RUNNER_TEMP/codeql-rust-scope"
          mkdir -p "$evidence"

          set +e
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            > "$evidence/meta.json"
          meta_status=$?

          gh api --paginate --slurp \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            > "$evidence/pages.json"
          pages_status=$?
          set -e

          if [ "$meta_status" -ne 0 ] || [ "$pages_status" -ne 0 ]; then
            emit_full_scan "github-api-failure"
            exit 0
          fi

          helper_output="$evidence/github-output.txt"
          set +e
          python3 "$helper" \
            --meta "$evidence/meta.json" \
            --pages "$evidence/pages.json" \
            --output-json "$evidence/result.json" \
            --github-output "$helper_output" \
            > "$evidence/stdout.txt" 2> "$evidence/stderr.txt"
          helper_status=$?
          set -e

          if [ "$helper_status" -ne 0 ] || [ ! -s "$helper_output" ]; then
            emit_full_scan "trusted-base-helper-failure"
            exit 0
          fi

          cat "$helper_output" >> "$GITHUB_OUTPUT"
          cat "$evidence/stdout.txt"

      - name: Checkout repository
        if: matrix.language != 'rust' || github.event_name != 'pull_request' || steps.rust_scope.outputs.rust_impact == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        if: matrix.language != 'rust' || github.event_name != 'pull_request' || steps.rust_scope.outputs.rust_impact == 'true'
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        if: matrix.language != 'rust' || github.event_name != 'pull_request' || steps.rust_scope.outputs.rust_impact == 'true'
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
          # Preserve SARIF upload; omit only the optional CodeQL DB artifact.
          upload-database: false
