name: CodeQL

# PR/push scans are intentionally retired. Manual and weekly scans analyze
# both languages at the exact current protected-main commit.
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact 40-hex protected main SHA to scan"
        required: true
        type: string
  schedule:
    - cron: "23 3 * * 4"

permissions: {}

concurrency:
  group: codeql-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, rust]
    env:
      EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
    steps:
      - name: Verify exact reviewed current-main source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Exact 40-hex source SHA required"; exit 1; }
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "::error::CodeQL evidence must originate on main"; exit 1; }
          [ "$GITHUB_SHA" = "$EXPECTED_SHA" ] || { echo "::error::Event SHA must match candidate"; exit 1; }
          case "$GITHUB_EVENT_NAME" in workflow_dispatch|schedule) ;; *) exit 1 ;; esac
          remote_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [ "$remote_main" = "$EXPECTED_SHA" ] || { echo "::error::Main moved or candidate is stale"; exit 1; }

      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.EXPECTED_SHA }}

      - name: Verify checked-out commit
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Verify SARIF verdict negative controls
        run: python3 .github/scripts/release-codeql-verdict.py --self-test

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze CodeQL
        id: analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:${{ matrix.language }}"
          upload: always
          output: ${{ runner.temp }}/codeql-${{ matrix.language }}

      - name: Retain unaltered per-language SARIF
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-${{ env.EXPECTED_SHA }}-${{ matrix.language }}
          path: ${{ steps.analyze.outputs.sarif-output }}
          if-no-files-found: error
          retention-days: 90

      - name: Validate CodeQL SARIF (fail closed on High/Critical)
        env:
          GH_TOKEN: ${{ github.token }}
          SARIF_DIR: ${{ steps.analyze.outputs.sarif-output }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/release-codeql-verdict.py \
            --sarif-dir "$SARIF_DIR" \
            --language "${{ matrix.language }}" \
            --candidate-sha "$EXPECTED_SHA"
          remote_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [ "$remote_main" = "$EXPECTED_SHA" ] || { echo "::error::Protected main moved during analysis"; exit 1; }
