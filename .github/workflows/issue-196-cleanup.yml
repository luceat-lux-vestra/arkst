name: Temporary issue 196 oracle cleanup

on:
  push:
    branches: [compat/196-localization-semantics]

permissions:
  contents: write

concurrency:
  group: issue-196-oracle-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: compat/196-localization-semantics
          fetch-depth: 0
          persist-credentials: true

      - name: Download exact pinned Temurin 25
        id: jdk
        shell: bash
        run: |
          readarray -t values < <(python3 - <<'PY'
          import tomllib
          from pathlib import Path
          with Path('docs/compatibility/quarkdown/reference-jvm.toml').open('rb') as stream:
              reference = tomllib.load(stream)['reference']
          print(reference['archive_filename'])
          print(reference['archive_url'])
          print(reference['archive_sha256'])
          PY
          )
          archive="$RUNNER_TEMP/${values[0]}"
          curl --fail --location --retry 3 --output "$archive" "${values[1]}"
          printf '%s  %s\n' "${values[2]}" "$archive" | sha256sum --check --strict
          extract_root="$RUNNER_TEMP/temurin25"
          mkdir -p "$extract_root"
          tar --extract --gzip --file "$archive" --directory "$extract_root"
          java="$(find "$extract_root" -path '*/bin/java' -print -quit)"
          test -x "$java"
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"
          printf 'java=%s\n' "$java" >> "$GITHUB_OUTPUT"

      - name: Remove obsolete scalar sigma oracle and verify
        env:
          REFERENCE_JAVA: ${{ steps.jdk.outputs.java }}
          REFERENCE_ARCHIVE: ${{ steps.jdk.outputs.archive }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('crates/arkst-engine/src/builtins.rs')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "        .iter()\n        .any(|&character| character == '\\u{03A3}')",
              "        .contains(&'\\u{03A3}')",
              1,
          )
          text = text.replace(
              '    "df7748b6674398b726fa33f92c98ed9783f292173a257aa3fbb593016c9b38d9";',
              '    "f4809697aa5eaf7e37de92d6eb1fd1fb58994ba85cc223bcd915e4ff4e79094d";',
              1,
          )
          text = text.replace(
              '        simple_titlecase_mapping as unicode_simple_titlecase_mapping, CASED_RECORD_COUNT,\n'
              '        FINAL_SIGMA_CONTEXT_RECORD_COUNT, ORACLE_OUTPUT_SHA256, REFERENCE_JVM_ARCHIVE_SHA256,\n',
              '        simple_titlecase_mapping as unicode_simple_titlecase_mapping, CASED_RECORD_COUNT,\n'
              '        ORACLE_OUTPUT_SHA256, REFERENCE_JVM_ARCHIVE_SHA256,\n',
              1,
          )
          text = text.replace('        let mut final_sigma_context_count = 0;\n', '', 1)
          text, count = re.subn(
              r'''\n                Some\("FINAL_SIGMA"\) => \{.*?\n                    final_sigma_context_count \+= 1;\n                \}''',
              '',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'expected one stale FINAL_SIGMA match arm, got {count}')
          text = text.replace(
              '        assert_eq!(final_sigma_context_count, FINAL_SIGMA_CONTEXT_RECORD_COUNT);\n',
              '',
              1,
          )
          if 'FINAL_SIGMA_CONTEXT_RECORD_COUNT' in text or 'is_final_sigma_context' in text:
              raise SystemExit('stale scalar Final_Sigma test reference remains')
          path.write_text(text, encoding='utf-8')

          generator = Path('tools/generate_jdk25_unicode_case.py')
          source = generator.read_text(encoding='utf-8')
          old = '''pub(crate) fn full_lowercase(character: char) -> [u32; 3] {{\n    lookup_full(character, FULL_LOWERCASE).unwrap_or([character as u32, 0, 0])\n}}'''
          new = '''pub(crate) fn full_lowercase(character: char) -> [u32; 3] {{\n    lookup_full(character, FULL_LOWERCASE)\n        .unwrap_or([simple_lowercase(character) as u32, 0, 0])\n}}'''
          if source.count(old) != 1:
              raise SystemExit('supplementary lowercase generator patch target mismatch')
          generator.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

          python3 tools/cleanup_196.py --java "$REFERENCE_JAVA" --archive "$REFERENCE_ARCHIVE"

      - name: Commit bounded final cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/issue-196-cleanup.yml tools/cleanup_196.py
          git rm -rf --ignore-unmatch tools/__pycache__
          if [ -f cleanup-diagnostic.txt ]; then git rm -f cleanup-diagnostic.txt; fi
          git add -A
          git diff --cached --check
          git commit -m 'fix(stdlib): finalize pinned JVM localization oracle'
          git push origin HEAD:compat/196-localization-semantics
