name: Arkst rename contract fix

on:
  push:
    branches:
      - chore/rename-arkst
    paths:
      - .github/workflows/rename-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chore/rename-arkst
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
      - name: Apply bounded rename fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          # ResourceBundle.Control's baseName is an inert oracle input, not a
          # product identifier. Preserve the pinned helper byte-for-byte here.
          helper = Path("tools/dump_jdk25_locale_oracle.java")
          text = helper.read_text()
          old = 'control.getCandidateLocales("arkst", locale)'
          new = 'control.getCandidateLocales("scribium", locale)'
          assert text.count(old) == 1
          helper.write_text(text.replace(old, new, 1))

          # Restore the pinned helper fingerprint now that the helper is again
          # byte-identical to the established oracle source.
          manifest = Path("docs/compatibility/quarkdown/reference-jvm.toml")
          text = manifest.read_text()
          old = 'locale_public_oracle_helper_source_sha256 = "ef7cc17a016319d90fd0dbd81ab85e291249ef3515ba52aaf3b25335bac2e0e8"'
          new = 'locale_public_oracle_helper_source_sha256 = "80d7c48a4bc1d864e13b0ea4b327f92b6108d5e48f6846f8687e93613f91dc02"'
          assert text.count(old) == 1
          manifest.write_text(text.replace(old, new, 1))

          # Mutation tests must mutate the currently pinned identity rather than
          # embedding a historical fingerprint that goes stale on benign source
          # identity changes.
          tests = Path("tools/ci/test_reference_provenance.py")
          text = tests.read_text()
          old = '''    def test_wrong_generator_identity(self) -> None:
              self.fixture.mutate(
                  "docs/compatibility/quarkdown/reference-jvm.toml",
                  'unicode_generator_source_sha256 = "2277ccc648379577000c6e4395514be0f24fb5dbd1e3062607a916ab8b178e8a"',
                  'unicode_generator_source_sha256 = "' + "0" * 64 + '"',
              )
              self.assert_rejected(self.verify_fixture)

          '''
          new = '''    def test_wrong_generator_identity(self) -> None:
              manifest = verifier.read_toml(
                  self.fixture.root / "docs/compatibility/quarkdown/reference-jvm.toml"
              )
              current = manifest["reference"]["unicode_generator_source_sha256"]
              self.fixture.mutate(
                  "docs/compatibility/quarkdown/reference-jvm.toml",
                  f'unicode_generator_source_sha256 = "{current}"',
                  'unicode_generator_source_sha256 = "' + "0" * 64 + '"',
              )
              self.assert_rejected(self.verify_fixture)

          '''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          old = '''    def test_wrong_helper_identity(self) -> None:
              self.fixture.mutate(
                  "docs/compatibility/quarkdown/reference-jvm.toml",
                  'helper_source_sha256 = "e10e15f92ef6f996ed117e2d5e3d590a01df511abad7ffc583e349f59b76fa47"',
                  'helper_source_sha256 = "' + "0" * 64 + '"',
              )
              self.assert_rejected(self.verify_fixture)

          '''
          new = '''    def test_wrong_helper_identity(self) -> None:
              manifest = verifier.read_toml(
                  self.fixture.root / "docs/compatibility/quarkdown/reference-jvm.toml"
              )
              current = manifest["reference"]["helper_source_sha256"]
              self.fixture.mutate(
                  "docs/compatibility/quarkdown/reference-jvm.toml",
                  f'helper_source_sha256 = "{current}"',
                  'helper_source_sha256 = "' + "0" * 64 + '"',
              )
              self.assert_rejected(self.verify_fixture)

          '''
          assert text.count(old) == 1
          tests.write_text(text.replace(old, new, 1))

          # The source fixture became three bytes shorter (Scribium -> Arkst).
          # Preserve semantic values while updating only source-backed offsets.
          golden = Path("fixtures/quarkdown-conformance/cases/plaintext-family/expected/ir.json")
          data = json.loads(golden.read_text())
          spans = [
              (113, 156),
              (158, 180),
              (182, 205),
              (207, 250),
              (252, 286),
              (288, 313),
          ]
          nodes = data["nodes"]
          assert len(nodes) == 9
          for node, (start, end) in zip(nodes[3:], spans, strict=True):
              paragraph = node["Paragraph"]
              assert len(paragraph["content"]) == 1
              text_node = paragraph["content"][0]["Text"]
              text_node["span"]["start"] = start
              text_node["span"]["end"] = end
              paragraph["span"]["start"] = start
              paragraph["span"]["end"] = end
          golden.write_text(json.dumps(data, indent=2) + "\n")
          PY

      - name: Validate bounded fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci/test_reference_provenance.py
          cargo test -p arkst-test-support --lib --locked
          cargo fmt --all -- --check

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "luceat-lux-vestra"
          git config user.email "heathkimdev@gmail.com"
          git add \
            tools/dump_jdk25_locale_oracle.java \
            docs/compatibility/quarkdown/reference-jvm.toml \
            tools/ci/test_reference_provenance.py \
            fixtures/quarkdown-conformance/cases/plaintext-family/expected/ir.json
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "fix: synchronize Arkst rename evidence"
          git push origin HEAD:chore/rename-arkst
