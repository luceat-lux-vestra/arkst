name: Arkst rename contract fix

on:
  push:
    branches:
      - chore/rename-arkst
    paths:
      - .github/workflows/rename-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chore/rename-arkst
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
      - name: Apply bounded rename fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected exactly one occurrence of {old!r}, got {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          # ResourceBundle.Control baseName is an inert oracle input, not a
          # product identifier. Keep the established helper source unchanged.
          replace_once(
              "tools/dump_jdk25_locale_oracle.java",
              'control.getCandidateLocales("arkst", locale)',
              'control.getCandidateLocales("scribium", locale)',
          )
          replace_once(
              "docs/compatibility/quarkdown/reference-jvm.toml",
              'locale_public_oracle_helper_source_sha256 = "ef7cc17a016319d90fd0dbd81ab85e291249ef3515ba52aaf3b25335bac2e0e8"',
              'locale_public_oracle_helper_source_sha256 = "80d7c48a4bc1d864e13b0ea4b327f92b6108d5e48f6846f8687e93613f91dc02"',
          )

          # Keep mutation tests synchronized with the currently pinned renamed
          # source identities instead of the pre-rename fingerprints.
          replace_once(
              "tools/ci/test_reference_provenance.py",
              'unicode_generator_source_sha256 = "2277ccc648379577000c6e4395514be0f24fb5dbd1e3062607a916ab8b178e8a"',
              'unicode_generator_source_sha256 = "1074fa498101d643fa7e7e7b02623f172b3b6c2fdce13d7d8799ed0a36eeac6f"',
          )
          replace_once(
              "tools/ci/test_reference_provenance.py",
              'helper_source_sha256 = "e10e15f92ef6f996ed117e2d5e3d590a01df511abad7ffc583e349f59b76fa47"',
              'helper_source_sha256 = "b0fb84655d5fb1416dac6df356ebe0ee84c450d319dfe2d805e14434e358fbac"',
          )

          # Scribium -> Arkst shortens this fixture by three bytes. Only the
          # source-backed offsets after that renamed link change.
          golden = Path("fixtures/quarkdown-conformance/cases/plaintext-family/expected/ir.json")
          data = json.loads(golden.read_text())
          spans = [(113,156),(158,180),(182,205),(207,250),(252,286),(288,313)]
          nodes = data["nodes"]
          if len(nodes) != 9:
              raise SystemExit(f"unexpected plaintext-family node count: {len(nodes)}")
          for node, (start, end) in zip(nodes[3:], spans, strict=True):
              paragraph = node["Paragraph"]
              text_node = paragraph["content"][0]["Text"]
              text_node["span"].update(start=start, end=end)
              paragraph["span"].update(start=start, end=end)
          golden.write_text(json.dumps(data, indent=2) + "\n")
          PY

      - name: Validate bounded fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci/test_reference_provenance.py
          cargo test -p arkst-test-support --lib --locked
          cargo fmt --all -- --check

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "luceat-lux-vestra"
          git config user.email "heathkimdev@gmail.com"
          git add \
            tools/dump_jdk25_locale_oracle.java \
            docs/compatibility/quarkdown/reference-jvm.toml \
            tools/ci/test_reference_provenance.py \
            fixtures/quarkdown-conformance/cases/plaintext-family/expected/ir.json
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "fix: synchronize Arkst rename evidence"
          git push origin HEAD:chore/rename-arkst
