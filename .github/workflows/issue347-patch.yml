name: issue347-patch

on:
  push:
    branches:
      - feat/347-typst-output-targets
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: issue347-patch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/347-typst-output-targets
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Apply bounded patches
        run: |
          python3 .github/scripts/issue347_patch.py
          python3 .github/scripts/issue347_callsites.py
      - name: Normalize and verify formatting
        run: |
          cargo fmt --all
          cargo fmt --all --check
      - name: Workspace check
        run: cargo check --workspace --all-targets --all-features --locked
      - name: Diff check
        run: git diff --check
      - name: Commit candidate and remove harness
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(typst): add explicit output target contract"
          git rm .github/scripts/issue347_patch.py .github/scripts/issue347_callsites.py .github/workflows/issue347-patch.yml
          git commit -m "chore: remove temporary #347 patch harness"
          git push origin HEAD:feat/347-typst-output-targets
