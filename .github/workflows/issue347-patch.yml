name: issue347-patch

on:
  push:
    branches:
      - feat/347-typst-output-targets
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: issue347-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/347-typst-output-targets
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Apply bounded patch
        run: python .github/scripts/issue347_patch.py
      - name: Format
        run: cargo fmt --all --check
      - name: Workspace check
        run: cargo check --workspace --all-targets --all-features
      - name: Diff check
        run: git diff --check
      - name: Commit candidate and remove harness
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(typst): add explicit output target contract"
          git rm .github/scripts/issue347_patch.py .github/workflows/issue347-patch.yml
          git commit -m "chore: remove temporary #347 patch harness"
          git push origin HEAD:feat/347-typst-output-targets
