name: Cargo deny prebuilt ARM benchmark 573

on:
  push:
    branches:
      - exp/573-cargo-deny-arm-prebuilt
    paths:
      - .github/workflows/cargo-deny-arm-573.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arkst-573-cargo-deny-arm-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_SHA: 60be072f1343c5d7348ef50c93152f48d71838a6

jobs:
  current-action:
    name: current-action-x64-rep${{ matrix.rep }}
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out research harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact harness scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          changed="$(git diff --name-only "$SOURCE_SHA..$GITHUB_SHA")"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l | tr -d ' ')" -eq 1
          test "$changed" = ".github/workflows/cargo-deny-arm-573.yml"
          git diff --check "$SOURCE_SHA..$GITHUB_SHA" -- .github/workflows/cargo-deny-arm-573.yml

      - name: Switch to protected exact source
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"

      - name: Capture runner identity
        shell: bash
        run: |
          set -euo pipefail
          echo "BENCH_MODE=current-action"
          echo "BENCH_REP=${{ matrix.rep }}"
          echo "RUNNER_ARCH=$RUNNER_ARCH"
          uname -a

      - name: Verify license/provenance engineering invariants
        run: |
          python3 tools/ci/test_verify_license_provenance.py
          python3 tools/ci/verify_license_provenance.py
          python3 tools/ci/verify_license_provenance.py --release

      - name: Workspace cargo-deny via current action
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          command: check
          arguments: --all-features

      - name: Typst spike cargo-deny via current action
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          manifest-path: tools/spikes/typst-in-process/Cargo.toml
          command: check
          arguments: --all-features
          command-arguments: advisories sources

  prebuilt:
    name: prebuilt-${{ matrix.arch }}-rep${{ matrix.rep }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
            triple: x86_64-unknown-linux-musl
            sha256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
            rep: 1
          - arch: x64
            runner: ubuntu-latest
            triple: x86_64-unknown-linux-musl
            sha256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
            rep: 2
          - arch: arm64
            runner: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-musl
            sha256: 995c82be0defc7a025cae49a2aa2644ce8245c9a3318fc4103907c6a285e8c7d
            rep: 1
          - arch: arm64
            runner: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-musl
            sha256: 995c82be0defc7a025cae49a2aa2644ce8245c9a3318fc4103907c6a285e8c7d
            rep: 2
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Check out research harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact harness scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          changed="$(git diff --name-only "$SOURCE_SHA..$GITHUB_SHA")"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l | tr -d ' ')" -eq 1
          test "$changed" = ".github/workflows/cargo-deny-arm-573.yml"
          git diff --check "$SOURCE_SHA..$GITHUB_SHA" -- .github/workflows/cargo-deny-arm-573.yml

      - name: Switch to protected exact source
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0

      - name: Capture runner identity
        shell: bash
        run: |
          set -euo pipefail
          echo "BENCH_MODE=prebuilt"
          echo "BENCH_ARCH=${{ matrix.arch }}"
          echo "BENCH_REP=${{ matrix.rep }}"
          echo "RUNNER_ARCH=$RUNNER_ARCH"
          uname -a
          rustc -Vv

      - name: Install SHA-verified cargo-deny 0.20.2 prebuilt
        shell: bash
        env:
          TARGET_TRIPLE: ${{ matrix.triple }}
          EXPECTED_SHA256: ${{ matrix.sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/cargo-deny-0.20.2-$TARGET_TRIPLE.tar.gz"
          install_dir="$RUNNER_TEMP/cargo-deny-0.20.2"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-$TARGET_TRIPLE.tar.gz" \
            --output "$archive"
          echo "$EXPECTED_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" --strip-components=1
          test -x "$install_dir/cargo-deny"
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/cargo-deny" --version

      - name: Verify license/provenance engineering invariants
        run: |
          python3 tools/ci/test_verify_license_provenance.py
          python3 tools/ci/verify_license_provenance.py
          python3 tools/ci/verify_license_provenance.py --release

      - name: Workspace cargo-deny via prebuilt
        shell: bash
        run: cargo-deny --log-level warn --manifest-path ./Cargo.toml --all-features check

      - name: Typst spike cargo-deny via prebuilt
        shell: bash
        run: cargo-deny --log-level warn --manifest-path tools/spikes/typst-in-process/Cargo.toml --all-features check advisories sources
