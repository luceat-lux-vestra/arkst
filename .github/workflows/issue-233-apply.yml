name: Apply issue 233 distribution contract

on:
  push:
    branches:
      - release/233-github-release-contract
    paths:
      - .github/workflows/issue-233-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/233-github-release-contract
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0

      - name: Apply canonical GitHub Release contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          policy = Path('.github/distribution-policy.toml')
          text = policy.read_text()
          replacements = {
              'decision = "no-current-public-distribution"': 'decision = "github-release-cli"',
              '[channels.github_release]\npublishable = false\npackage = "arkst-cli"\nbinary = "arkst"\ndistribution_status = "not-intended"\npublication_channel = "none"': '[channels.github_release]\npublishable = true\npackage = "arkst-cli"\nbinary = "arkst"\ndistribution_status = "intended"\npublication_channel = "github-releases"',
              'github_release = false\ndistribution_status = "not-intended"': 'github_release = true\ndistribution_status = "intended"',
          }
          for old, new in replacements.items():
              assert text.count(old) == 1, old
              text = text.replace(old, new, 1)
          marker = 'name = "arkst-cli"\nmanifest = "crates/arkst-cli/Cargo.toml"'
          start = text.index(marker)
          end = text.index('[[packages]]', start)
          block = text[start:end]
          assert block.count('distribution_status = "not-intended"') == 1
          assert block.count('publication_channel = "none"') == 1
          block = block.replace('distribution_status = "not-intended"', 'distribution_status = "intended"', 1)
          block = block.replace('publication_channel = "none"', 'publication_channel = "github-releases"', 1)
          text = text[:start] + block + text[end:]
          policy.write_text(text)

          verifier = Path('tools/ci/verify_distribution_policy.py')
          text = verifier.read_text()
          replacements = {
              'CURRENT_DECISION = "no-current-public-distribution"': 'CURRENT_DECISION = "github-release-cli"',
              'ALLOWED_STATUSES = {"internal-only", "not-intended"}': 'ALLOWED_STATUSES = {"intended", "internal-only", "not-intended"}',
              'if _expect_bool(github["publishable"], "policy.channels.github_release.publishable"):\n        raise DistributionPolicyError("policy.channels.github_release.publishable must be false")': 'if not _expect_bool(github["publishable"], "policy.channels.github_release.publishable"):\n        raise DistributionPolicyError("policy.channels.github_release.publishable must be true")',
              '{"not-intended"},\n        "policy.channels.github_release.distribution_status",\n    ) != "not-intended":\n        raise DistributionPolicyError("policy.channels.github_release must be not-intended")': '{"intended"},\n        "policy.channels.github_release.distribution_status",\n    ) != "intended":\n        raise DistributionPolicyError("policy.channels.github_release must be intended")',
              '!= "none"\n    ):\n        raise DistributionPolicyError(\n            "policy.channels.github_release.publication_channel must be none"\n        )': '!= "github-releases"\n    ):\n        raise DistributionPolicyError(\n            "policy.channels.github_release.publication_channel must be github-releases"\n        )',
              'f"policy.decision must be {CURRENT_DECISION!r} while this verifier "\n            "enforces no public distribution"': 'f"policy.decision must be {CURRENT_DECISION!r} while this verifier "\n            "enforces the approved GitHub Release CLI contract"',
              'if _expect_bool(cli["github_release"], "policy.cli.github_release"):\n        raise DistributionPolicyError("policy.cli.github_release must be false")\n    _expect_status(cli["distribution_status"], {"not-intended"}, "policy.cli.distribution_status")': 'if not _expect_bool(cli["github_release"], "policy.cli.github_release"):\n        raise DistributionPolicyError("policy.cli.github_release must be true")\n    _expect_status(cli["distribution_status"], {"intended"}, "policy.cli.distribution_status")',
              'if publication_channel != "none":\n        raise DistributionPolicyError(f"{context}.publication_channel must be none")': 'expected_publication_channel = "github-releases" if distribution == "cli" else "none"\n    if publication_channel != expected_publication_channel:\n        raise DistributionPolicyError(\n            f"{context}.publication_channel must be {expected_publication_channel}"\n        )',
              'expected_status = (\n        "internal-only"\n        if distribution in {"internal-tooling", "test-support"}\n        else "not-intended"\n    )': 'expected_status = (\n        "internal-only"\n        if distribution in {"internal-tooling", "test-support"}\n        else "intended" if distribution == "cli" else "not-intended"\n    )',
              '"distribution policy verified: no-current-public-distribution "': '"distribution policy verified: github-release-cli "',
          }
          for old, new in replacements.items():
              assert text.count(old) == 1, old
              text = text.replace(old, new, 1)
          verifier.write_text(text)

          tests = Path('tools/ci/test_verify_distribution_policy.py')
          text = tests.read_text()
          anchor = '''    def test_accidental_publish_enable_is_rejected_by_cargo_metadata(self) -> None:\n'''
          insert = '''    def test_github_release_cli_contract_is_enabled(self) -> None:\n        policy = mod.load_policy(POLICY)\n        self.assertEqual(policy["decision"], "github-release-cli")\n        self.assertTrue(policy["channels"]["github_release"]["publishable"])\n        self.assertEqual(\n            policy["channels"]["github_release"]["publication_channel"],\n            "github-releases",\n        )\n        self.assertTrue(policy["cli"]["github_release"])\n        self.assertFalse(policy["cli"]["cargo_install"])\n\n    def test_disabling_github_release_contract_is_rejected(self) -> None:\n        policy_text = POLICY.read_text(encoding="utf-8").replace(\n            "[channels.github_release]\\npublishable = true",\n            "[channels.github_release]\\npublishable = false",\n            1,\n        )\n        self.reject(\n            r"policy.channels.github_release.publishable must be true",\n            policy_text=policy_text,\n        )\n\n    def test_cli_wrong_publication_channel_is_rejected(self) -> None:\n        policy_text = self.set_package_field(\n            POLICY.read_text(encoding="utf-8"),\n            "arkst-cli",\n            "publication_channel",\n            '"crates.io"',\n        )\n        self.reject(\n            r"arkst-cli.publication_channel must be github-releases",\n            policy_text=policy_text,\n        )\n\n'''
          assert text.count(anchor) == 1
          text = text.replace(anchor, insert + anchor, 1)
          tests.write_text(text)

          docs = Path('docs/engineering/DISTRIBUTION_POLICY.md')
          docs.write_text('''# Distribution policy\n\n## Current decision\n\nArkst has an approved first public distribution contract for the `arkst` CLI\nbinary from Cargo package `arkst-cli` through GitHub Releases. The intended\nfirst release is `v0.1.0`. This policy approves the artifact/channel contract\nonly; it does not itself add a release workflow, create a tag, or publish a\nrelease.\n\nThe canonical, machine-readable inventory is\n[`../../.github/distribution-policy.toml`](../../.github/distribution-policy.toml).\nIts `[[packages]]` entries remain the complete crate-by-crate decision. Do not\nmaintain a second package inventory in this document.\n\nThe inventory covers all 16 Cargo workspace packages discovered from Cargo\nmetadata: the 14 `crates/*` packages plus `arkst-markdown-compat` and\n`arkst-upstream-watch`.\n\n## Artifact decisions\n\n- `arkst-cli` / binary `arkst` is the sole currently intended public artifact.\n  Its approved channel is GitHub Releases.\n- Cargo registry publication remains disabled. Every workspace manifest keeps\n  `publish = false`; crates.io and public `cargo install` are not part of the\n  current contract.\n- Compiler libraries remain internal toolchain components, `arkst-test-support`\n  remains test-only, and compatibility/upstream-watch tools remain repository\n  tooling.\n- The `wasm32-unknown-unknown` check for `arkst-core` and `arkst-typst` remains\n  a buildability invariant only. No WASM/npm/wasm-bindgen/wasm-pack artifact is\n  approved for distribution.\n\n## Enforcement\n\n`tools/ci/verify_distribution_policy.py` runs Cargo metadata and verifies:\n\n1. the exact workspace package set, manifest paths, versions, target identities,\n   and workspace dependencies against the canonical inventory;\n2. every package's actual Cargo `publish` metadata remains `[]`, which is Cargo's\n   resolved non-publishable form for explicit `publish = false`;\n3. GitHub Releases is enabled only for `arkst-cli` / `arkst`, while crates.io,\n   public `cargo install`, WASM distribution, and internal-tool publication stay\n   disabled; and\n4. the CLI package entry is classified as `intended` through\n   `github-releases`, while all other package classifications remain fail-closed.\n\nThe verifier's tests exercise the production validation path with negative\nmutations for accidental Cargo publication, workspace inventory drift, stale\nentries, GitHub Release contract drift, CLI channel mismatch, omitted internal\ntools, and malformed artifact classification. It remains inside the existing\nrequired `fmt` gate, so this change adds no new required status context.\n\n## Next release gates\n\nThis contract intentionally does not create release machinery. Before the first\n`v0.1.0` release:\n\n1. #235 must establish and verify immutable `refs/tags/v*` protection with no\n   bypass;\n2. #249 must add the narrowly scoped GitHub Release workflow, native artifact\n   matrix, deterministic archive names, and SHA-256 checksums; and\n3. the exact release workflow/tag state must be re-read before the first tag is\n   created.\n\n#234 remains not planned while crates.io/public `cargo install` are deferred.\nAny future registry or WASM distribution proposal must update this canonical\npolicy and its fail-closed verifier in a separately reviewed change.\n''')
          PY

      - name: Validate issue 233 contract
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci/test_verify_distribution_policy.py
          python3 tools/ci/verify_distribution_policy.py
          cargo metadata --format-version 1 --no-deps --locked --offline >/dev/null
          cargo fmt --all -- --check
          git diff --check

      - name: Commit issue 233 implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "luceat-lux-vestra"
          git config user.email "heathkimdev@gmail.com"
          git add .github/distribution-policy.toml tools/ci/verify_distribution_policy.py tools/ci/test_verify_distribution_policy.py docs/engineering/DISTRIBUTION_POLICY.md
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "release: approve Arkst GitHub Release CLI contract"
          git push origin HEAD:release/233-github-release-contract
