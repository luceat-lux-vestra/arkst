name: Security Audit Component

on:
  workflow_call:
    inputs:
      force_failure:
        description: "Force audit failure so the scheduled/manual wrapper can validate owned-issue reporting"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: 1.98.0

jobs:
  audit:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot
        with:
          toolchain: 1.98.0
      - uses: ./.github/actions/cargo-deny-prebuilt
        with:
          command: check
          arguments: --all-features
      - uses: ./.github/actions/cargo-deny-prebuilt
        with:
          manifest-path: tools/spikes/typst-in-process/Cargo.toml
          command: check
          arguments: --all-features
          command-arguments: advisories sources
      - name: Force reporter validation failure
        if: ${{ inputs.force_failure }}
        run: |
          echo "Forcing audit failure to validate scheduled-failure reporting."
          exit 1

