name: Disposable #311 v2.6.0 doclang collision exhaustive

on:
  push:
    branches:
      - proof/311-v260-doclang-snapshot

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Exhaust English-name collision winners twice
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          snapshot_zip="$RUNNER_TEMP/snapshot.zip"
          curl -fsSL -L -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/luceat-lux-vestra/arkst/actions/artifacts/10268667042/zip -o "$snapshot_zip"
          mkdir -p "$RUNNER_TEMP/snapshot"
          unzip -q "$snapshot_zip" -d "$RUNNER_TEMP/snapshot"
          snapshot="$RUNNER_TEMP/snapshot/quarkdown-v2.6.0-doclang-snapshot.tsv"
          printf '%s  %s\n' 'b684f0cd8f6b14537f2857494c967cd73b1a33c9f51938ddcb2fbbcb8525c3a6' "$snapshot" | sha256sum -c --strict

          release="$RUNNER_TEMP/release.json"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/iamgio/quarkdown/releases/tags/v2.6.0 > "$release"
          test "$(jq -r '.tag_name' "$release")" = 'v2.6.0'
          asset='quarkdown-linux-x64.zip'
          url="$(jq -r --arg n "$asset" '.assets[] | select(.name==$n) | .browser_download_url' "$release")"
          digest="$(jq -r --arg n "$asset" '.assets[] | select(.name==$n) | .digest' "$release")"
          test "$digest" = 'sha256:5b015e47c820d06ff6774eb700e60d77bc575819d4a0140cc7f1a115e7ce6dc4'
          zip="$RUNNER_TEMP/$asset"; curl -fsSL "$url" -o "$zip"
          printf '%s  %s\n' "${digest#sha256:}" "$zip" | sha256sum -c --strict
          root="$RUNNER_TEMP/q"; mkdir -p "$root"; unzip -q "$zip" -d "$root"
          q="$(find "$root" -type f -path '*/bin/quarkdown' -print -quit)"; test -n "$q"; chmod +x "$q"
          "$q" --version | grep -F '2.6.0'

          python3 - tools/jdk25_available_locale_order.tsv "$snapshot" "$RUNNER_TEMP/groups.tsv" "$RUNNER_TEMP/mapping.tsv" <<'PY'
          import csv, sys
          from collections import defaultdict
          from pathlib import Path
          manifest,snapshot,out_groups,out_mapping=map(Path,sys.argv[1:])
          canonical=set()
          with manifest.open(encoding='utf-8',newline='') as f:
              for row in csv.reader(f,delimiter='\t'):
                  if row and row[0]: canonical.add(row[0])
          groups=defaultdict(list)
          for line in snapshot.read_text(encoding='utf-8').splitlines():
              tag,ok,name=line.split('\t',2)
              if ok=='1' and tag in canonical:
                  groups[name.casefold()].append((tag,name))
          collisions=[g for g in groups.values() if len(g)>1]
          collisions.sort(key=lambda g:(g[0][1].casefold(),g[0][0]))
          inverse={'he':'iw','id':'in','yi':'ji'}
          alias_count=0
          with out_groups.open('w',encoding='utf-8') as go, out_mapping.open('w',encoding='utf-8') as mo:
              for i,g in enumerate(collisions):
                  name=g[0][1]
                  tags=sorted(tag for tag,_ in g)
                  probe_tags=list(tags)
                  for tag in tags:
                      head,*tail=tag.split('-')
                      if head in inverse:
                          alias='-'.join([inverse[head],*tail])
                          if alias not in probe_tags:
                              probe_tags.append(alias); alias_count += 1
                  probe_tags.sort(key=lambda s:s.encode('utf-8'))
                  assert all(c not in name for c in '{}\t\n')
                  go.write(f'{i}\t{name}\t{"|".join(probe_tags)}\n')
                  for j,tag in enumerate(probe_tags):
                      mo.write(f'{i}\tM{i:04d}_{j:02d}\t{tag}\n')
          print(f'canonical_tags={len(canonical)}')
          print(f'collision_classes={len(collisions)}')
          print(f'legacy_alias_probe_tags={alias_count}')
          assert len(collisions) == 266
          assert alias_count > 0
          PY

          run_collision_probe() {
            label="$1"; base="$RUNNER_TEMP/$label"; cases="$base/cases"
            mkdir -p "$cases"
            python3 - "$RUNNER_TEMP/groups.tsv" "$RUNNER_TEMP/mapping.tsv" "$cases" <<'PY'
          from collections import defaultdict
          from pathlib import Path
          import sys
          groups=[]
          for line in Path(sys.argv[1]).read_text(encoding='utf-8').splitlines():
              i,name,tags=line.split('\t',2); groups.append((int(i),name,tags.split('|')))
          markers=defaultdict(dict)
          for line in Path(sys.argv[2]).read_text(encoding='utf-8').splitlines():
              i,marker,tag=line.split('\t',2); markers[int(i)][tag]=marker
          root=Path(sys.argv[3]); chunk=20
          for start in range(0,len(groups),chunk):
              p=root/f'{start//chunk:03d}'; p.mkdir(parents=True)
              with (p/'main.qd').open('w',encoding='utf-8') as out:
                  out.write('.doctype {plain}\n')
                  for i,name,tags in groups[start:start+chunk]:
                      table=f'probe{i:04d}'
                      out.write(f'.localization {{{table}}}\n')
                      for tag in tags:
                          out.write(f'    - {tag}\n      - winner: {markers[i][tag]}\n')
                      out.write('.doclang {English}\n')
                      out.write(f'.doclang {{{name}}}\n')
                      out.write(f'C{i:04d}-BEGIN .localize {{{table}:winner}} C{i:04d}-END\n')
          PY
            for project in "$cases"/*; do
              chunk="$(basename "$project")"
              set +e
              (cd "$project" && "$q" c main.qd --clean) > "$base/$chunk.stdout" 2> "$base/$chunk.stderr"
              status=$?
              set -e
              printf '%s_chunk_%s_exit=%s\n' "$label" "$chunk" "$status"
              test "$status" -eq 0
              test -d "$project/quarkdown-output"
            done
            python3 - "$RUNNER_TEMP/groups.tsv" "$RUNNER_TEMP/mapping.tsv" "$cases" "$base/winners.tsv" <<'PY'
          from collections import defaultdict
          from html.parser import HTMLParser
          from pathlib import Path
          import re,sys
          groups=[]
          for line in Path(sys.argv[1]).read_text(encoding='utf-8').splitlines():
              i,name,tags=line.split('\t',2); groups.append((int(i),name,tags.split('|')))
          by_case=defaultdict(dict)
          for line in Path(sys.argv[2]).read_text(encoding='utf-8').splitlines():
              i,marker,tag=line.split('\t',2); by_case[int(i)][marker]=tag
          root=Path(sys.argv[3]); out=Path(sys.argv[4]); chunk=20
          class T(HTMLParser):
              def __init__(self): super().__init__(); self.parts=[]
              def handle_data(self,d): self.parts.append(d)
          texts={}
          for p in sorted(root.iterdir()):
              parts=[]
              for html in sorted((p/'quarkdown-output').rglob('*.html')):
                  t=T(); t.feed(html.read_text(encoding='utf-8')); parts.extend(t.parts)
              texts[int(p.name)]=' '.join(' '.join(parts).split())
          winners=[]; missing=[]; invalid=[]
          for pos,(i,name,tags) in enumerate(groups):
              m=re.search(rf'C{i:04d}-BEGIN\s*(.*?)\s*C{i:04d}-END',texts[pos//chunk])
              if not m: missing.append((i,name)); continue
              marker=m.group(1)
              tag=by_case[i].get(marker)
              if tag is None: invalid.append((i,name,marker)); continue
              winners.append((name,tag,'|'.join(tags)))
          print(f'collision_winners={len(winners)}')
          print(f'missing_collision_markers={len(missing)}')
          print(f'invalid_collision_markers={len(invalid)}')
          if missing or invalid:
              raise SystemExit(f'missing={missing[:5]} invalid={invalid[:5]}')
          out.write_text(''.join('\t'.join(r)+'\n' for r in winners),encoding='utf-8')
          PY
            sha256sum "$base/winners.tsv"
          }

          run_collision_probe collision_a
          run_collision_probe collision_b
          cmp --silent "$RUNNER_TEMP/collision_a/winners.tsv" "$RUNNER_TEMP/collision_b/winners.tsv"
          echo 'collision_repeatability=IDENTICAL'
          cp "$RUNNER_TEMP/collision_a/winners.tsv" "$RUNNER_TEMP/quarkdown-v2.6.0-doclang-collision-winners.tsv"
          sha256sum "$RUNNER_TEMP/quarkdown-v2.6.0-doclang-collision-winners.tsv" | tee "$RUNNER_TEMP/collision-winners.sha256"

          python3 - "$RUNNER_TEMP/quarkdown-v2.6.0-doclang-collision-winners.tsv" <<'PY'
          from pathlib import Path
          import sys
          rows={}
          for line in Path(sys.argv[1]).read_text(encoding='utf-8').splitlines():
              name,winner,candidates=line.split('\t',2); rows[name]=(winner,candidates)
          expected={
              'English (United States)':'en-US-POSIX',
              'Chinese (Taiwan)':'zh-Hant-TW',
              'Serbian (Serbia)':'sr-Latn-RS',
              'Arabic':'ar-001',
              'Yiddish (Ukraine)':'ji-UA',
          }
          for name,winner in expected.items():
              actual=rows[name][0]
              print(f'representative\t{name}\t{actual}')
              assert actual == winner, (name,actual,winner)
          print(f'final_collision_classes={len(rows)}')
          assert len(rows) == 266
          PY

      - name: Upload exhaustive collision evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: proof-311-v260-doclang-collision-winners
          path: |
            ${{ runner.temp }}/quarkdown-v2.6.0-doclang-collision-winners.tsv
            ${{ runner.temp }}/collision-winners.sha256
          if-no-files-found: error
          retention-days: 7
