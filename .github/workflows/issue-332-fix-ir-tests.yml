name: Issue 332 IR test fixture repair

on:
  push:
    branches:
      - feat/332-slides-autopagebreak
    paths:
      - .github/workflows/issue-332-fix-ir-tests.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Apply IR fixture repair
        run: |
          set -euo pipefail
          python3 -m py_compile .github/issue-332-fix-ir-tests.py
          python3 .github/issue-332-fix-ir-tests.py
          cargo fmt --all
          git diff --check

      - name: Verify repaired scope
        run: |
          set -euo pipefail
          cargo test --locked -p arkst-ir
          cargo test --locked -p arkst-core --test quarkdown_v260_autopagebreak
          cargo test --locked -p arkst-typst --test auto_page_break
          cargo test --locked -p arkst-typst-inprocess --test auto_page_break -- --nocapture

      - name: Commit repair
        run: |
          set -euo pipefail
          git config user.name 'luceat-lux-vestra'
          git config user.email 'heathkimdev@gmail.com'
          git rm .github/workflows/issue-332-fix-ir-tests.yml .github/issue-332-fix-ir-tests.py
          git add crates/arkst-ir/src/lib.rs
          git diff --cached --check
          git commit -m 'test(compat): repair auto page-break IR fixtures' -m 'Refs #332, #311'
          git push origin HEAD:feat/332-slides-autopagebreak
