name: Issue 332 IR test fixture repair

on:
  push:
    branches:
      - feat/332-slides-autopagebreak
    paths:
      - .github/workflows/issue-332-fix-ir-tests.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Repair explicit IR test fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/arkst-ir/src/lib.rs')
          text = path.read_text()
          needle = '''            caption_position: IrCaptionPositionInfo {
                  default: IrCaptionPosition::Top,
                  figures: Some(IrCaptionPosition::Bottom),
                  tables: None,
                  code_blocks: Some(IrCaptionPosition::Top),
              },
          }'''
          replacement = '''            caption_position: IrCaptionPositionInfo {
                  default: IrCaptionPosition::Top,
                  figures: Some(IrCaptionPosition::Bottom),
                  tables: None,
                  code_blocks: Some(IrCaptionPosition::Top),
              },
              auto_page_break_max_depth: Some(2),
          }'''
          if text.count(needle) != 1:
              raise SystemExit(f'first IR fixture anchor mismatch: {text.count(needle)}')
          text = text.replace(needle, replacement, 1)

          needle = '''        caption_position: IrCaptionPositionInfo {
              default: IrCaptionPosition::Top,
              figures: None,
              tables: Some(IrCaptionPosition::Bottom),
              code_blocks: None,
          },
      };'''
          replacement = '''        caption_position: IrCaptionPositionInfo {
              default: IrCaptionPosition::Top,
              figures: None,
              tables: Some(IrCaptionPosition::Bottom),
              code_blocks: None,
          },
          auto_page_break_max_depth: None,
      };'''
          if text.count(needle) != 1:
              raise SystemExit(f'second IR fixture anchor mismatch: {text.count(needle)}')
          text = text.replace(needle, replacement, 1)
          path.write_text(text)
          PY
          cargo fmt --all
          git diff --check
      - name: Verify repaired IR and auto page-break integration
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p arkst-ir
          cargo test --locked -p arkst-core --test quarkdown_v260_autopagebreak
          cargo test --locked -p arkst-typst --test auto_page_break
          cargo test --locked -p arkst-typst-inprocess --test auto_page_break -- --nocapture
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'luceat-lux-vestra'
          git config user.email 'heathkimdev@gmail.com'
          git rm .github/workflows/issue-332-fix-ir-tests.yml
          git add crates/arkst-ir/src/lib.rs
          git diff --cached --check
          git commit -m 'test(compat): repair auto page-break IR fixtures' -m 'Refs #332, #311'
          git push origin HEAD:feat/332-slides-autopagebreak
