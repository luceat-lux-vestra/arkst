name: Pull request labels

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: label
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ensure managed labels and classify PR type
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const managed = [
              ['type:bug', 'B60205', 'A defect in existing functionality'],
              ['type:feature', '1D76DB', 'A new user-facing capability'],
              ['type:compatibility', '5319E7', 'Compatibility-target work'],
              ['type:research', 'BFDADC', 'Research, audit, or feasibility work'],
              ['type:task', '0E8A16', 'Implementation, maintenance, CI, test, or documentation task'],
              ['area:ci', 'C5DEF5', 'CI/CD and automation'],
              ['area:core', 'C5DEF5', 'Core public/compiler boundary'],
              ['area:engine', 'C5DEF5', 'Evaluator and semantic engine'],
              ['area:parser', 'C5DEF5', 'Markdown and Quarkdown parsing/frontends'],
              ['area:ir', 'C5DEF5', 'Backend-neutral intermediate representation'],
              ['area:diagnostics', 'C5DEF5', 'Diagnostics and source reporting'],
              ['area:typst', 'C5DEF5', 'Typst lowering and native backends'],
              ['area:cli', 'C5DEF5', 'Command-line interface'],
              ['area:project', 'C5DEF5', 'Project/source/resource model'],
              ['area:compatibility', 'C5DEF5', 'Compatibility evidence and conformance'],
              ['area:test', 'C5DEF5', 'Shared test support and fixtures'],
              ['area:legal', 'C5DEF5', 'Licensing and legal notices'],
              ['area:docs', 'EDEDED', 'Documentation'],
              ['dependencies', '0366D6', 'Dependency updates'],
            ];
            for (const [name, color, description] of managed) {
              try {
                const { data } = await github.rest.issues.getLabel({ ...context.repo, name });
                if ((data.description || '') !== description) {
                  await github.rest.issues.updateLabel({ ...context.repo, name, description });
                }
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ ...context.repo, name, color, description });
              }
            }

            const pr = context.payload.pull_request;
            const title = pr.title.trim().toLowerCase();
            let type = null;
            if (/^(fix|bug)(\([^)]*\))?:/.test(title)) type = 'type:bug';
            else if (/^(feat|feature)(\([^)]*\))?:/.test(title)) type = 'type:feature';
            else if (/^compat(\([^)]*\))?:/.test(title)) type = 'type:compatibility';
            else if (/^(research|audit|spike)(\([^)]*\))?:/.test(title)) type = 'type:research';

            const knownTypes = ['type:bug', 'type:feature', 'type:compatibility', 'type:research', 'type:task'];
            async function inheritType(issueNumbers) {
              for (const issueNumber of [...new Set(issueNumbers)].filter(number => number !== pr.number).slice(0, 10)) {
                try {
                  const { data: issue } = await github.rest.issues.get({ ...context.repo, issue_number: issueNumber });
                  const inherited = issue.labels
                    .map(label => typeof label === 'string' ? label : label.name)
                    .find(name => knownTypes.includes(name));
                  if (inherited) return inherited;
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
              }
              return null;
            }

            if (!type) {
              const body = pr.body || '';
              const closingRefs = [...body.matchAll(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi)]
                .map(match => Number(match[1]));
              type = await inheritType(closingRefs);
            }
            if (!type) {
              const terminalTitleRef = pr.title.match(/\(#(\d+)\)\s*$/);
              if (terminalTitleRef) type = await inheritType([Number(terminalTitleRef[1])]);
            }
            if (!type) {
              const referenceText = `${pr.title}\n${pr.body || ''}`;
              const genericRefs = [...referenceText.matchAll(/#(\d+)/g)].map(match => Number(match[1]));
              type = await inheritType(genericRefs);
            }
            type ||= 'type:task';

            const { data: labels } = await github.rest.issues.listLabelsOnIssue({ ...context.repo, issue_number: pr.number, per_page: 100 });
            for (const name of labels.map(x => x.name).filter(x => x.startsWith('type:'))) {
              if (name !== type) await github.rest.issues.removeLabel({ ...context.repo, issue_number: pr.number, name });
            }
            await github.rest.issues.addLabels({ ...context.repo, issue_number: pr.number, labels: [type] });

      - name: Label changed areas
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true
