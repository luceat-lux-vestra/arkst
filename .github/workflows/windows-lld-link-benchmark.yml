name: Windows lld-link paired benchmark

on:
  push:
    branches:
      - exp/524-windows-lld-link-benchmark
    paths:
      - .github/workflows/windows-lld-link-benchmark.yml
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - rust-toolchain.toml
      - .cargo/config.toml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arkst-windows-lld-link-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: paired / replicate ${{ matrix.replicate }} / ${{ matrix.first }}-first
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - replicate: 1
            first: system
            second: lld
          - replicate: 2
            first: lld
            second: system
          - replicate: 3
            first: system
            second: lld
          - replicate: 4
            first: lld
            second: system

    env:
      CARGO_TERM_COLOR: never
      RUSTUP_TOOLCHAIN: 1.98.0
      ARKST_REQUIRE_TYPST: "1"
      SOURCE_SHA: 0dfc076e3f995af5cd38549927f2fdb1a4d690e2
      BENCH_DIR: benchmark-evidence/windows-lld-link-benchmark
      REPLICATE: ${{ matrix.replicate }}
      ORDER_FIRST: ${{ matrix.first }}
      ORDER_SECOND: ${{ matrix.second }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot
        with:
          toolchain: 1.98.0

      - name: Install Typst 0.15.1
        uses: typst-community/setup-typst@9107b8dd77d7a7fd6c5faebbb507cac28069042e # v5
        with:
          typst-version: 0.15.1

      - name: Check exact experiment identity
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) {
            throw "checkout HEAD does not match GITHUB_SHA"
          }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw "worktree is dirty before benchmark" }

          $changed = @(git diff --name-only "$env:SOURCE_SHA..HEAD")
          if ($LASTEXITCODE -ne 0) { throw "cannot diff source authority to experiment HEAD" }
          if ($changed.Count -ne 1 -or $changed[0] -ne ".github/workflows/windows-lld-link-benchmark.yml") {
            throw "research branch must differ from source authority by exactly the benchmark workflow; got: $($changed -join ', ')"
          }
          git diff --check "$env:SOURCE_SHA..HEAD" -- .github/workflows/windows-lld-link-benchmark.yml
          if ($LASTEXITCODE -ne 0) { throw "benchmark workflow diff hygiene failed" }

      - name: Capture environment and verify linker availability
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path $env:BENCH_DIR | Out-Null

          $lld = Get-Command lld-link.exe -ErrorAction Stop
          $lldVersion = (& $lld.Source --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "lld-link --version failed" }

          $lines = @(
            "sha=$env:GITHUB_SHA",
            "source_sha=$env:SOURCE_SHA",
            "replicate=$env:REPLICATE",
            "order=$env:ORDER_FIRST,$env:ORDER_SECOND",
            "runner_os=$env:RUNNER_OS",
            "runner_arch=$env:RUNNER_ARCH",
            "image_os=$env:ImageOS",
            "image_version=$env:ImageVersion",
            "number_of_processors=$env:NUMBER_OF_PROCESSORS",
            "lld_link_path=$($lld.Source)",
            "lld_link_version=$lldVersion",
            "rustc=$((rustc -Vv | Out-String).Trim() -replace "\r?\n", " | ")",
            "cargo=$((cargo -V | Out-String).Trim())",
            "typst=$((typst --version | Out-String).Trim())"
          )
          $lines | Tee-Object -FilePath "$env:BENCH_DIR/environment.txt"

      - name: Build instrumented MSVC linker wrapper
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $source = Join-Path $env:RUNNER_TEMP "arkst-linker-wrapper.rs"
          $wrapper = Join-Path $env:RUNNER_TEMP "arkst-linker-wrapper.exe"
          $timingDir = Join-Path $env:GITHUB_WORKSPACE "$env:BENCH_DIR\linker-invocations"
          New-Item -ItemType Directory -Force -Path $timingDir | Out-Null

          @'
          use std::env;
          use std::fs;
          use std::path::PathBuf;
          use std::process::{self, Command, exit};
          use std::time::{Instant, SystemTime, UNIX_EPOCH};

          fn main() {
              let variant = env::var("ACTIVE_LINKER").expect("ACTIVE_LINKER is required");
              let phase = env::var("LINK_PHASE").unwrap_or_else(|_| "unclassified".to_owned());
              let timing_dir = env::var("LINKER_TIMINGS_DIR").expect("LINKER_TIMINGS_DIR is required");

              let program = match variant.as_str() {
                  "system" => "link.exe",
                  "lld" => "lld-link.exe",
                  other => {
                      eprintln!("unknown linker variant: {other}");
                      exit(97);
                  }
              };

              let args: Vec<_> = env::args_os().skip(1).collect();
              let start = Instant::now();
              let status = Command::new(program)
                  .args(&args)
                  .status()
                  .unwrap_or_else(|e| {
                      eprintln!("failed to execute {program}: {e}");
                      exit(98);
                  });
              let elapsed_ms = start.elapsed().as_secs_f64() * 1000.0;
              let code = status.code().unwrap_or(99);
              let stamp = SystemTime::now()
                  .duration_since(UNIX_EPOCH)
                  .expect("system clock before Unix epoch")
                  .as_nanos();

              let mut path = PathBuf::from(timing_dir);
              path.push(format!("{variant}-{phase}-{}-{stamp}.tsv", process::id()));
              let record = format!("{variant}\t{phase}\t{program}\t{elapsed_ms:.3}\t{code}\n");
              fs::write(&path, record).expect("cannot write linker timing record");

              exit(code);
          }
          '@ | Set-Content -Path $source -Encoding utf8

          rustc $source -o $wrapper
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $wrapper)) {
            throw "failed to build linker wrapper"
          }

          "LINKER_WRAPPER=$wrapper" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LINKER_TIMINGS_DIR=$timingDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prove system and lld linker selections
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $probe = Join-Path $env:RUNNER_TEMP "linker-probe.rs"
          'fn main() { println!("arkst-linker-probe"); }' | Set-Content -Path $probe -Encoding utf8

          foreach ($variant in @("system", "lld")) {
            $env:ACTIVE_LINKER = $variant
            $env:LINK_PHASE = "probe-$variant"
            $output = Join-Path $env:RUNNER_TEMP "linker-probe-$variant.exe"
            rustc -C "linker=$env:LINKER_WRAPPER" $probe -o $output
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path $output)) {
              throw "linker probe failed for $variant"
            }
            $probeOutput = (& $output | Out-String).Trim()
            if ($probeOutput -ne "arkst-linker-probe") {
              throw "runtime probe divergence for ${variant}: $probeOutput"
            }
          }
          Remove-Item Env:LINK_PHASE -ErrorAction SilentlyContinue

          $records = @(Get-ChildItem -Path $env:LINKER_TIMINGS_DIR -File | ForEach-Object { Get-Content $_.FullName })
          $tab = [char]9
          if (-not ($records | Select-String -SimpleMatch ($tab + "probe-system" + $tab + "link.exe" + $tab) -Quiet)) {
            throw "system link.exe invocation was not recorded"
          }
          if (-not ($records | Select-String -SimpleMatch ($tab + "probe-lld" + $tab + "lld-link.exe" + $tab) -Quiet)) {
            throw "lld-link invocation was not recorded"
          }

      - name: Fetch dependencies outside measurement
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo fetch --locked
          if ($LASTEXITCODE -ne 0) { throw "cargo fetch failed" }

      - name: Run paired Final-like and warm-local-change benchmark
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path $env:BENCH_DIR | Out-Null
          $results = Join-Path $env:BENCH_DIR "results.jsonl"

          function Measure-Cargo {
            param(
              [Parameter(Mandatory=$true)][string]$Label,
              [Parameter(Mandatory=$true)][string[]]$CargoArgs
            )

            $env:LINK_PHASE = $Label
            $log = Join-Path $env:BENCH_DIR "$Label.log"
            $sw = [System.Diagnostics.Stopwatch]::StartNew()
            & cargo @CargoArgs 2>&1 | Tee-Object -FilePath $log
            $status = $LASTEXITCODE
            $sw.Stop()
            Remove-Item Env:LINK_PHASE -ErrorAction SilentlyContinue

            [ordered]@{
              sha = $env:GITHUB_SHA
              source_sha = $env:SOURCE_SHA
              linker = $env:ACTIVE_LINKER
              replicate = [int]$env:REPLICATE
              order = @($env:ORDER_FIRST, $env:ORDER_SECOND)
              phase = $Label
              wall_ms = [math]::Round($sw.Elapsed.TotalMilliseconds, 3)
              exit_code = [int]$status
              rustflags = $env:RUSTFLAGS
              target_dir = $env:CARGO_TARGET_DIR
            } | ConvertTo-Json -Compress | Add-Content -Path $results -Encoding utf8

            if ($status -ne 0) {
              throw "cargo phase failed: $Label (exit $status)"
            }
          }

          function Run-Variant {
            param([Parameter(Mandatory=$true)][string]$Variant)

            $env:ACTIVE_LINKER = $Variant
            $env:RUSTFLAGS = "-D warnings -C linker=$env:LINKER_WRAPPER"
            $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP "arkst-524-windows-linker-target-$Variant"

            if (Test-Path $env:CARGO_TARGET_DIR) {
              Remove-Item -Recurse -Force $env:CARGO_TARGET_DIR
            }

            $sourceFile = "crates/arkst-core/src/lib.rs"
            $originalHash = (Get-FileHash -Algorithm SHA256 $sourceFile).Hash

            Measure-Cargo "$Variant-final-default-cli" @(
              "test", "--locked", "-p", "arkst-cli", "--no-default-features"
            )

            Measure-Cargo "$Variant-final-workspace" @(
              "test", "--locked", "--workspace", "--all-targets", "--all-features"
            )

            Add-Content -Path $sourceFile -Value ""
            Add-Content -Path $sourceFile -Value "// paired Windows lld-link benchmark no-op; never committed."
            $changedHash = (Get-FileHash -Algorithm SHA256 $sourceFile).Hash
            if ($changedHash -eq $originalHash) {
              throw "no-op source mutation did not change source hash"
            }

            Measure-Cargo "$Variant-warm-local-change-build-link" @(
              "test", "--locked", "--workspace", "--all-targets", "--all-features", "--no-run"
            )

            Measure-Cargo "$Variant-warm-test-execution" @(
              "test", "--locked", "--workspace", "--all-targets", "--all-features"
            )

            git checkout -- $sourceFile
            if ($LASTEXITCODE -ne 0) { throw "failed to restore source file" }
            $restoredHash = (Get-FileHash -Algorithm SHA256 $sourceFile).Hash
            if ($restoredHash -ne $originalHash) {
              throw "source restoration hash mismatch"
            }
            git diff --exit-code -- $sourceFile
            if ($LASTEXITCODE -ne 0) { throw "source file remains dirty" }

            $bytes = (Get-ChildItem -Path $env:CARGO_TARGET_DIR -Recurse -File | Measure-Object -Property Length -Sum).Sum
            "target_bytes=$bytes" | Set-Content -Path "$env:BENCH_DIR\$Variant-target-size.txt" -Encoding utf8
          }

          Run-Variant $env:ORDER_FIRST
          Run-Variant $env:ORDER_SECOND

          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw "worktree dirty after paired benchmark" }

      - name: Summarize benchmark evidence
        if: ${{ always() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $results = Join-Path $env:BENCH_DIR "results.jsonl"
          $timingDir = Join-Path $env:BENCH_DIR "linker-invocations"

          if (Test-Path $results) {
            "### Arkst Windows lld-link paired benchmark: replicate $env:REPLICATE" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "Order: $env:ORDER_FIRST -> $env:ORDER_SECOND" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "~~~json" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            Get-Content $results | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "~~~" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

          if (Test-Path $timingDir) {
            $records = @()
            $tab = [char]9
            foreach ($file in Get-ChildItem -Path $timingDir -File) {
              foreach ($line in Get-Content $file.FullName) {
                $parts = $line.Split($tab)
                if ($parts.Count -ne 5) {
                  throw "malformed linker timing record in $($file.Name): $line"
                }
                $records += [pscustomobject]@{
                  linker = $parts[0]
                  phase = $parts[1]
                  program = $parts[2]
                  elapsed_ms = [double]$parts[3]
                  exit_code = [int]$parts[4]
                }
              }
            }

            $failed = @($records | Where-Object { $_.exit_code -ne 0 })
            if ($failed.Count -gt 0) {
              throw "linker invocation failures were recorded"
            }
            if (@($records | Where-Object { [string]::IsNullOrWhiteSpace($_.linker) -or [string]::IsNullOrWhiteSpace($_.phase) }).Count -gt 0) {
              throw "blank linker timing identity recorded"
            }

            $summary = @()
            foreach ($group in ($records | Group-Object linker, phase)) {
              $values = @($group.Group.elapsed_ms | Sort-Object)
              if ($values.Count -eq 0) { continue }
              $median = if ($values.Count % 2 -eq 1) {
                $values[[int][math]::Floor($values.Count / 2)]
              } else {
                ($values[$values.Count / 2 - 1] + $values[$values.Count / 2]) / 2
              }
              $summary += [pscustomobject]@{
                linker = $group.Group[0].linker
                phase = $group.Group[0].phase
                count = $values.Count
                total_linker_wall_ms = [math]::Round((($values | Measure-Object -Sum).Sum), 3)
                median_linker_wall_ms = [math]::Round($median, 3)
                max_linker_wall_ms = [math]::Round((($values | Measure-Object -Maximum).Maximum), 3)
                min_linker_wall_ms = [math]::Round((($values | Measure-Object -Minimum).Minimum), 3)
              }
            }
            $summary | ConvertTo-Json -Depth 5 | Set-Content -Path "$env:BENCH_DIR\linker-summary.json" -Encoding utf8
          }

      - name: Retain benchmark evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arkst-windows-lld-link-paired-replicate-${{ matrix.replicate }}
          path: benchmark-evidence/windows-lld-link-benchmark
          if-no-files-found: error
          retention-days: 30
