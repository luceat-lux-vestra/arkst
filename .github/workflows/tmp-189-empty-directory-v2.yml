name: tmp-189-empty-directory-v2

on:
  push:
    branches:
      - compat/189-empty-directory-identity-proof

permissions:
  contents: write

jobs:
  patch-and-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
