                  assets: AssetStore,
                  directories: BTreeSet<VirtualPathBuf>,
                  metadata: ProjectMetadata,
                  loadable_libraries: BTreeMap<String, LoadableLibrary>,
                  library_names_by_source_id: BTreeMap<u32, String>,
