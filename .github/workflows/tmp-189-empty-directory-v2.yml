                  path: impl AsRef<str>,
              ) -> Result<Self, VirtualPathError> {
                  let path = VirtualPathBuf::parse(path)?;
                  if path.is_root() {
                      return Err(VirtualPathError::RootPathNotAllowed);
                  }
