name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  dev-page-geometry:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply dev patch stored in probe workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'RUNNER'
          from pathlib import Path
          text = Path('.github/workflows/_v260_dev_probe.yml').read_text()
          marker = "python3 <<'PY'\n"
          if marker not in text:
              raise SystemExit('embedded patch script marker missing')
          raw = text.split(marker, 1)[1].split('\n          PY', 1)[0]
          lines = []
          for line in raw.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          block = '\n'.join(lines) + '\n'
          exec(compile(block, '_v260_dev_probe.yml', 'exec'))
          RUNNER
          cargo fmt --all
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/arkst-ir/src/lib.rs crates/arkst-engine/src/evaluator.rs crates/arkst-typst/src/lowering.rs crates/arkst-typst/src/focus_lowering.rs
          if ! git diff --cached --quiet; then
            git commit -m 'feat(compat): add typed complete page geometry'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
          cargo check --workspace --all-targets --locked
