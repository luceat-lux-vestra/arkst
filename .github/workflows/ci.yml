name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUSTUP_TOOLCHAIN: 1.98.0

permissions:
  actions: read # Needed to inspect the canonical exact-SHA Fast workflow run.
  contents: read
  pull-requests: read # Needed to classify the complete changed-file set fail-closed.

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: docs-only-scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: Classify documentation-only scope from trusted base
        id: classify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_COUNT: ${{ github.event.pull_request.changed_files }}
        run: |
          set -uo pipefail
          docs_only=false

          if ! [[ "$EXPECTED_COUNT" =~ ^[1-9][0-9]*$ ]]; then
            echo "::warning::Changed-file count is empty or malformed; using full validation."
          else
            tmp="$(mktemp -d)"
            trap 'rm -rf "$tmp"' EXIT

            if ! gh api -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/contents/.github/scripts/docs-only-scope.py?ref=$BASE_SHA" \
              --jq '.content' | tr -d '\n' | base64 --decode > "$tmp/classifier.py"; then
              echo "::warning::Trusted-base docs-only classifier is unavailable; using full validation."
            elif ! gh api -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/contents/.github/gate-policy.toml?ref=$BASE_SHA" \
              --jq '.content' | tr -d '\n' | base64 --decode > "$tmp/gate-policy.toml"; then
              echo "::warning::Trusted-base merge-gate policy is unavailable; using full validation."
            elif ! python3 "$tmp/classifier.py" --policy "$tmp/gate-policy.toml" --self-test >/dev/null; then
              echo "::warning::Trusted-base docs-only classifier self-test failed; using full validation."
            elif ! gh api --paginate -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
              --jq '.[] | [.status, .filename, (.previous_filename // "")] | @tsv' > "$tmp/files"; then
              echo "::warning::Changed-file API read failed; using full validation."
            else
              result="$(python3 "$tmp/classifier.py" \
                --policy "$tmp/gate-policy.toml" \
                --expected-count "$EXPECTED_COUNT" \
                < "$tmp/files" 2>"$tmp/classifier.err")"
              status=$?
              if [ "$status" -eq 0 ] && { [ "$result" = "true" ] || [ "$result" = "false" ]; }; then
                docs_only="$result"
              else
                echo "::warning::Docs-only classifier failed or returned invalid output; using full validation."
                cat "$tmp/classifier.err" >&2 || true
              fi
            fi
          fi

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs-only fast path: $docs_only"

  fmt:
    name: fmt
    needs: [scope]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve exact-SHA Fast evidence
        id: fast-evidence
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false && needs.scope.outputs.docs_only != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_JOB: fast
          SAME_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          if [ "$SAME_REPOSITORY" != "true" ]; then
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            echo "Fork PR has no trusted base-repository branch Fast run; Final will execute the local checks."
            exit 0
          fi

          base_workflow_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/fast-branch.yml?ref=$BASE_SHA" --jq '.sha')"
          head_workflow_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/fast-branch.yml?ref=$EXPECTED_SHA" --jq '.sha')"
          if [ "$base_workflow_sha" != "$head_workflow_sha" ]; then
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            echo "Fast producer workflow changed on this PR; Final will execute the local checks instead of trusting self-modified evidence."
            exit 0
          fi

          for _ in $(seq 1 60); do
            runs="$(gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/workflows/fast-branch.yml/runs?event=push&head_sha=$EXPECTED_SHA&per_page=100")"
            latest="$(jq -c --arg sha "$EXPECTED_SHA" '
              [.workflow_runs[]
               | select(.head_sha == $sha and .event == "push")]
              | if length == 0 then empty else max_by(.id) end
            ' <<<"$runs")"
            if [ -z "$latest" ]; then
              sleep 5
              continue
            fi

            status="$(jq -r '.status' <<<"$latest")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$latest")"
            if [ "$status" != "completed" ]; then
              sleep 5
              continue
            fi
            if [ "$conclusion" != "success" ]; then
              echo "::error::Canonical Fast workflow for exact HEAD $EXPECTED_SHA concluded '$conclusion'; classify/remediate it instead of overwriting it in Final."
              exit 1
            fi

            run_id="$(jq -r '.id' <<<"$latest")"
            jobs="$(gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=latest&per_page=100")"
            matching_jobs="$(jq --arg name "$EXPECTED_JOB" '[.jobs[] | select(.name == $name)] | length' <<<"$jobs")"
            if [ "$matching_jobs" != "1" ]; then
              echo "::error::Canonical Fast run $run_id must contain exactly one '$EXPECTED_JOB' job; found $matching_jobs."
              exit 1
            fi
            job_status="$(jq -r --arg name "$EXPECTED_JOB" '.jobs[] | select(.name == $name) | .status' <<<"$jobs")"
            job_conclusion="$(jq -r --arg name "$EXPECTED_JOB" '.jobs[] | select(.name == $name) | (.conclusion // "")' <<<"$jobs")"
            if [ "$job_status" != "completed" ] || [ "$job_conclusion" != "success" ]; then
              echo "::error::Canonical Fast job for exact HEAD $EXPECTED_SHA is not completed/success (status=$job_status conclusion=$job_conclusion)."
              exit 1
            fi

            echo "reuse=true" >> "$GITHUB_OUTPUT"
            echo "Reusing canonical successful Fast workflow evidence for exact HEAD $EXPECTED_SHA."
            exit 0
          done
          echo "::error::Timed out waiting for canonical exact-SHA Fast evidence at $EXPECTED_SHA; refusing duplicate fallback on a same-repository PR."
          exit 1
      - name: Draft final-gate placeholder
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: echo "full required-context validation is deferred until the pull request is ready for review"
      - name: Documentation-only fast path
        if: ${{ github.event.pull_request.draft == false && needs.scope.outputs.docs_only == 'true' }}
        run: echo "Trusted-base classification proved documentation-only scope; heavy product validation is not applicable."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.scope.outputs.docs_only != 'true' }}
        with:
          persist-credentials: false
      - name: Test docs-only scope classifier
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.scope.outputs.docs_only != 'true' }}
        run: python3 .github/scripts/docs-only-scope.py --policy .github/gate-policy.toml --self-test
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.scope.outputs.docs_only != 'true' && steps.fast-evidence.outputs.reuse != 'true' }}
        with:
          toolchain: 1.98.0
          components: rustfmt
      - run: cargo fmt --all --check
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.scope.outputs.docs_only != 'true' && steps.fast-evidence.outputs.reuse != 'true' }}
      - name: Verify fail-closed distribution policy
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.scope.outputs.docs_only != 'true' }}
        run: |
          python3 tools/ci/test_verify_distribution_policy.py
          python3 tools/ci/verify_distribution_policy.py
      - name: Verify supported workflow YAML shape
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.scope.outputs.docs_only != 'true' }}
        run: |
          python3 tools/ci/test_verify_workflow_shape.py
          python3 tools/ci/verify_workflow_shape.py
      - name: Verify lockfile-fail-closed Cargo policy
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.scope.outputs.docs_only != 'true' }}
        run: |
          python3 tools/ci/test_verify_locked_cargo_policy.py
          python3 tools/ci/verify_locked_cargo_policy.py
      - name: Verify research Cargo containment
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.scope.outputs.docs_only != 'true' }}
        run: |
          python3 tools/ci/test_verify_cargo_graph_ownership.py
          python3 tools/ci/verify_cargo_graph_ownership.py
      - name: Test merge-gate policy verifier
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.scope.outputs.docs_only != 'true' }}
        run: python3 tools/ci/test_verify_gate_policy.py
      - name: Test upstream metadata-ingestion guards
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.scope.outputs.docs_only != 'true' }}
        run: python3 tools/ci/test_upstream_quarkdown_ingestion.py
      - name: Verify generated/reference-data provenance contract
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.scope.outputs.docs_only != 'true' }}
        run: |
          python3 tools/ci/test_reference_provenance.py
          python3 tools/verify_reference_provenance.py
      - name: Test deterministic workflow-security policy
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.scope.outputs.docs_only != 'true' }}
        run: |
          python3 tools/ci/test_verify_workflow_security.py
          python3 tools/ci/verify_workflow_security.py
      - name: Test recurring hardening drift audit
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.scope.outputs.docs_only != 'true' }}
        run: |
          python3 tools/ci/test_hardening_drift_audit.py
          python3 tools/ci/test_hardening_drift_live.py
      - name: Install pinned actionlint
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.scope.outputs.docs_only != 'true' }}
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_ARCHIVE_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --retry 3 \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_ARCHIVE_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP/actionlint" actionlint
          "$RUNNER_TEMP/actionlint/actionlint" -version
          "$RUNNER_TEMP/actionlint/actionlint" -color
      - name: Run pinned zizmor
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.scope.outputs.docs_only != 'true' }}
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          inputs: .github/workflows
          version: 1.29.0
          config: zizmor.yml
          advanced-security: false
          online-audits: false
          annotations: false
      - name: Verify merge-gate policy and live ruleset
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.scope.outputs.docs_only != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ruleset_id="$(gh api "repos/${GITHUB_REPOSITORY}/rulesets" \
            --jq '.[] | select(.name == "Protect main") | .id')"
          if [ -z "$ruleset_id" ]; then
            echo "Protect main ruleset not found" >&2
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/rulesets/${ruleset_id}" \
            > "$RUNNER_TEMP/protect-main-ruleset.json"
          python3 tools/ci/verify_gate_policy.py verify \
            --ruleset-json "$RUNNER_TEMP/protect-main-ruleset.json"

  clippy:
    name: clippy
    needs: [scope]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve exact-SHA Fast evidence
        id: fast-evidence
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false && needs.scope.outputs.docs_only != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_JOB: fast
          SAME_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          if [ "$SAME_REPOSITORY" != "true" ]; then
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            echo "Fork PR has no trusted base-repository branch Fast run; Final will execute the local checks."
            exit 0
          fi

          base_workflow_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/fast-branch.yml?ref=$BASE_SHA" --jq '.sha')"
          head_workflow_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/fast-branch.yml?ref=$EXPECTED_SHA" --jq '.sha')"
          if [ "$base_workflow_sha" != "$head_workflow_sha" ]; then
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            echo "Fast producer workflow changed on this PR; Final will execute the local checks instead of trusting self-modified evidence."
            exit 0
          fi

          for _ in $(seq 1 60); do
            runs="$(gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/workflows/fast-branch.yml/runs?event=push&head_sha=$EXPECTED_SHA&per_page=100")"
            latest="$(jq -c --arg sha "$EXPECTED_SHA" '
              [.workflow_runs[]
               | select(.head_sha == $sha and .event == "push")]
              | if length == 0 then empty else max_by(.id) end
            ' <<<"$runs")"
            if [ -z "$latest" ]; then
              sleep 5
              continue
            fi

            status="$(jq -r '.status' <<<"$latest")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$latest")"
            if [ "$status" != "completed" ]; then
              sleep 5
              continue
            fi
            if [ "$conclusion" != "success" ]; then
              echo "::error::Canonical Fast workflow for exact HEAD $EXPECTED_SHA concluded '$conclusion'; classify/remediate it instead of overwriting it in Final."
              exit 1
            fi

            run_id="$(jq -r '.id' <<<"$latest")"
            jobs="$(gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=latest&per_page=100")"
            matching_jobs="$(jq --arg name "$EXPECTED_JOB" '[.jobs[] | select(.name == $name)] | length' <<<"$jobs")"
            if [ "$matching_jobs" != "1" ]; then
              echo "::error::Canonical Fast run $run_id must contain exactly one '$EXPECTED_JOB' job; found $matching_jobs."
              exit 1
            fi
            job_status="$(jq -r --arg name "$EXPECTED_JOB" '.jobs[] | select(.name == $name) | .status' <<<"$jobs")"
            job_conclusion="$(jq -r --arg name "$EXPECTED_JOB" '.jobs[] | select(.name == $name) | (.conclusion // "")' <<<"$jobs")"
            if [ "$job_status" != "completed" ] || [ "$job_conclusion" != "success" ]; then
              echo "::error::Canonical Fast job for exact HEAD $EXPECTED_SHA is not completed/success (status=$job_status conclusion=$job_conclusion)."
              exit 1
            fi

            echo "reuse=true" >> "$GITHUB_OUTPUT"
            echo "Reusing canonical successful Fast workflow evidence for exact HEAD $EXPECTED_SHA."
            exit 0
          done
          echo "::error::Timed out waiting for canonical exact-SHA Fast evidence at $EXPECTED_SHA; refusing duplicate fallback on a same-repository PR."
          exit 1
      - name: Draft final-gate placeholder
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: echo "full required-context validation is deferred until the pull request is ready for review"
      - name: Documentation-only fast path
        if: ${{ github.event.pull_request.draft == false && needs.scope.outputs.docs_only == 'true' }}
        run: echo "Trusted-base classification proved documentation-only scope; heavy product validation is not applicable."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.scope.outputs.docs_only != 'true' && steps.fast-evidence.outputs.reuse != 'true' }}
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.scope.outputs.docs_only != 'true' && steps.fast-evidence.outputs.reuse != 'true' }}
        with:
          toolchain: 1.98.0
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.scope.outputs.docs_only != 'true' && steps.fast-evidence.outputs.reuse != 'true' }}
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.scope.outputs.docs_only != 'true' && steps.fast-evidence.outputs.reuse != 'true' }}

  test:
    name: test (${{ matrix.os }})
    needs: [scope]
    if: ${{ always() }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Draft final-gate placeholder
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: echo "full required-context validation is deferred until the pull request is ready for review"
      - name: Documentation-only fast path
        if: ${{ github.event.pull_request.draft == false && needs.scope.outputs.docs_only == 'true' }}
        run: echo "Trusted-base classification proved documentation-only scope; heavy product validation is not applicable."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.scope.outputs.docs_only != 'true' }}
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.scope.outputs.docs_only != 'true' }}
        with:
          toolchain: 1.98.0
      - name: Restore Rust cache (macOS/Windows)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.scope.outputs.docs_only != 'true' && matrix.os != 'ubuntu-latest' }}
      - name: Restore dependency-only Rust cache (Ubuntu)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.scope.outputs.docs_only != 'true' && matrix.os == 'ubuntu-latest' }}
        with:
          cache-targets: false
      - name: Install Typst 0.15.1 (pinned)
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.scope.outputs.docs_only != 'true' }}
        uses: typst-community/setup-typst@9107b8dd77d7a7fd6c5faebbb507cac28069042e # v5
        with:
          typst-version: 0.15.1

      - name: Install verified sccache 0.18.0 (Ubuntu)
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.scope.outputs.docs_only != 'true' && matrix.os == 'ubuntu-latest' }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/sccache-v0.18.0-x86_64-unknown-linux-musl.tar.gz"
          install_dir="$RUNNER_TEMP/sccache-v0.18.0"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/mozilla/sccache/releases/download/v0.18.0/sccache-v0.18.0-x86_64-unknown-linux-musl.tar.gz" \
            --output "$archive"
          echo "45f1447fbe231e3037bde351ef70677dd212216c8d62ae7ca409fecc4d6acc89  $archive" \
            | sha256sum --check --strict
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" --strip-components=1
          test -x "$install_dir/sccache"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Resolve protected-main compiler-cache identity (Ubuntu)
        id: final-cache-id
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.scope.outputs.docs_only != 'true' && matrix.os == 'ubuntu-latest' }}
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CARGO_INCREMENTAL: "0"
        run: |
          set -euo pipefail
          lock_hash="$(sha256sum Cargo.lock | awk '{print $1}')"
          cargo_config_hash="$(sha256sum .cargo/config.toml | awk '{print $1}')"
          env_hash="$(
            {
              rustc -Vv
              printf 'runner_os=%s\n' "$RUNNER_OS"
              printf 'runner_arch=%s\n' "$RUNNER_ARCH"
              printf 'rustflags=%s\n' "$RUSTFLAGS"
              printf 'cargo_incremental=%s\n' "$CARGO_INCREMENTAL"
              printf 'cargo_term_color=%s\n' "$CARGO_TERM_COLOR"
              printf 'sccache_version=0.18.0\n'
              printf 'cargo_config_sha256=%s\n' "$cargo_config_hash"
            } | sha256sum | awk '{print $1}'
          )"
          [[ "$lock_hash" =~ ^[0-9a-f]{64}$ ]]
          [[ "$env_hash" =~ ^[0-9a-f]{64}$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]

          family="arkst-final-sccache-v1-linux-${env_hash}"
          lock_prefix="${family}-${lock_hash}-"
          key="${lock_prefix}${BASE_SHA}"

          {
            echo "family=$family"
            echo "lock_prefix=$lock_prefix"
            echo "key=$key"
          } >> "$GITHUB_OUTPUT"

          echo "Requested protected-main compiler-cache key: $key"

      - name: Restore protected-main compiler cache read-only (Ubuntu)
        id: final-restore-sccache
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.scope.outputs.docs_only != 'true' && matrix.os == 'ubuntu-latest' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/arkst-final-sccache
          key: ${{ steps.final-cache-id.outputs.key }}
          restore-keys: |
            ${{ steps.final-cache-id.outputs.lock_prefix }}
            ${{ steps.final-cache-id.outputs.family }}-

      - name: Enable restore-only sccache (Ubuntu)
        id: enable-final-sccache
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.scope.outputs.docs_only != 'true' && matrix.os == 'ubuntu-latest' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "SCCACHE_DIR=$RUNNER_TEMP/arkst-final-sccache"
            echo "SCCACHE_CACHE_SIZE=1G"
            echo "SCCACHE_LOCAL_RW_MODE=READ_ONLY"
            echo "RUSTC_WRAPPER=sccache"
            echo "CARGO_INCREMENTAL=0"
          } >> "$GITHUB_ENV"
          echo "exact protected-main cache hit: ${{ steps.final-restore-sccache.outputs.cache-hit }}"

      - name: Zero compiler cache stats (Ubuntu)
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.scope.outputs.docs_only != 'true' && matrix.os == 'ubuntu-latest' }}
        run: sccache --zero-stats
      - name: Test default CLI feature boundary
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.scope.outputs.docs_only != 'true' }}
        run: cargo test --locked -p arkst-cli --no-default-features
      - name: Test (Typst required)
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.scope.outputs.docs_only != 'true' }}
        run: cargo test --locked --workspace --all-targets --all-features
        env:
          ARKST_REQUIRE_TYPST: "1"
      - name: Test Typst backend parity
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.scope.outputs.docs_only != 'true' }}
        run: cargo test --locked -p arkst-typst-inprocess --test backend_parity --all-features -- --nocapture
        env:
          ARKST_REQUIRE_TYPST: "1"
      - name: Verify CLI dependency feature boundary
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.scope.outputs.docs_only != 'true' && (matrix.os == 'ubuntu-latest') }}
        shell: bash
        run: |
          default_tree="$(mktemp)"
          feature_tree="$(mktemp)"
          cargo tree --locked -p arkst-cli --no-default-features > "$default_tree"
          if grep -Eq '(^|[[:space:]])typst v|typst-(assets|pdf|layout) v|arkst-typst-inprocess' "$default_tree"; then
            echo "default arkst-cli unexpectedly contains the in-process Typst graph"
            sed -n '1,240p' "$default_tree"
            exit 1
          fi
          cargo tree --locked -p arkst-cli --no-default-features --features typst-inprocess > "$feature_tree"
          grep -Eq 'arkst-typst-inprocess' "$feature_tree"
          grep -Eq '(^|[[:space:]])typst v|typst-(assets|pdf|layout) v' "$feature_tree"
      - name: Smoke-test public examples
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.scope.outputs.docs_only != 'true' && (matrix.os == 'ubuntu-latest') }}
        shell: bash
        run: |
          cargo build --locked -p arkst-cli
          mkdir -p target/example-smoke
          for input in \
            examples/markdown/basic.md \
            examples/markdown/gfm.md \
            examples/markdown/bounded-html.md \
            examples/hello/main.qd
          do
            name="$(basename "${input%.*}")"
            target/debug/arkst check "$input"
            target/debug/arkst build "$input" --output "target/example-smoke/${name}.typ"
            target/debug/arkst build "$input" --format pdf --output "target/example-smoke/${name}.pdf"
          done

      - name: Verify restore-only compiler cache health (Ubuntu)
        if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.scope.outputs.docs_only != 'true' && matrix.os == 'ubuntu-latest' && steps.enable-final-sccache.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          stats="$RUNNER_TEMP/arkst-final-sccache-stats.json"
          sccache --show-stats --stats-format=json | tee "$stats"
          python3 - "$stats" <<'PY'
          import json
          import sys

          stats = json.load(open(sys.argv[1], encoding="utf-8")).get("stats", {})
          rust_hits = stats.get("cache_hits", {}).get("counts", {}).get("Rust", 0)
          rust_misses = stats.get("cache_misses", {}).get("counts", {}).get("Rust", 0)
          read_errors = stats.get("cache_read_errors", 0)
          write_errors = stats.get("cache_write_errors", 0)
          successful_writes = stats.get("cache_writes", 0)

          print(
              f"consumer rust_hits={rust_hits} rust_misses={rust_misses} "
              f"read_errors={read_errors} write_errors={write_errors} "
              f"successful_writes={successful_writes}"
          )
          if read_errors != 0:
              raise SystemExit("restore-only compiler-cache consumer recorded read errors")
          if successful_writes != 0:
              raise SystemExit("restore-only compiler-cache consumer wrote cache entries")
          PY

  wasm:
    name: wasm
    needs: [scope]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Draft final-gate placeholder
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: echo "full required-context validation is deferred until the pull request is ready for review"
      - name: Documentation-only fast path
        if: ${{ github.event.pull_request.draft == false && needs.scope.outputs.docs_only == 'true' }}
        run: echo "Trusted-base classification proved documentation-only scope; heavy product validation is not applicable."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.scope.outputs.docs_only != 'true' }}
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.scope.outputs.docs_only != 'true' }}
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.scope.outputs.docs_only != 'true' }}
      - run: cargo check --locked -p arkst-core -p arkst-typst --target wasm32-unknown-unknown --all-features
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.scope.outputs.docs_only != 'true' }}

  doc:
    name: docs
    needs: [scope]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Draft final-gate placeholder
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: echo "full required-context validation is deferred until the pull request is ready for review"
      - name: Documentation-only fast path
        if: ${{ github.event.pull_request.draft == false && needs.scope.outputs.docs_only == 'true' }}
        run: echo "Trusted-base classification proved documentation-only scope; heavy product validation is not applicable."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.scope.outputs.docs_only != 'true' }}
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.scope.outputs.docs_only != 'true' }}
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.scope.outputs.docs_only != 'true' }}
      - run: cargo doc --locked --workspace --all-features --no-deps
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.scope.outputs.docs_only != 'true' }}

  deny:
    name: license
    needs: [scope]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Draft final-gate placeholder
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: echo "full required-context validation is deferred until the pull request is ready for review"
      - name: Documentation-only fast path
        if: ${{ github.event.pull_request.draft == false && needs.scope.outputs.docs_only == 'true' }}
        run: echo "Trusted-base classification proved documentation-only scope; heavy product validation is not applicable."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ needs.scope.outputs.docs_only != 'true' }}
        with:
          persist-credentials: false
      - name: Verify license/provenance engineering invariants
        if: ${{ needs.scope.outputs.docs_only != 'true' }}
        run: |
          python3 tools/ci/test_verify_license_provenance.py
          python3 tools/ci/verify_license_provenance.py
          python3 tools/ci/verify_license_provenance.py --release
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        if: ${{ needs.scope.outputs.docs_only != 'true' }}
        with:
          command: check
          arguments: --all-features
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        if: ${{ needs.scope.outputs.docs_only != 'true' }}
        with:
          manifest-path: tools/spikes/typst-in-process/Cargo.toml
          command: check
          arguments: --all-features
          command-arguments: advisories sources

  compatibility:
    name: compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Draft final-gate placeholder
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: echo "full required-context validation is deferred until the pull request is ready for review"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine compatibility scope
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git fetch --no-tags --quiet origin "${BASE_SHA}" "${HEAD_SHA}"
            python3 tools/ci/verify_gate_policy.py compatibility-scope \
              --base-sha "${BASE_SHA}" \
              --head-sha "${HEAD_SHA}" \
              --github-output "${GITHUB_OUTPUT}"
          else
            echo "relevant=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: No-op compatibility gate
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (steps.scope.outputs.relevant != 'true') }}
        run: echo "No compatibility-affecting files changed; compatibility campaign not applicable."

      - if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (steps.scope.outputs.relevant == 'true') }}
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot
        with:
          toolchain: 1.98.0

      - if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (steps.scope.outputs.relevant == 'true') }}
        uses: typst-community/setup-typst@9107b8dd77d7a7fd6c5faebbb507cac28069042e # v5
        with:
          typst-version: 0.15.1

      - name: Prepare pinned CommonMark and cmark-gfm references
        id: references
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (steps.scope.outputs.relevant == 'true') }}
        run: |
          python3 tools/markdown-compat/prepare_references.py \
            --config tests/compat/references.toml \
            --output-dir "$RUNNER_TEMP/markdown-compat-references" \
            --github-output "$GITHUB_OUTPUT"

      - name: Build pinned cmark-gfm
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (steps.scope.outputs.relevant == 'true') }}
        env:
          CMARK_GFM_ROOT: ${{ steps.references.outputs.cmark_gfm_root }}
        run: |
          cmake -S "$CMARK_GFM_ROOT" \
            -B "$CMARK_GFM_ROOT/build" \
            -DCMARK_TESTS=OFF \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build "$CMARK_GFM_ROOT/build" \
            --target cmark-gfm --parallel

      - name: Build pinned CommonMark cmark
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (steps.scope.outputs.relevant == 'true') }}
        env:
          CMARK_ROOT: ${{ steps.references.outputs.cmark_root }}
        run: |
          cmake -S "$CMARK_ROOT" \
            -B "$CMARK_ROOT/build" \
            -DCMARK_TESTS=OFF \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build "$CMARK_ROOT/build" \
            --target cmark_exe --parallel

      - name: Verify checked-in specification corpora
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (steps.scope.outputs.relevant == 'true') }}
        env:
          COMMONMARK_SPEC: ${{ steps.references.outputs.commonmark_spec }}
          CMARK_GFM_SPEC: ${{ steps.references.outputs.cmark_gfm_spec }}
        run: |
          python3 tools/markdown-compat/extract_corpus.py \
            --spec "$COMMONMARK_SPEC" \
            --prefix commonmark \
            --output "$RUNNER_TEMP/commonmark.json"
          python3 tools/markdown-compat/extract_corpus.py \
            --spec "$CMARK_GFM_SPEC" \
            --prefix gfm \
            --output "$RUNNER_TEMP/gfm.json"
          cmp tests/compat/corpus/commonmark.json "$RUNNER_TEMP/commonmark.json"
          cmp tests/compat/corpus/gfm.json "$RUNNER_TEMP/gfm.json"

      - name: Verify Markdown provenance contract and regenerated artifacts
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (steps.scope.outputs.relevant == 'true') }}
        run: |
          python3 tools/verify_reference_provenance.py \
            --markdown-paths "$RUNNER_TEMP/markdown-compat-references/paths.json" \
            --commonmark-extracted "$RUNNER_TEMP/commonmark.json" \
            --gfm-extracted "$RUNNER_TEMP/gfm.json"

      - name: Run differential corpus and PDF smoke harness
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (steps.scope.outputs.relevant == 'true') }}
        env:
          CMARK_ROOT: ${{ steps.references.outputs.cmark_root }}
          CMARK_GFM_ROOT: ${{ steps.references.outputs.cmark_gfm_root }}
        run: |
          cargo run --locked -q -p arkst-markdown-compat -- \
            --commonmark-cmark "$CMARK_ROOT/build/src/cmark" \
            --gfm-cmark "$CMARK_GFM_ROOT/build/src/cmark-gfm" \
            --output-dir "$RUNNER_TEMP/markdown-compat-report" \
            --typst typst

      - name: Verify independent Markdown result identity
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (steps.scope.outputs.relevant == 'true') }}
        run: |
          python3 tools/verify_reference_provenance.py \
            --markdown-report "$RUNNER_TEMP/markdown-compat-report/compatibility-report.json"

      - name: Upload Markdown compatibility artifacts
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (always() && steps.scope.outputs.relevant == 'true') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: markdown-compat-${{ github.run_id }}
          path: ${{ runner.temp }}/markdown-compat-report
          if-no-files-found: error

