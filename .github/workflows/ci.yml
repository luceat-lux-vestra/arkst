name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

permissions:
  contents: read

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Typst 0.15.1 (pinned)
        uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1
      - name: Test default CLI feature boundary
        run: cargo test -p scribium-cli --no-default-features
      - name: Test (Typst required)
        run: cargo test --workspace --all-targets --all-features
        env:
          SCRIBIUM_REQUIRE_TYPST: "1"
      - name: Verify CLI dependency feature boundary
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          default_tree="$(mktemp)"
          feature_tree="$(mktemp)"
          cargo tree -p scribium-cli --no-default-features > "$default_tree"
          if grep -Eq '(^|[[:space:]])typst v|typst-(assets|pdf|layout) v|scribium-typst-inprocess' "$default_tree"; then
            echo "default scribium-cli unexpectedly contains the in-process Typst graph"
            sed -n '1,240p' "$default_tree"
            exit 1
          fi
          cargo tree -p scribium-cli --no-default-features --features typst-inprocess > "$feature_tree"
          grep -Eq 'scribium-typst-inprocess' "$feature_tree"
          grep -Eq '(^|[[:space:]])typst v|typst-(assets|pdf|layout) v' "$feature_tree"
      - name: Smoke-test public examples
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          cargo build -p scribium-cli
          mkdir -p target/example-smoke
          for input in \
            examples/markdown/basic.md \
            examples/markdown/gfm.md \
            examples/markdown/bounded-html.md \
            examples/hello/main.qd
          do
            name="$(basename "${input%.*}")"
            target/debug/scribium check "$input"
            target/debug/scribium build "$input" --output "target/example-smoke/${name}.typ"
            target/debug/scribium build "$input" --format pdf --output "target/example-smoke/${name}.pdf"
          done

  wasm:
    name: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p scribium-core -p scribium-typst --target wasm32-unknown-unknown --all-features

  doc:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --all-features --no-deps

  deny:
    name: license
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
