name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  dev-page-geometry:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply bounded page geometry patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/dev_v260_page_geometry_patch.py
          cargo fmt --all
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/arkst-ir/src/lib.rs crates/arkst-engine/src/evaluator.rs crates/arkst-typst/src/lowering.rs crates/arkst-typst/src/focus_lowering.rs
          if ! git diff --cached --quiet; then
            git commit -m 'feat(compat): add typed complete page geometry'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
          cargo check --workspace --all-targets --locked
