        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.scope.outputs.docs_only != 'true' }}
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.scope.outputs.docs_only != 'true' }}
        with:
          toolchain: 1.92.0
      - run: cargo +1.92.0 check --workspace --all-targets --all-features --locked
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.scope.outputs.docs_only != 'true' }}

  dependency_review:
    name: dependency-review
    needs: [scope]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Documentation-only fast path
        if: ${{ github.event.pull_request.draft == false && needs.scope.outputs.docs_only == 'true' }}
        run: echo "Trusted-base classification proved documentation-only scope; heavy validation is not applicable."
      - name: Draft final-gate placeholder
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: echo "full required-context validation is deferred until the pull request is ready for review"
      - name: Review dependency changes
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.scope.outputs.docs_only != 'true' }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          license-check: true
          allow-licenses: Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, MIT, Unicode-3.0, Zlib, CC0-1.0
          allow-dependencies-licenses: pkg:cargo/az@1.3.0,pkg:cargo/guillotiere@0.7.0,pkg:cargo/unicode-properties@0.1.4,pkg:cargo/wasmi@1.1.0,pkg:cargo/wasmi_collections@1.1.0,pkg:cargo/wasmi_core@1.1.0,pkg:cargo/wasmi_ir@1.1.0,pkg:cargo/ar_archive_writer@0.5.3

  merge_gate:
    name: Merge Gate
    needs: [fmt, clippy, test, wasm, doc, deny, compatibility, msrv, dependency_review]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify authoritative component results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"'
          jq -e 'all(to_entries[]; .value.result == "success")' <<<"$NEEDS_JSON"
