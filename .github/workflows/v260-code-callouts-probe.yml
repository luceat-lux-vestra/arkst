name: v2.6 code callouts candidate

on:
  push:
    branches:
      - compat/311-v260-code-callouts

permissions:
  contents: write

jobs:
  candidate:
    if: startsWith(github.event.head_commit.message, 'test(compat):')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Recover and apply candidate implementation
        shell: bash
        run: |
          set -euo pipefail
          git show 429deed67100f2e9325ef7f3503275cb5384c8be:.github/workflows/v260-code-callouts-probe.yml > /tmp/candidate.yml
          python3 <<'PY'
          from pathlib import Path
          text = Path('/tmp/candidate.yml').read_text()
          start_marker = "          python3 <<'PY'\n"
          end_marker = "          PY\n\n          cargo fmt --all"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          lines = text[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          # The first CodeBlock shape intentionally occurs in both the public IR
          # and its wire enum. The candidate script later patches WireNode with a
          # more-specific anchor, so permit this one public-first replacement.
          needle = """    if text.count(old) != 1:\n        raise SystemExit(f\"{path}: expected one match, got {text.count(old)} for {old[:80]!r}\")\n    p.write_text(text.replace(old, new, 1))\n"""
          replacement = """    count = text.count(old)\n    public_code_block = (\n        path == 'crates/arkst-ir/src/lib.rs'\n        and old.startswith('    CodeBlock {\\n        language: Option<String>,')\n        and old.endswith('        span: SourceSpan,\\n    },')\n    )\n    if count != 1 and not (public_code_block and count == 2):\n        raise SystemExit(f\"{path}: expected one match, got {count} for {old[:80]!r}\")\n    p.write_text(text.replace(old, new, 1))\n"""
          if script.count(needle) != 1:
              raise SystemExit('candidate helper shape changed')
          script = script.replace(needle, replacement, 1)
          Path('/tmp/apply.py').write_text(script)
          PY
          python3 /tmp/apply.py
          cargo fmt --all
          git diff --check
          cargo test -p arkst-core --test quarkdown_code_callouts
          cargo test -p arkst-typst --test code_callouts
          cargo check --workspace --all-targets
      - name: Commit candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/arkst-ir/src/lib.rs crates/arkst-engine/src/ast_to_ir.rs crates/arkst-engine/src/evaluator.rs crates/arkst-typst/src/lowering.rs crates/arkst-core/tests/quarkdown_code_callouts.rs crates/arkst-typst/tests/code_callouts.rs
          git commit -m 'feat(compat): add Quarkdown v2.6 code callouts'
          git push origin HEAD:compat/311-v260-code-callouts
