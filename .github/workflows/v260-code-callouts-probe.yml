name: v2.6 code callouts probe

on:
  push:
    branches:
      - compat/311-v260-code-callouts

permissions:
  contents: read

jobs:
  probe:
    if: startsWith(github.event.head_commit.message, 'test(compat):')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Inspect Arkst producer and lowering boundaries
        shell: bash
        run: |
          set -euo pipefail
          context() {
            file="$1"
            pattern="$2"
            before="${3:-25}"
            after="${4:-70}"
            line="$(grep -n -m1 -F "$pattern" "$file" | cut -d: -f1)"
            start=$(( line > before ? line - before : 1 ))
            end=$(( line + after ))
            echo "=== $file :: $pattern @ $line ==="
            nl -ba "$file" | sed -n "${start},${end}p"
          }

          context crates/arkst-ir/src/lib.rs 'pub enum IrNode' 5 150
          context crates/arkst-ir/src/lib.rs 'WireNode {' 5 100
          context crates/arkst-ir/src/lib.rs 'IrNode::CodeBlock {' 20 60
          context crates/arkst-engine/src/ast_to_ir.rs 'IrNode::CodeBlock {' 25 55
          context crates/arkst-typst/src/lowering.rs 'IrNode::CodeBlock {' 25 80

          echo '=== evaluator known-native references ==='
          grep -n -E 'doclang|captionposition|container|landscape|row|column' crates/arkst-engine/src/evaluator.rs | head -n 160
          line="$(grep -n -m1 '"doclang"' crates/arkst-engine/src/evaluator.rs | cut -d: -f1)"
          start=$(( line > 100 ? line - 100 : 1 ))
          end=$(( line + 220 ))
          nl -ba crates/arkst-engine/src/evaluator.rs | sed -n "${start},${end}p"

          echo '=== native manifest ==='
          grep -n -E 'SUPPORTED|BUILTIN|NATIVE|doclang|captionposition' crates/arkst-engine/src/evaluator.rs crates/arkst-core/tests/stdlib_builtin_audit.rs | head -n 200
