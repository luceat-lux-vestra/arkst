name: v2.6 code callouts probe

on:
  push:
    branches:
      - compat/311-v260-code-callouts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official Quarkdown v2.6.0 binary
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/quarkdown.zip \
            https://github.com/iamgio/quarkdown/releases/download/v2.6.0/quarkdown-linux-x64.zip
          echo '5b015e47c820d06ff6774eb700e60d77bc575819d4a0140cc7f1a115e7ce6dc4a  /tmp/quarkdown.zip' | sha256sum -c -
          mkdir -p /tmp/quarkdown
          unzip -q /tmp/quarkdown.zip -d /tmp/quarkdown
          find /tmp/quarkdown -maxdepth 3 -type f -perm -111 -print
      - name: Print version and CLI help
        shell: bash
        run: |
          set -euo pipefail
          BIN="$(find /tmp/quarkdown -type f -name quarkdown -perm -111 | head -n1)"
          test -n "$BIN"
          "$BIN" version
          "$BIN" --help
