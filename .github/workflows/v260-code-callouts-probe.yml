name: v2.6 code callouts validation

on:
  push:
    branches:
      - compat/311-v260-code-callouts

permissions:
  contents: write

jobs:
  validate:
    if: startsWith(github.event.head_commit.message, 'test(compat):')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Group argument conversion modes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path("crates/arkst-markdown/src/parser.rs")
          text = path.read_text()

          insertion_anchor = '''fn is_chained_contextual_inline_body_position(call_name: &str, positional_index: usize) -> bool {
              positional_index == 0 && matches!(call_name, "foreach" | "repeat")
          }

          fn convert_arg_with_mode(
          '''
          insertion_replacement = '''fn is_chained_contextual_inline_body_position(call_name: &str, positional_index: usize) -> bool {
              positional_index == 0 && matches!(call_name, "foreach" | "repeat")
          }

          #[derive(Debug, Clone, Copy)]
          struct ArgConversionMode {
              allow_unmarked_lambda: bool,
              contextual_inline_body: bool,
              target_owns_opaque_markers: bool,
          }

          fn convert_arg_with_mode(
          '''
          if text.count(insertion_anchor) != 1:
              raise SystemExit(f"mode insertion anchor count: {text.count(insertion_anchor)}")
          text = text.replace(insertion_anchor, insertion_replacement, 1)

          start = text.index("fn convert_arg_with_mode(")
          end = text.index("\nfn parse_original_content(", start)
          function = text[start:end]
          old_signature = '''fn convert_arg_with_mode(
              arg: &Arg,
              source: &str,
              base: usize,
              call_base: usize,
              diagnostics: &mut Vec<ParserDiagnostic>,
              allow_unmarked_lambda: bool,
              contextual_inline_body: bool,
              target_owns_opaque_markers: bool,
          ) -> Value {'''
          new_signature = '''fn convert_arg_with_mode(
              arg: &Arg,
              source: &str,
              base: usize,
              call_base: usize,
              diagnostics: &mut Vec<ParserDiagnostic>,
              mode: ArgConversionMode,
          ) -> Value {'''
          if function.count(old_signature) != 1:
              raise SystemExit("convert_arg_with_mode signature changed")
          function = function.replace(old_signature, new_signature, 1)
          function = function.replace(
              "if allow_unmarked_lambda {",
              "if mode.allow_unmarked_lambda {",
          )
          function = function.replace(
              "target_owns_opaque_markers",
              "mode.target_owns_opaque_markers",
          )
          function = function.replace(
              "if contextual_inline_body {",
              "if mode.contextual_inline_body {",
          )
          text = text[:start] + function + text[end:]

          positional_old = '''                CallArgument::Positional {
                      value: convert_arg_with_mode(
                          arg,
                          source,
                          base,
                          call_base,
                          diagnostics,
                          positional_body(call_name, index),
                          positional_body(call_name, index),
                          call_name == "code" && index == 4,
                      ),
          '''
          positional_new = '''                let contextual_inline_body = positional_body(call_name, index);
                      CallArgument::Positional {
                          value: convert_arg_with_mode(
                              arg,
                              source,
                              base,
                              call_base,
                              diagnostics,
                              ArgConversionMode {
                                  allow_unmarked_lambda: contextual_inline_body,
                                  contextual_inline_body,
                                  target_owns_opaque_markers: call_name == "code" && index == 4,
                              },
                          ),
          '''
          if text.count(positional_old) != 1:
              raise SystemExit(f"positional call anchor count: {text.count(positional_old)}")
          text = text.replace(positional_old, positional_new, 1)

          named_old = '''        value: convert_arg_with_mode(
                  &arg.value,
                  source,
                  base,
                  call_base,
                  diagnostics,
                  callback_lambda,
                  false,
                  call_name == Some("code") && arg.name == "callouts",
              ),
          '''
          named_new = '''        value: convert_arg_with_mode(
                  &arg.value,
                  source,
                  base,
                  call_base,
                  diagnostics,
                  ArgConversionMode {
                      allow_unmarked_lambda: callback_lambda,
                      contextual_inline_body: false,
                      target_owns_opaque_markers: call_name == Some("code") && arg.name == "callouts",
                  },
              ),
          '''
          if text.count(named_old) != 1:
              raise SystemExit(f"named call anchor count: {text.count(named_old)}")
          text = text.replace(named_old, named_new, 1)

          path.write_text(text)
          PY
          cargo fmt --all
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "crates/arkst-markdown/src/parser.rs"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot
        with:
          toolchain: 1.98.0
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install Typst 0.15.1 (pinned)
        uses: typst-community/setup-typst@9107b8dd77d7a7fd6c5faebbb507cac28069042e # v5
        with:
          typst-version: 0.15.1
      - name: Targeted compatibility evidence
        env:
          ARKST_REQUIRE_TYPST: "1"
        run: |
          cargo fmt --all -- --check
          cargo test --locked -p arkst-markdown --test quarkdown_code_callouts
          cargo test --locked -p arkst-ir --test code_callouts_serde
          cargo test --locked -p arkst-core --test quarkdown_code_callouts
          cargo test --locked -p arkst-typst --test code_callouts
          cargo test --locked -p arkst-typst-subprocess --test code_callouts_integration
      - name: Workspace compile and lint
        run: |
          cargo check --locked --workspace --all-targets --all-features
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: WASM boundary
        run: cargo check --locked -p arkst-core -p arkst-typst --target wasm32-unknown-unknown --all-features
      - name: Commit validated parser refactor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/arkst-markdown/src/parser.rs
          git diff --cached --check
          git commit -m 'refactor(markdown): group argument conversion modes'
          git push origin HEAD:compat/311-v260-code-callouts
