name: v2.6 code callouts probe

on:
  push:
    branches:
      - compat/311-v260-code-callouts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: startsWith(github.event.head_commit.message, 'test(compat):') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download official Quarkdown v2.6.0 binary
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/quarkdown.zip \
            https://github.com/iamgio/quarkdown/releases/download/v2.6.0/quarkdown-linux-x64.zip
          echo '5b015e47c820d06ff6774eb700e60d77bc575819d4a0140cc7f1a115e7ce6dc4  /tmp/quarkdown.zip' | sha256sum -c -
          mkdir -p /tmp/quarkdown
          unzip -q /tmp/quarkdown.zip -d /tmp/quarkdown
          test -x /tmp/quarkdown/quarkdown/bin/quarkdown
      - name: Inspect public CLI surface
        shell: bash
        run: |
          BIN=/tmp/quarkdown/quarkdown/bin/quarkdown
          "$BIN" --version || true
          echo '=== ROOT HELP ==='
          "$BIN" --help
          echo '=== COMPILE HELP ==='
          "$BIN" compile --help || true
          echo '=== C HELP ==='
          "$BIN" c --help || true
