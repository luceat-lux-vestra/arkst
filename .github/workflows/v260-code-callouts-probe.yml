name: v2.6 code callouts probe

on:
  push:
    branches:
      - compat/311-v260-code-callouts

permissions:
  contents: read

jobs:
  probe:
    if: startsWith(github.event.head_commit.message, 'test(compat):')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Inspect Arkst unresolved argument representation
        shell: bash
        run: |
          set -euo pipefail
          cat > crates/arkst-core/tests/v260_code_shape_probe.rs <<'EOF'
          use arkst_core::{compile, CompileOptions, VirtualProjectBuilder};

          #[test]
          fn print_shape() {
              let source = ".unknown callouts:{\n    - 3: Third\n    - 1: First\n} linenumbers:{no} lang:{rust}\n    alpha\n    beta\n";
              let project = VirtualProjectBuilder::new()
                  .entry("main.qd").unwrap()
                  .add_source("main.qd", source).unwrap()
                  .build().unwrap();
              let result = compile(&project, &CompileOptions::default());
              println!("IR={:#?}", result.ir);
              println!("DIAGNOSTICS={:#?}", result.diagnostics);
          }
          EOF
          cargo test -p arkst-core --test v260_code_shape_probe -- --nocapture
          rm crates/arkst-core/tests/v260_code_shape_probe.rs
