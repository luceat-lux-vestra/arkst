name: v2.6 code callouts validation

on:
  push:
    branches:
      - compat/311-v260-code-callouts

permissions:
  contents: read

jobs:
  validate:
    if: startsWith(github.event.head_commit.message, 'test(compat):')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot
        with:
          toolchain: 1.98.0
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install Typst 0.15.1 (pinned)
        uses: typst-community/setup-typst@9107b8dd77d7a7fd6c5faebbb507cac28069042e # v5
        with:
          typst-version: 0.15.1
      - name: Targeted compatibility evidence
        env:
          ARKST_REQUIRE_TYPST: "1"
        run: |
          cargo fmt --all -- --check
          cargo test --locked -p arkst-markdown --test quarkdown_code_callouts
          cargo test --locked -p arkst-ir --test code_callouts_serde
          cargo test --locked -p arkst-core --test quarkdown_code_callouts
          cargo test --locked -p arkst-typst --test code_callouts
          cargo test --locked -p arkst-typst-subprocess --test code_callouts_integration
      - name: Workspace compile and lint
        run: |
          cargo check --locked --workspace --all-targets --all-features
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: WASM boundary
        run: cargo check --locked -p arkst-core -p arkst-typst --target wasm32-unknown-unknown --all-features
