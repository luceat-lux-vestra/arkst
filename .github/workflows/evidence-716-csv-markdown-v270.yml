name: Evidence 716 csv markdown v2.7.0

on:
  push:
    branches:
      - evidence/716-csv-markdown-v270

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download and verify official Quarkdown v2.7.0
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/quarkdown-linux-x64-v2.7.0.zip"
          url="https://github.com/iamgio/quarkdown/releases/download/v2.7.0/quarkdown-linux-x64.zip"
          sha="5ff4e78e391abd073e62030da816faef265d681d3b8ccfd05768cc9c586f7e85"
          curl --fail --location --retry 3 --output "$archive" "$url"
          printf '%s  %s\n' "$sha" "$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/quarkdown-v270"
          unzip -q "$archive" -d "$RUNNER_TEMP/quarkdown-v270"
          qd="$(find "$RUNNER_TEMP/quarkdown-v270" -type f -path '*/bin/quarkdown' -print -quit)"
          test -n "$qd"
          chmod +x "$qd"
          echo "QD=$qd" >> "$GITHUB_ENV"
          "$qd" --version || true

      - name: Run independent csv markdown cell probes
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/csv-markdown-probes"
          mkdir -p "$root"

          mkprobe() { mkdir -p "$root/$1"; }

          mkprobe inline_rich
          cat > "$root/inline_rich/input.qd" <<'QD'
          .csv {data.csv} mode:{markdown}
          QD
          cat > "$root/inline_rich/data.csv" <<'CSV'
          **Name**,_Note_,Link,Code
          **Alder**,*east*,[site](https://example.com),`x + y`
          CSV

          mkprobe quoted_markdown
          cat > "$root/quoted_markdown/input.qd" <<'QD'
          .csv {data.csv} mode:{markdown}
          QD
          cat > "$root/quoted_markdown/data.csv" <<'CSV'
          Name,Literal,Quoted
          "**Harbor, Jr.**","\*literal\*","a **bold** comma, here"
          CSV

          mkprobe multiline
          cat > "$root/multiline/input.qd" <<'QD'
          .csv {data.csv} mode:{markdown}
          QD
          cat > "$root/multiline/data.csv" <<'CSV'
          Name,Note
          Alder,"first line
          **second line**"
          CSV

          mkprobe block_like
          cat > "$root/block_like/input.qd" <<'QD'
          .csv {data.csv} mode:{markdown}
          QD
          cat > "$root/block_like/data.csv" <<'CSV'
          Heading,Listish,Quoteish,Tableish
          "# Heading","- item","> quote","| A | B |"
          CSV

          mkprobe breaks
          cat > "$root/breaks/input.qd" <<'QD'
          .csv {data.csv} mode:{markdown}
          QD
          cat > "$root/breaks/data.csv" <<'CSV'
          Name,Note
          Alder,"first  
          second"
          CSV

          mkprobe empty_file
          cat > "$root/empty_file/input.qd" <<'QD'
          .csv {data.csv} mode:{markdown}
          QD
          : > "$root/empty_file/data.csv"

          mkprobe header_only
          cat > "$root/header_only/input.qd" <<'QD'
          .csv {data.csv} mode:{markdown}
          QD
          printf '**Name**,_Value_\n' > "$root/header_only/data.csv"

          mkdir -p "$root/nested_relative/nested"
          cat > "$root/nested_relative/nested/input.qd" <<'QD'
          .csv {data.csv} mode:{markdown}
          QD
          cat > "$root/nested_relative/nested/data.csv" <<'CSV'
          Name,Note
          **Moss**,*nested*
          CSV

          mkprobe column_extract
          cat > "$root/column_extract/input.qd" <<'QD'
          .var {t} value:{
              .csv {data.csv} mode:{markdown}
          }
          .tablecolumn {1} of:{.t}::join { / }
          QD
          cat > "$root/column_extract/data.csv" <<'CSV'
          Name,Amount
          **B10**,2
          *A2*,5
          CSV

          mkprobe sort_rich
          cat > "$root/sort_rich/input.qd" <<'QD'
          .tablesort {1} table:{
              .csv {data.csv} mode:{markdown}
          }
          QD
          cat > "$root/sort_rich/data.csv" <<'CSV'
          Name,Amount
          **B10**,2
          *A2*,5
          CSV

          mkprobe filter_rich
          cat > "$root/filter_rich/input.qd" <<'QD'
          .tablefilter {1} {value: .value::contains {A}} table:{
              .csv {data.csv} mode:{markdown}
          }
          QD
          cat > "$root/filter_rich/data.csv" <<'CSV'
          Name,Amount
          **B10**,2
          *A2*,5
          CSV

          mkprobe compute_rich
          cat > "$root/compute_rich/input.qd" <<'QD'
          .tablecompute {2} {values: .values::join {+}} table:{
              .csv {data.csv} mode:{markdown}
          }
          QD
          cat > "$root/compute_rich/data.csv" <<'CSV'
          Name,Amount
          **Alder**,2
          *Birch*,5
          CSV

          mkprobe unknown_mode
          cat > "$root/unknown_mode/input.qd" <<'QD'
          .csv {data.csv} mode:{unknown}
          QD
          printf 'Name,Value\nA,1\n' > "$root/unknown_mode/data.csv"

          inspect_html() {
            python3 - "$1" <<'PY'
          import re
          import sys
          from html.parser import HTMLParser

          INTERESTING = {"strong","em","code","a","br","p","ul","ol","li","h1","h2","h3","blockquote","table"}

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.table_depth = 0
                  self.cell = None
                  self.cells = []
                  self.top_tables = 0
              def handle_starttag(self, tag, attrs):
                  if tag == "table":
                      self.table_depth += 1
                      if self.table_depth == 1:
                          self.top_tables += 1
                  if self.table_depth >= 1 and tag in ("td","th"):
                      self.cell = {"kind": tag, "parts": []}
                  elif self.cell is not None and tag in INTERESTING:
                      attrs = dict(attrs)
                      suffix = f" href={attrs.get('href')!r}" if tag == "a" else ""
                      self.cell["parts"].append(f"<{tag}{suffix}>")
              def handle_endtag(self, tag):
                  if self.cell is not None and tag in ("td","th"):
                      self.cells.append(self.cell)
                      self.cell = None
                  elif self.cell is not None and tag in INTERESTING:
                      self.cell["parts"].append(f"</{tag}>")
                  if tag == "table":
                      self.table_depth -= 1
              def handle_data(self, data):
                  if self.cell is not None:
                      value = re.sub(r"\s+", " ", data)
                      if value:
                          self.cell["parts"].append(value)

          raw=open(sys.argv[1],encoding="utf-8").read()
          p=P(); p.feed(raw)
          print("TOP_TABLES=", p.top_tables)
          for i,c in enumerate(p.cells):
              print(f"CELL[{i}] {c['kind']}=" + "".join(c["parts"]).strip())
          for tag in sorted(INTERESTING):
              print(f"RAW_TAG[{tag}]={('<'+tag) in raw}")
          PY
          }

          run_probe() {
            local name="$1"
            local rel="$2"
            if [ -z "$rel" ]; then rel="input.qd"; fi
            local dir="$root/$name"
            echo "::group::PROBE $name"
            set +e
            (
              cd "$dir"
              "$QD" --log-level error c "$rel" --pipe -r html --strict
            ) >"$dir/stdout.log" 2>"$dir/stderr.log"
            rc=$?
            set -e
            echo "RESULT name=$name rc=$rc"
            if [ -s "$dir/stderr.log" ]; then
              echo "STDERR:"
              sed -n '1,120p' "$dir/stderr.log"
            fi
            if [ "$rc" -eq 0 ]; then
              inspect_html "$dir/stdout.log"
            elif [ -s "$dir/stdout.log" ]; then
              echo "STDOUT:"
              sed -n '1,120p' "$dir/stdout.log"
            fi
            echo "::endgroup::"
          }

          for name in inline_rich quoted_markdown multiline block_like breaks empty_file header_only column_extract sort_rich filter_rich compute_rich unknown_mode
          do
            run_probe "$name" ""
          done
          run_probe nested_relative "nested/input.qd"
