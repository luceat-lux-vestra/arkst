schema = 1

[ruleset]
name = "Protect main"
required_check_integration_id = 15368

[docs_only_fast_path]
exact_paths = [
  "README.md",
  "AGENTS.md",
  "CHANGELOG.md",
  "CODE_OF_CONDUCT.md",
  "CONTRIBUTING.md",
  "SECURITY.md",
]
markdown_prefixes = ["docs/"]
excluded_prefixes = ["docs/legal/"]

[compatibility_scope]
# First-match policy: `run` is evaluated before `skip`. New, unmatched path
# classes fail closed until this registry is updated deliberately.
run = [
  "Cargo.toml",
  "Cargo.lock",
  "rust-toolchain.toml",
  "zizmor.yml",
  "crates/**",
  "tools/**",
  "tests/**",
  "fixtures/**",
  "examples/**",
  "docs/compatibility/**",
  ".github/gate-policy.toml",
  ".github/workflows/**",
]
skip = [
  ".github/**",
  "docs/**",
  "*.md",
  ".cargo/config.toml",
  ".gitignore",
  ".gitattributes",
  ".editorconfig",
  ".mailmap",
  "clippy.toml",
  "deny.toml",
  "typos.toml",
  "LICENSE",
  "NOTICE",
]

[[producer]]
workflow = ".github/workflows/ci.yml"
job = "scope"
classification = "advisory"
contexts = ["docs-only-scope"]
always_present = true
rationale = "Trusted-base changed-file classifier shared by required CI jobs; any uncertainty falls back to full validation."

[[producer]]
workflow = ".github/workflows/ci.yml"
job = "fmt"
classification = "merge_component"
contexts = ["fmt"]
always_present = true
rationale = "Formatting plus canonical merge-gate policy verification for substantive changes; trusted docs-only changes retain the required context without product/toolchain work."

[[producer]]
workflow = ".github/workflows/ci.yml"
job = "clippy"
classification = "merge_component"
contexts = ["clippy"]
always_present = true
rationale = "Workspace lint gate for substantive changes; trusted docs-only changes retain the required context without Rust lint work."

[[producer]]
workflow = ".github/workflows/ci.yml"
job = "test"
classification = "merge_component"
contexts = ["test (ubuntu-latest)", "test (macos-latest)", "test (windows-latest)"]
always_present = true
matrix_axis = "os"
matrix_values = ["ubuntu-latest", "macos-latest", "windows-latest"]
rationale = "Required three-OS workspace, CLI-boundary, and backend-parity tests for substantive changes; trusted docs-only changes retain all matrix contexts without product tests."

[[producer]]
workflow = ".github/workflows/ci.yml"
job = "wasm"
classification = "merge_component"
contexts = ["wasm"]
always_present = true
rationale = "Required platform-neutral WASM compile boundary for substantive changes; trusted docs-only changes retain the required context without compilation."

[[producer]]
workflow = ".github/workflows/ci.yml"
job = "doc"
classification = "merge_component"
contexts = ["docs"]
always_present = true
rationale = "Required Rust API documentation build for substantive changes; trusted docs-only Markdown changes use the spelling workflow instead of rebuilding Rust docs."

[[producer]]
workflow = ".github/workflows/ci.yml"
job = "deny"
classification = "merge_component"
contexts = ["license"]
always_present = true
rationale = "Authoritative cargo-deny plus license/provenance engineering gate for non-docs-only changes; trusted docs-only scope excludes legal policy and all dependency/provenance inputs before this work may be skipped."

[[producer]]
workflow = ".github/workflows/ci.yml"
job = "compatibility"
classification = "merge_component"
contexts = ["compatibility"]
always_present = true
rationale = "Always-present compatibility context; expensive campaign is controlled by the fail-closed compatibility scope registry."

[[producer]]
workflow = ".github/workflows/ci.yml"
job = "msrv"
classification = "merge_component"
contexts = ["msrv"]
always_present = true
rationale = "Required minimum-supported-Rust-version contract for substantive changes; trusted docs-only changes retain the required context without compiling on MSRV."

[[producer]]
workflow = ".github/workflows/ci.yml"
job = "dependency_review"
classification = "merge_component"
contexts = ["dependency-review"]
always_present = true
rationale = "Required diff-scoped dependency admission for non-docs-only changes; trusted docs-only scope cannot include dependency or workflow inputs, so the context may fast-path while cargo-deny remains authoritative for substantive changes."

[[producer]]
workflow = ".github/workflows/ci.yml"
job = "merge_gate"
classification = "required"
contexts = ["Merge Gate"]
always_present = true
rationale = "Sole live merge requirement. Fails closed unless every authoritative internal merge component in the canonical CI graph concludes success."

[[producer]]
workflow = ".github/workflows/codeql.yml"
job = "analyze"
classification = "advisory"
contexts = ["codeql (actions)", "codeql (rust)"]
always_present = true
matrix_axis = "language"
matrix_values = ["actions", "rust"]
rationale = "Always-present CodeQL advanced setup for GitHub Actions workflow and Rust static analysis. It is distinct security evidence and remains advisory until reliability and enforcement are separately proven."

[[producer]]
workflow = ".github/workflows/docs.yml"
job = "spelling"
classification = "path_scoped_optional"
contexts = ["spelling"]
always_present = false
rationale = "Documentation spelling check only applies when docs or Markdown files change."

[[producer]]
workflow = ".github/workflows/reference-jvm.yml"
job = "verify"
classification = "reference_generated_data_deep_check"
contexts = ["verify pinned Temurin 25 oracle"]
always_present = true
rationale = "Independent JDK25/reference-data oracle verification; deep evidence remains non-required until separately promoted by policy."

[[producer]]
workflow = ".github/workflows/security.yml"
job = "audit"
classification = "path_scoped_optional"
contexts = ["audit"]
always_present = false
rationale = "Full-graph cargo-deny audit on dependency/security-workflow changes plus a weekly schedule and manual dispatch; non-required because the PR-time license job is the authoritative blocking gate."

[[producer]]
workflow = ".github/workflows/security.yml"
job = "report-failure"
classification = "scheduled_deep"
contexts = ["report-scheduled-failure"]
always_present = false
rationale = "Scheduled/manual failure ownership automation. It is conditionally executed only after the non-required audit fails and never participates in merge authority."

[[producer]]
workflow = ".github/workflows/pr-labeler.yml"
job = "label"
classification = "advisory"
contexts = ["label"]
always_present = false
rationale = "PR metadata automation is non-authoritative and must never satisfy a merge requirement."
