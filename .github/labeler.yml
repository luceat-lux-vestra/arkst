# Arkst automatic PR area classification.
# Area labels are derived only from changed paths and synchronized on each PR update.

changed-files-labels-limit: 30
max-files-changed: 1000

area:ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - "deny.toml"
          - "rust-toolchain.toml"
          - "rustfmt.toml"
          - "typos.toml"

area:core:
  - changed-files:
      - any-glob-to-any-file:
          - "crates/arkst-core/**"

area:engine:
  - changed-files:
      - any-glob-to-any-file:
          - "crates/arkst-engine/**"

area:parser:
  - changed-files:
      - any-glob-to-any-file:
          - "crates/arkst-markdown/**"
          - "crates/arkst-quarkdown/**"

area:ir:
  - changed-files:
      - any-glob-to-any-file:
          - "crates/arkst-ir/**"

area:diagnostics:
  - changed-files:
      - any-glob-to-any-file:
          - "crates/arkst-diagnostics/**"

area:typst:
  - changed-files:
      - any-glob-to-any-file:
          - "crates/arkst-typst/**"
          - "crates/arkst-typst-inprocess/**"
          - "crates/arkst-typst-subprocess/**"

area:cli:
  - changed-files:
      - any-glob-to-any-file:
          - "crates/arkst-cli/**"

area:project:
  - changed-files:
      - any-glob-to-any-file:
          - "crates/arkst-project/**"
          - "crates/arkst-source/**"

area:compatibility:
  - changed-files:
      - any-glob-to-any-file:
          - "crates/arkst-compat/**"
          - "crates/arkst-quarkdown/**"
          - "fixtures/quarkdown-conformance/**"
          - "docs/compatibility/**"

# Test ownership is reserved for shared test infrastructure and fixture suites,
# not every implementation PR that also adds regression tests.
area:test:
  - changed-files:
      - any-glob-to-any-file:
          - "crates/arkst-test-support/**"
          - "fixtures/**"

area:legal:
  - changed-files:
      - any-glob-to-any-file:
          - "LICENSE"
          - "NOTICE"
          - "docs/legal/**"

area:docs:
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "**/*.md"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "**/Cargo.toml"
          - "Cargo.lock"
          - "deny.toml"
