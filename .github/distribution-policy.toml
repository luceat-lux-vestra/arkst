# Canonical distribution inventory for Scribium.
#
# This is deliberately fail-closed: every Cargo workspace package must be
# listed, and every package is explicitly non-publishable until a reviewed
# distribution decision changes this policy and the corresponding manifest.
schema_version = 1
decision = "no-current-public-distribution"
review_required = true

[channels.crates_io]
publishable = false
cargo_install = false
distribution_status = "not-intended"
publication_channel = "crates.io"

[channels.github_release]
publishable = false
package = "scribium-cli"
binary = "scribium"
distribution_status = "not-intended"
publication_channel = "none"

[channels.internal_tools]
publishable = false
distribution_status = "internal-only"
publication_channel = "none"

[channels.wasm]
artifact = "scribium-core + scribium-typst wasm32-unknown-unknown compile"
cargo_package = "none"
publishable = false
distribution_status = "compile-only"
publication_channel = "none"

[cli]
package = "scribium-cli"
binary = "scribium"
cargo_install = false
github_release = false
distribution_status = "not-intended"

[[packages]]
name = "scribium-cli"
manifest = "crates/scribium-cli/Cargo.toml"
version = "0.0.1"
consumer = "user-facing-cli"
distribution = "cli"
distribution_status = "not-intended"
publication_channel = "none"
artifact_kind = "binary"
library_targets = []
binary_targets = ["scribium"]
workspace_dependencies = [
    "scribium-core",
    "scribium-project",
    "scribium-typst",
    "scribium-typst-inprocess",
    "scribium-typst-subprocess",
]
publishable = false

[[packages]]
name = "scribium-compat"
manifest = "crates/scribium-compat/Cargo.toml"
version = "0.0.1"
consumer = "internal-toolchain"
distribution = "compiler-library"
distribution_status = "not-intended"
publication_channel = "none"
artifact_kind = "library"
library_targets = ["scribium_compat"]
binary_targets = []
workspace_dependencies = []
publishable = false

