# Canonical distribution inventory for Arkst.
#
# This is deliberately fail-closed: every Cargo workspace package must be
# listed, and every package is explicitly non-publishable until a reviewed
# distribution decision changes this policy and the corresponding manifest.
schema_version = 1
decision = "github-release-cli"
review_required = true

[channels.crates_io]
publishable = false
cargo_install = false
distribution_status = "not-intended"
publication_channel = "crates.io"

[channels.github_release]
publishable = true
package = "arkst-cli"
binary = "arkst"
distribution_status = "intended"
publication_channel = "github-releases"

[channels.internal_tools]
publishable = false
distribution_status = "internal-only"
publication_channel = "none"

[channels.wasm]
artifact = "arkst-core + arkst-typst wasm32-unknown-unknown compile"
cargo_package = "none"
publishable = false
distribution_status = "compile-only"
publication_channel = "none"

[cli]
package = "arkst-cli"
binary = "arkst"
cargo_install = false
github_release = true
distribution_status = "intended"

[[packages]]
name = "arkst-cli"
manifest = "crates/arkst-cli/Cargo.toml"
version = "0.0.1"
consumer = "user-facing-cli"
distribution = "cli"
distribution_status = "intended"
publication_channel = "github-releases"
artifact_kind = "binary"
library_targets = []
binary_targets = ["arkst"]
workspace_dependencies = [
    "arkst-core",
    "arkst-project",
    "arkst-typst",
    "arkst-typst-inprocess",
    "arkst-typst-subprocess",
]
publishable = false

[[packages]]
name = "arkst-compat"
manifest = "crates/arkst-compat/Cargo.toml"
version = "0.0.1"
consumer = "internal-toolchain"
distribution = "compiler-library"
distribution_status = "not-intended"
publication_channel = "none"
artifact_kind = "library"
library_targets = ["arkst_compat"]
binary_targets = []
workspace_dependencies = []
publishable = false

